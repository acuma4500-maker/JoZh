<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f2116">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Türk Köyü</title>
<style>
/* =========================================================
   STİL — telefon dikey ekranı için
   ========================================================= */
:root{
  --bar:rgba(47,33,22,.92); --ink:#fff6e6; --acc:#e9a23b; --acc2:#c0442f;
  --card:#fffaf1; --cardink:#3a2a1b; --muted:#8c7a63; --line:#eadcc4; --ok:#4f8a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2f2116;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--cardink);
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* Üst çubuk */
#top{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--bar);color:var(--ink);
  padding:calc(env(safe-area-inset-top) + 5px) 8px 6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#top .row{display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap;overflow:hidden}
#top .row+.row{margin-top:5px}
#top .sp{flex:1}
#tDate{font-weight:700}
.pill{background:rgba(255,255,255,.1);border-radius:10px;padding:2px 6px}
#speeds{display:flex;gap:3px}
#speeds button,.tb{border:0;background:rgba(255,255,255,.12);color:var(--ink);border-radius:8px;
  min-width:34px;height:30px;font-size:13px;font-weight:600;padding:0 5px}
#speeds button.on{background:var(--acc);color:#2f2116}
.tb.on{background:#7b4fd6}
#modeChip{margin-top:5px;font-size:12px;background:#7b4fd6;color:#fff;border-radius:8px;padding:4px 8px;display:flex;gap:8px;align-items:center}
#modeChip button{border:0;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 8px;color:#fff}

/* Alt haber şeridi */
#ticker{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(36px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--bar);color:var(--ink);display:flex;align-items:center;font-size:13px}
#ticker .lbl{padding:0 8px;font-weight:700;color:var(--acc);flex:none}
#ticker .tk{flex:1;overflow:hidden;position:relative;height:100%}
#tkText{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;will-change:transform}
#fab{position:fixed;right:10px;bottom:calc(46px + env(safe-area-inset-bottom));z-index:6;border:0;
  background:#7b4fd6;color:#fff;font-weight:700;border-radius:22px;padding:11px 16px;box-shadow:0 3px 10px rgba(0,0,0,.35)}

/* Alt çekmece (panel) */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:82%;background:var(--card);
  border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.4);display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);touch-action:pan-y;user-select:text;-webkit-user-select:text}
.sh-head{display:flex;align-items:center;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.sh-head b{flex:1;font-size:16px}
#shBack,#shClose{border:0;background:#f1e6d2;border-radius:8px;width:34px;height:30px;font-size:15px}
#shBack{margin-right:8px}
#shBody{overflow-y:auto;padding:10px 14px 18px;-webkit-overflow-scrolling:touch;font-size:14px}
.sec{margin:12px 0 6px;font-weight:700;color:var(--acc2);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv span:first-child{color:var(--muted)}
.chip{display:inline-block;background:#f1e6d2;border-radius:10px;padding:2px 8px;margin:2px;font-size:12px}
.chip.p{cursor:pointer;border:0}
.chip.dead{opacity:.55;text-decoration:line-through}
.bar{height:8px;background:#eee2cc;border-radius:5px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;border-radius:5px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:0;background:var(--acc);color:#2f2116;font-weight:700;border-radius:10px;padding:9px 12px;font-size:13px}
.btn.s{background:#f1e6d2;color:var(--cardink)}
.btn.r{background:var(--acc2);color:#fff}
.btn.v{background:#7b4fd6;color:#fff}
.btn:disabled{opacity:.4}
.list .it{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it .nm{flex:1}
.list .it small{color:var(--muted)}
.tag{font-size:11px;border-radius:8px;padding:1px 6px;background:#eee}
.tag.g{background:#dcefd3;color:#2f6a21}.tag.b{background:#f7d7d0;color:#9b2c19}.tag.l{background:#f8d9ec;color:#a02a6f}
.tree{display:flex;flex-direction:column;gap:6px;align-items:center;background:#f7efe0;border-radius:12px;padding:8px}
.tree .lv{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.tree .lvl{font-size:10px;color:var(--muted);width:100%;text-align:center}
.tree .me{background:var(--acc);font-weight:700}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:6px;background:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:0;background:#f1e6d2;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600}
.tabs button.on{background:var(--acc)}
.news .n{padding:6px 0;border-bottom:1px solid var(--line)}
.news .n small{color:var(--muted);display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 .btn{width:100%}
.note{color:var(--muted);font-size:12px;margin:6px 0}

/* Diyalog */
#dlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg-box{background:var(--card);border-radius:14px;padding:16px;max-width:380px;width:100%;box-shadow:0 6px 30px rgba(0,0,0,.5)}
#dlgText{font-size:15px;line-height:1.45}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;
  background:rgba(47,33,22,.95);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13px;
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div class="row">
    <span id="tDate"></span><span id="tSeason" class="pill"></span><span id="tTime" class="pill"></span>
    <span class="sp"></span><span id="tPop" class="pill"></span><span id="tTre" class="pill"></span>
  </div>
  <div class="row">
    <div id="speeds">
      <button data-s="0">⏸</button><button data-s="1">1x</button><button data-s="2">2x</button>
      <button data-s="5">5x</button><button data-s="10">10x</button>
    </div>
    <span class="sp"></span>
    <button class="tb" id="bNews" title="Haberler">📰</button>
    <button class="tb" id="bStats" title="İstatistik">📊</button>
    <button class="tb" id="bGod" title="Tanrı modu">⚡</button>
    <button class="tb" id="bMenu" title="Menü">☰</button>
  </div>
  <div id="modeChip" class="hidden"></div>
</div>

<button id="fab" class="hidden">🎮 Eylemler</button>
<div id="ticker"><span class="lbl">📰</span><div class="tk"><div id="tkText"></div></div></div>

<div id="sheet" class="hidden">
  <div class="sh-head"><button id="shBack" class="hidden">←</button><b id="shTitle"></b><button id="shClose">✕</button></div>
  <div id="shBody"></div>
</div>
<div id="dlg" class="hidden"><div class="dlg-box"><div id="dlgText"></div><div id="dlgBtns" class="btns"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   TÜRK KÖYÜ YAŞAM SİMÜLASYONU
   ---------------------------------------------------------------------
   Bölümler:
    1) Sabitler ve veriler         9) Seçim ve muhtarlık
    2) Yardımcılar                10) Günlük program ve yürüme
    3) Harita yerleşimi           11) Çizim (statik harita + canlı katman)
    4) Kişiler ve ilişkiler       12) Dokunmatik girdi
    5) Başlangıç nüfusu           13) Arayüz (paneller)
    6) Ekonomi                    14) Oyuncu eylemleri ve Tanrı modu
    7) Yaşam döngüsü              15) Kayıt / yükleme
    8) Örf ve âdetler, sosyal     16) Ana döngü
   S = kaydedilen oyun durumu, R = kaydedilmeyen çalışma durumu
   ===================================================================== */

/* ======================= 1) SABİTLER VE VERİLER ======================= */
const START_YEAR = 2025;
const DAY_MIN = 1440;                       // bir gün = 1440 oyun dakikası
const MONTH_DAYS = 30, YEAR_DAYS = 360;     // oyun takvimi: 30 günlük 12 ay
const GAME_MIN_PER_SEC = MONTH_DAYS * DAY_MIN / 300; // 5 gerçek dk = 1 oyun ayı
const MAX_POP = 300;
const WALK = 3;                              // yürüme hızı (piksel / oyun dakikası)
const SAVE_KEY = 'turkKoyuSim_v1';

const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MEVSIM = m => (m === 11 || m <= 1) ? 0 : (m <= 4 ? 1 : (m <= 7 ? 2 : 3)); // 0 kış,1 ilkbahar,2 yaz,3 sonbahar
const MEVSIM_AD = ['Kış','İlkbahar','Yaz','Sonbahar'];
const MEVSIM_IKON = ['❄️','🌸','☀️','🍂'];

const ERKEK = ['Mehmet','Ahmet','Mustafa','Ali','Hüseyin','Hasan','İbrahim','İsmail','Osman','Yusuf','Murat','Ömer',
  'Ramazan','Halil','Süleyman','Abdullah','Mahmut','Recep','Salih','Kemal','Fatih','Emre','Burak','Serkan','Hakan',
  'Kadir','Yaşar','Cemal','Erkan','Orhan','Bayram','Selim','Kenan','Volkan','Cengiz','Rıza','Veli','Durmuş','Adem',
  'Musa','Yunus','Eyüp','Tahir','Nuri','Şükrü','Emin','Hamza','Kerem','Arda','Efe','Berat','Yiğit','Enes','Furkan',
  'Mert','Can','Oğuz','Tuncay','Necati','Sefer','İlyas','Cafer','Zeki','Metin'];
const KADIN = ['Fatma','Ayşe','Emine','Hatice','Zeynep','Elif','Meryem','Şerife','Zehra','Sultan','Hanife','Hacer',
  'Havva','Zeliha','Hülya','Gülsüm','Esra','Merve','Büşra','Kübra','Özlem','Yasemin','Sevgi','Songül','Nurcan','Dilek',
  'Derya','Gül','Fadime','Döndü','Naciye','Saniye','Kader','Esma','Rabia','Sümeyye','Asiye','Nermin','Şükran','Melek',
  'Selma','Gülay','Filiz','Leyla','Ebru','Pınar','Tuba','Nazlı','Ecrin','Defne','Azra','Ela','Nisa','Hira','Yaren',
  'Ceren','Aysel','Gülizar','Medine','Cennet'];
const SOYAD = ['Yılmaz','Kaya','Demir','Şahin','Çelik','Yıldız','Yıldırım','Öztürk','Aydın','Özdemir','Arslan','Doğan',
  'Kılıç','Aslan','Çetin','Kara','Koç','Kurt','Özkan','Şimşek','Polat','Korkmaz','Karaca','Uçar','Tekin','Bulut',
  'Güneş','Akın','Ateş','Duman','Taş','Keskin','Aksoy','Avcı','Ekinci','Sarı','Coşkun','Toprak','Kaplan','Güler',
  'Ünal','Tunç','Tosun','Turan','Gök','Bozkurt'];

const KISILIK = {hirsli:'Hırslı', comert:'Cömert', cimri:'Cimri', dedikoducu:'Dedikoducu', sinirli:'Sinirli',
  sakin:'Sakin', caliskan:'Çalışkan', tembel:'Tembel', dindar:'Dindar', kurnaz:'Kurnaz', neseli:'Neşeli'};
const ZIT = {comert:'cimri', cimri:'comert', sinirli:'sakin', sakin:'sinirli', caliskan:'tembel', tembel:'caliskan'};
const HEDEF = {zengin:'Zengin olmak', muhtar:'Muhtar olmak', saygin:'Köyün en saygını olmak', is:'Kendi işini kurmak', aile:'İyi bir aile kurmak'};
const EGITIM = ['Okumamış','İlkokul','Ortaokul','Lise','Üniversite'];
const OKUL_AD = {ilkokul:'İlkokul', ortaokul:'Ortaokul', lise:'Lise', uni:'Üniversite'};
const MESLEK = {ciftci:'Çiftçi', hayvanci:'Hayvancı', isci:'Çalışan', sahip:'İşletme sahibi', ogretmen:'Öğretmen',
  doktor:'Doktor', hemsire:'Hemşire', imam:'İmam', ev:'Ev işleri', emekli:'Emekli', issiz:'İşsiz'};

/* İşletme türleri. cat = aynı pazarı paylaşan kategori (rekabet), w = pazar payı ağırlığı */
const ISLETME = {
  bakkal:   {ad:'Bakkal',    ikon:'🛒', cost:40000,  cat:'gida',   w:1,   margin:.26, staff:1, pop:0,   renk:'#4f8a3c'},
  kahvehane:{ad:'Kahvehane', ikon:'☕', cost:30000,  cat:'kahve',  w:1,   margin:.42, staff:1, pop:0,   renk:'#8b5a2b'},
  berber:   {ad:'Berber',    ikon:'💈', cost:25000,  cat:'berber', w:1,   margin:.55, staff:1, pop:100, renk:'#3a6ea5'},
  firin:    {ad:'Fırın',     ikon:'🥖', cost:50000,  cat:'firin',  w:1,   margin:.32, staff:1, pop:110, renk:'#c98a3a'},
  market:   {ad:'Market',    ikon:'🏬', cost:120000, cat:'gida',   w:2.2, margin:.30, staff:2, pop:150, renk:'#b8392b'},
  benzinlik:{ad:'Benzinlik', ikon:'⛽', cost:200000, cat:'yakit',  w:1,   margin:.18, staff:2, pop:160, renk:'#d35400'},
  galeri:   {ad:'Araba Galerisi', ikon:'🚗', cost:300000, cat:'araba', w:1, margin:.14, staff:2, pop:200, renk:'#2c3e50'},
};
/* Kişi başı aylık harcama (kategori pazar büyüklüğü) */
const KATEGORI = {gida:350, kahve:150, firin:200, berber:90, yakit:300, araba:420};

/* Muhtarın yapabileceği kamu yatırımları */
const PROJE = {
  cesme:    {ad:'Çeşme',        ikon:'⛲', cost:25000,  ay:1, max:4},
  park:     {ad:'Park',         ikon:'🌳', cost:60000,  ay:2},
  ortaokul: {ad:'Ortaokul',     ikon:'🏫', cost:220000, ay:4},
  asfalt:   {ad:'Asfalt Yol',   ikon:'🛣️', cost:150000, ay:3},
  saglik:   {ad:'Sağlık Ocağı', ikon:'🏥', cost:260000, ay:4},
  kutuphane:{ad:'Kütüphane',    ikon:'📚', cost:110000, ay:3},
  lise:     {ad:'Lise',         ikon:'🎓', cost:380000, ay:5},
  salon:    {ad:'Düğün Salonu', ikon:'💒', cost:170000, ay:3},
};
/* Kamu iş kadroları */
const KADRO = {ogretmen:{ilkokul:2, ortaokul:3, lise:4}, doktor:1, hemsire:2, imam:1};

/* ======================= 2) YARDIMCILAR ======================= */
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function para(n) {
  n = Math.round(n); const neg = n < 0; n = Math.abs(n); let s;
  if (n >= 1e6) s = (n / 1e6).toFixed(1).replace('.', ',') + ' Mn';
  else if (n >= 1e4) s = Math.round(n / 1000) + ' bin';
  else s = n.toLocaleString('tr-TR');
  return (neg ? '-' : '') + s + ' ₺';
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Türkçe ekler (ünlü uyumu): Ali'nin, Ahmet'e, Ayşe'yi, Mehmet'le */
const UNLU = 'aeıioöuü';
function sonUnlu(w) { for (let i = w.length - 1; i >= 0; i--) { const c = w[i].toLocaleLowerCase('tr'); if (UNLU.includes(c)) return c; } return 'e'; }
const unluBiter = w => UNLU.includes(w[w.length - 1].toLocaleLowerCase('tr'));
const ek4 = w => ({a:'ı', ı:'ı', e:'i', i:'i', o:'u', u:'u', ö:'ü', ü:'ü'})[sonUnlu(w)];
const ek2 = w => 'aıou'.includes(sonUnlu(w)) ? 'a' : 'e';
const nin = w => w + "'" + (unluBiter(w) ? 'n' : '') + ek4(w) + 'n';
const ye  = w => w + "'" + (unluBiter(w) ? 'y' : '') + ek2(w);
const yi  = w => w + "'" + (unluBiter(w) ? 'y' : '') + ek4(w);
const yle = w => w + "'" + (unluBiter(w) ? 'y' : '') + 'l' + ek2(w);

/* Zaman */
const curDay = () => Math.floor(S.min / DAY_MIN);
const curMonth = () => Math.floor(curDay() / MONTH_DAYS);
const curYear = () => START_YEAR + Math.floor(curMonth() / 12);
const moy = () => curMonth() % 12;
const hourNow = () => (S.min % DAY_MIN) / 60;
function tarihStr(day) { if (day == null) day = curDay(); const mi = Math.floor(day / MONTH_DAYS); return (day % MONTH_DAYS + 1) + ' ' + AYLAR[mi % 12] + ' ' + (START_YEAR + Math.floor(mi / 12)); }
const ageY = p => (((p.dead || p.left) ? p.dm : curMonth()) - p.b) / 12;
const age = p => Math.floor(ageY(p));

/* Bayramlar: kameri takvim her yıl ~11 gün geri kayar. 2025'te Ramazan Bayramı 30 Mart. */
function bayramGunleri(year) { const r = ((89 - 11 * (year - START_YEAR)) % 360 + 360) % 360; return {ram: r, kur: (r + 69) % 360}; }
function bayramToday(day) {
  const y = Math.floor(day / YEAR_DAYS);
  for (const yy of [y - 1, y]) {
    const b = bayramGunleri(START_YEAR + yy), base = yy * YEAR_DAYS;
    for (const [k, len] of [['ram', 3], ['kur', 4]]) {
      const st = base + b[k];
      if (day >= st && day < st + len) return {k, n: day - st};
    }
  }
  return null;
}
const BAYRAM_AD = {ram:'Ramazan Bayramı', kur:'Kurban Bayramı'};

/* ======================= 3) HARİTA YERLEŞİMİ =======================
   Harita 4x8 bloktan oluşur; bloklar arasında ızgara yollar vardır.
   Her mekânın kapısı bir yol çizgisinin üzerindedir; böylece yürüme
   yolu basit L biçimli rotalarla bulunur. */
const VX = [40, 310, 580, 850, 1120];
const HY = [40, 265, 490, 715, 940, 1165, 1390, 1615, 1840];
const WORLD_W = 1160, WORLD_H = 1880;
const BLOK = [
  ['H', 'H', 'H', 'H'],
  ['H', 'CAMI', 'MEYDAN', 'H'],
  ['H', 'CARSI', 'CARSI', 'H'],
  ['H', 'OKUL', 'KAMU', 'H'],
  ['H', 'H', 'H', 'H'],
  ['AHIR', 'H', 'H', 'MEZAR'],
  ['TARLA', 'TARLA', 'TARLA', 'TARLA'],
  ['TARLA', 'TARLA', 'TARLA', 'AHIR'],
];
let M = null; // harita mekânları

function buildMap() {
  M = {houses: [], lots: [], tarla: [], ahir: [], cesmeSpots: [], strips: [], blocks: []};
  for (let r = 0; r < 8; r++) for (let c = 0; c < 4; c++) {
    const t = BLOK[r][c];
    const bx = VX[c] + 10, by = HY[r] + 10, bw = VX[c + 1] - VX[c] - 20, bh = HY[r + 1] - HY[r] - 20;
    const blk = {t, bx, by, bw, bh, r, c}; M.blocks.push(blk);
    const topY = HY[r], botY = HY[r + 1], midX = bx + bw / 2;
    if (t === 'H') {
      const slot = bw / 4;
      for (let row = 0; row < 2; row++) for (let k = 0; k < 4; k++) {
        const x = bx + k * slot + 8, y = row ? by + bh - 46 : by + 6;
        M.houses.push({kind: 'ev', idx: M.houses.length, x, y, w: 46, h: 40, face: row ? 'b' : 't',
          door: {x: x + 23, y: row ? botY : topY}});
      }
      M.strips.push({x: bx, y: by + 50, w: bw, h: bh - 100});
      M.cesmeSpots.push({x: midX, y: by + bh / 2});
    } else if (t === 'CARSI') {
      const slot = bw / 4;
      for (let row = 0; row < 2; row++) for (let k = 0; k < 4; k++) {
        const x = bx + k * slot + 3, y0 = row ? by + bh - 64 : by + 2;
        const lot = {kind: 'lot', idx: M.lots.length, x, y: y0, w: 56, h: 62, face: row ? 'b' : 't',
          door: {x: x + 28, y: row ? botY : topY}};
        if (row) { lot.bld = {x, y: y0, w: 56, h: 42}; lot.yard = {x, y: y0 + 44, w: 56, h: 18}; }
        else { lot.yard = {x, y: y0, w: 56, h: 18}; lot.bld = {x, y: y0 + 20, w: 56, h: 42}; }
        M.lots.push(lot);
      }
    } else if (t === 'CAMI') {
      M.cami = {kind: 'cami', x: bx + 65, y: by + 70, w: 120, h: 112, door: {x: midX, y: topY},
        yard: {x: bx + 15, y: by + 8, w: bw - 30, h: 52}};
    } else if (t === 'MEYDAN') {
      M.muhtarlik = {kind: 'muhtarlik', x: bx + 8, y: by + 6, w: 72, h: 50, door: {x: bx + 44, y: topY}};
      M.meydan = {kind: 'meydan', x: bx, y: by, w: bw, h: bh, door: {x: bx + 170, y: topY},
        yard: {x: bx + 20, y: by + 70, w: bw - 40, h: bh - 82}, cx: midX, cy: by + 132};
    } else if (t === 'OKUL') {
      M.okul = {};
      ['ilkokul', 'ortaokul', 'lise'].forEach((k, i) => {
        const x = bx + 6 + i * 82;
        M.okul[k] = {kind: 'okul', key: k, x, y: by + 6, w: 74, h: 78, door: {x: x + 37, y: topY}};
      });
      M.okulBahce = {x: bx + 8, y: by + 100, w: bw - 16, h: bh - 110};
      // Okul bahçesi için ayrı bir mekân: kapısı alt yolda
      M.okulAvlu = {kind: 'avlu', x: bx + 8, y: by + 100, w: bw - 16, h: bh - 110, door: {x: midX, y: botY}, yard: M.okulBahce};
    } else if (t === 'KAMU') {
      M.kamu = {};
      const defs = [['saglik', 0, 0], ['kutuphane', 1, 0], ['park', 0, 1], ['salon', 1, 1]];
      for (const [k, i, row] of defs) {
        const x = bx + 6 + i * 123, y = row ? by + bh - 92 : by + 6;
        M.kamu[k] = {kind: 'kamu', key: k, x, y, w: 115, h: 86, door: {x: x + 57, y: row ? botY : topY},
          yard: {x: x + 8, y: y + 8, w: 99, h: 70}};
      }
    } else if (t === 'AHIR') {
      M.ahir.push({kind: 'ahir', idx: M.ahir.length, x: bx + 8, y: by + 8, w: 82, h: 56, door: {x: bx + 49, y: topY},
        yard: {x: bx + 100, y: by + 14, w: bw - 108, h: bh - 24}, mera: {x: bx + 100, y: by + 14, w: bw - 108, h: bh - 24}});
    } else if (t === 'TARLA') {
      M.tarla.push({kind: 'tarla', idx: M.tarla.length, x: bx + 4, y: by + 4, w: bw - 8, h: bh - 8, door: {x: midX, y: topY},
        yard: {x: bx + 10, y: by + 10, w: bw - 20, h: bh - 20}});
    } else if (t === 'MEZAR') {
      M.mezar = {kind: 'mezar', x: bx + 6, y: by + 6, w: bw - 12, h: bh - 12, door: {x: midX, y: topY},
        yard: {x: bx + 14, y: by + 14, w: bw - 28, h: 40}};
    }
  }
}

/* ======================= 4) KİŞİLER VE İLİŞKİLER ======================= */
let S = null;                       // kaydedilen durum
const R = {                         // çalışma zamanı durumu (kaydedilmez)
  ag: {}, alive: null, hm: null, gather: [], gatherBy: new Map(),
  cam: {x: 0, y: 0, z: 1}, follow: null, sel: null, mapDirty: true, speedBeforeModal: 1,
  modal: false, askQ: [], sheetStack: [], tk: {x: 0, w: 0}, toastT: 0,
};

const P = id => (id == null ? null : S.people[id]);
const isAlive = p => p && !p.dead && !p.left;
const present = p => isAlive(p) && !p.away;
const has = (p, t) => p.tr.includes(t);
const fn = p => p.n + ' ' + p.s;
const controlled = p => S.ctrl === p.id;

function newPerson(o) {
  const p = Object.assign({
    id: S.nextId++, n: '', s: '', ms: null, g: 'E', b: 0, dead: false, left: false, dm: 0,
    f: null, m: null, sp: null, ch: [], h: -1, money: 0, debt: 0, rep: 50, hap: 65, hl: 92,
    edu: 0, school: null, zeka: ri(20, 95), tr: [], goal: 'aile', job: null, away: null, ret: 0,
    askerDone: false, rel: {}, rom: {}, kus: {}, mood: 0, cand: false, goalDone: false, worked: false,
    dul: false, borcHaber: false,
  }, o);
  S.people[p.id] = p; dirty();
  return p;
}
function dirty() { R.alive = null; R.hm = null; R.present = null; }

/* Yaşayan köylüler (askerde/üniversitede olanlar dahil) */
function alive() {
  if (!R.alive) R.alive = Object.values(S.people).filter(isAlive);
  return R.alive;
}
function presentList() { if (!R.present) R.present = alive().filter(p => !p.away); return R.present; }

/* Hane üyeleri (aynı evde yaşayanlar) */
function hm(i) {
  if (!R.hm) { R.hm = {}; for (const p of alive()) if (p.h >= 0) (R.hm[p.h] = R.hm[p.h] || []).push(p); }
  return R.hm[i] || [];
}

function randomTraits() {
  const keys = Object.keys(KISILIK), t = [];
  while (t.length < 2) { const k = pick(keys); if (!t.includes(k) && ZIT[k] !== t[0]) t.push(k); }
  return t;
}
function randomGoal(tr) {
  const w = {zengin: 2, muhtar: 1, saygin: 2, is: 1.5, aile: 3};
  if (tr.includes('hirsli')) { w.zengin += 3; w.muhtar += 2.5; w.is += 2; }
  if (tr.includes('kurnaz')) { w.zengin += 2; w.muhtar += 1.5; w.is += 1.5; }
  if (tr.includes('dindar')) { w.saygin += 2; w.aile += 2; }
  if (tr.includes('comert')) w.saygin += 2;
  if (tr.includes('caliskan')) w.is += 1.5;
  if (tr.includes('tembel')) { w.is -= 1; w.zengin -= 1; w.aile += 1; }
  let sum = 0; for (const k in w) sum += Math.max(0.2, w[k]);
  let x = Math.random() * sum;
  for (const k in w) { x -= Math.max(0.2, w[k]); if (x <= 0) return k; }
  return 'aile';
}

/* İlişki puanı (-100..+100). Her iki tarafta ayrı tutulur. */
const relV = (a, b) => a.rel[b.id] || 0;
function changeRel(a, b, d, sym = true) {
  if (a === b) return;
  a.rel[b.id] = clamp((a.rel[b.id] || 0) + d, -100, 100);
  if (sym) b.rel[a.id] = clamp((b.rel[a.id] || 0) + d, -100, 100);
}
function setKus(a, b, on) {
  if (on) { a.kus[b.id] = 1; b.kus[a.id] = 1; } else { delete a.kus[b.id]; delete b.kus[a.id]; }
}

/* Aileler (soyadı = sülale) arası ilişki */
const clanKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
const clanRel = (a, b) => a === b ? 50 : (S.clan[clanKey(a, b)] || 0);
function changeClan(a, b, d) {
  if (a === b) return;
  const k = clanKey(a, b), old = S.clan[k] || 0, v = clamp(old + d, -100, 100);
  S.clan[k] = v;
  if (old > -50 && v <= -50) news('⚔️', `${a} ve ${b} aileleri arasında husumet başladı!`);
  if (old < 50 && v >= 50) news('🤝', `${a} ve ${b} aileleri arasında sıkı bir dostluk/akrabalık bağı oluştu.`);
}

/* Akrabalık: ortak ebeveyn/büyükebeveyn ya da doğrudan soy ilişkisi */
function ancestors(p, depth = 2) {
  const set = new Set(); let cur = [p];
  for (let i = 0; i < depth; i++) {
    const nx = [];
    for (const q of cur) for (const id of [q.f, q.m]) { if (id != null && S.people[id]) { set.add(id); nx.push(S.people[id]); } }
    cur = nx;
  }
  return set;
}
function isKin(a, b) {
  if (a.id === b.id) return true;
  const A = ancestors(a), B = ancestors(b);
  if (A.has(b.id) || B.has(a.id)) return true;
  for (const x of A) if (B.has(x)) return true;
  return false;
}
function kinLabel(p, q) {
  if (p.sp === q.id) return q.g === 'E' ? 'Kocası' : 'Karısı';
  if (p.f === q.id) return 'Babası'; if (p.m === q.id) return 'Annesi';
  if (q.f === p.id || q.m === p.id) return q.g === 'E' ? 'Oğlu' : 'Kızı';
  if ((p.f != null && p.f === q.f) || (p.m != null && p.m === q.m)) return q.g === 'E' ? 'Kardeşi (erkek)' : 'Kardeşi (kız)';
  const A = ancestors(p);
  if (A.has(q.id)) return q.g === 'E' ? 'Dedesi' : 'Ninesi';
  if (ancestors(q).has(p.id)) return 'Torunu';
  return null;
}
function relLabel(p, q) {
  const v = relV(p, q), r = p.rom[q.id] || 0;
  if (p.kus[q.id]) return ['Küs', 'b'];
  if (p.sp === q.id) return v > 30 ? ['Mutlu evlilik', 'l'] : v < -20 ? ['Sorunlu evlilik', 'b'] : ['Eş', 'l'];
  if (r >= 60) return ['Aşk', 'l']; if (r >= 25) return ['Hoşlanma', 'l'];
  if (v >= 60) return ['Yakın dost', 'g']; if (v >= 25) return ['Dost', 'g'];
  if (v <= -60) return ['Düşman', 'b']; if (v <= -25) return ['Hoşlanmıyor', 'b'];
  return ['Tanıdık', ''];
}

function houseOf(p) { return p.h >= 0 ? M.houses[p.h] : null; }
function marriedStatus(p) {
  if (p.sp != null) return 'Evli';
  const c = courtOf(p.id); if (c && c.st !== 'isteme') return 'Nişanlı';
  if (p.dul) return p.g === 'E' ? 'Dul (erkek)' : 'Dul';
  if (p.bosandi) return 'Boşanmış';
  return 'Bekâr';
}
function children(p) { return p.ch.map(P).filter(Boolean); }
function siblings(p) {
  const out = new Set();
  for (const pid of [p.f, p.m]) { const par = P(pid); if (par) for (const c of par.ch) if (c !== p.id) out.add(c); }
  return [...out].map(P).filter(Boolean);
}

/* Hedef ilerlemesi 0..1 */
function goalProgress(p) {
  switch (p.goal) {
    case 'zengin': return clamp(p.money / 300000, 0, 1);
    case 'muhtar': return S.muhtar === p.id ? 1 : (p.goalDone ? 1 : clamp(p.rep / 80, 0, .9));
    case 'saygin': { const rank = alive().filter(q => age(q) >= 18 && q.rep > p.rep).length; return rank < 3 ? 1 : clamp(1 - rank / 40, 0, .95); }
    case 'is': return p.job && p.job.t === 'sahip' ? 1 : clamp(p.money / 60000, 0, .9);
    case 'aile': return p.sp != null ? (p.ch.length >= 2 ? 1 : .6 + .2 * p.ch.length) : .1;
  }
  return 0;
}

function newsQuota(cat, n) {
  const m = curMonth();
  if (!R.nq || R.nq.m !== m) R.nq = {m};
  R.nq[cat] = (R.nq[cat] || 0) + 1;
  return R.nq[cat] <= n;
}
function news(icon, s) {
  S.news.push({d: curDay(), i: icon, s});
  if (S.news.length > 250) S.news.splice(0, S.news.length - 250);
}

/* ======================= 5) BAŞLANGIÇ NÜFUSU =======================
   100 kişi: 60 erkek, 40 kadın. 17 evli çift (34 evli yetişkin),
   34 bekâr yetişkin ve 32 çocuk/genç. */
function newGame() {
  S = {v: 1, min: (2 * MONTH_DAYS) * DAY_MIN + 7 * 60, nextId: 1, people: {}, built: [], biz: [], nextBiz: 1,
    proj: {}, treasury: 60000, clan: {}, news: [], hist: [], elections: [], muhtar: null, muhtarSince: 0,
    events: [], courts: [], harvest: 1, harvestSet: null, graves: 0, speed: 1, ctrl: null, god: false,
    secim: null, lastMonth: 0, termProjects: 0, intro: false};
  for (const k in PROJE) S.proj[k] = {st: 0, kalan: 0, n: 0};
  S.built = M.houses.map(() => false);
  S.lastMonth = curMonth();

  const usedSurnames = shuffle(SOYAD.slice());
  const clans = usedSurnames.slice(0, 16);
  const mo = curMonth();
  const birthFor = a => mo - Math.round(a * 12) - ri(0, 11);
  let mLeft = 60, fLeft = 40;
  const mk = (g, a, s, extra) => {
    const tr = randomTraits();
    return newPerson(Object.assign({g, n: pick(g === 'E' ? ERKEK : KADIN), s, b: birthFor(a), tr, goal: randomGoal(tr),
      rep: ri(30, 70), hap: ri(50, 80), hl: clamp(Math.round(100 - Math.max(0, a - 40) * 0.8 - rnd(0, 10)), 25, 100)}, extra || {}));
  };
  const eduFor = a => { const r = Math.random(); if (a >= 60) return r < .3 ? 0 : 1; if (a >= 40) return r < .5 ? 1 : (r < .8 ? 2 : 3); return r < .15 ? 1 : (r < .4 ? 2 : (r < .85 ? 3 : 4)); };
  const moneyFor = a => Math.round((a < 18 ? 0 : (a < 25 ? rnd(2000, 15000) : rnd(8000, 60000) * (chance(.12) ? 4 : 1))) / 100) * 100;

  // 1) Evli çiftler
  const hAges = [26, 28, 30, 32, 34, 35, 38, 41, 44, 46, 48, 50, 54, 58, 63, 68, 74];
  const couples = [];
  hAges.forEach((ha, i) => {
    const s = clans[i % clans.length];
    const wa = Math.max(19, ha - ri(1, 6));
    const h = mk('E', ha, s); const w = mk('K', wa, s, {ms: pick(clans.filter(c => c !== s))});
    h.sp = w.id; w.sp = h.id; mLeft--; fLeft--;
    h.edu = eduFor(ha); w.edu = Math.max(0, eduFor(wa) - (chance(.4) ? 1 : 0));
    h.money = moneyFor(ha); w.money = Math.round(moneyFor(wa) * .4);
    h.askerDone = true;
    changeRel(h, w, ri(30, 85)); h.rom[w.id] = ri(30, 80); w.rom[h.id] = ri(30, 80);
    couples.push({h, w, kids: []});
  });
  const addChild = (cp, c) => {
    // Kardeşlerin adı aynı olmasın
    while (cp.kids.some(k => k.n === c.n)) c.n = pick(c.g === 'E' ? ERKEK : KADIN);
    c.f = cp.h.id; c.m = cp.w.id; cp.h.ch.push(c.id); cp.w.ch.push(c.id); cp.kids.push(c);
  };

  // 2) Bekâr yetişkinler: 26 erkek, 8 kadın (kimisi ailesinin yanında, kimisi yalnız, kimisi dul yaşlı)
  const singles = [];
  const singleSpecs = [];
  for (let i = 0; i < 26; i++) singleSpecs.push('E');
  for (let i = 0; i < 8; i++) singleSpecs.push('K');
  shuffle(singleSpecs);
  const loneHouseholds = [];
  for (const g of singleSpecs) {
    const r = Math.random();
    let a = r < .62 ? ri(18, 31) : (r < .82 ? ri(32, 52) : ri(62, 86));
    if (a <= 31) {
      const cp = shuffle(couples.slice()).find(c => (age(c.w) >= a + 19) && c.kids.length < 5);
      if (cp) { const c = mk(g, a, cp.h.s); addChild(cp, c); singles.push(c); c.edu = eduFor(a); c.money = moneyFor(a); if (g === 'E' && a >= 21) c.askerDone = true; if (g === 'E') mLeft--; else fLeft--; continue; }
    }
    if (a >= 62) {
      // dul yaşlı: oğlunun hanesinde yaşar
      const cp = couples.find(c => !c.h.f && age(c.h) <= a - 20 && age(c.h) >= a - 40);
      if (cp) {
        const e = mk(g, a, cp.h.s, {dul: true}); e.ch.push(cp.h.id);
        if (g === 'E') cp.h.f = e.id; else cp.h.m = e.id;
        e.edu = eduFor(a); e.money = moneyFor(a); e.askerDone = true; e.liveWith = cp; singles.push(e);
        changeRel(e, cp.h, ri(40, 80));
        if (g === 'E') mLeft--; else fLeft--; continue;
      }
    }
    const s = pick(SOYAD);
    const p = mk(g, a, s, a >= 60 ? {dul: true} : {});
    p.edu = eduFor(a); p.money = moneyFor(a); if (g === 'E' && a >= 21) p.askerDone = true;
    loneHouseholds.push(p); singles.push(p);
    if (g === 'E') mLeft--; else fLeft--;
  }

  // 3) Çocuklar ve gençler (kalan kontenjan)
  const kidGenders = []; for (let i = 0; i < mLeft; i++) kidGenders.push('E'); for (let i = 0; i < fLeft; i++) kidGenders.push('K');
  shuffle(kidGenders);
  for (const g of kidGenders) {
    let a = Math.random() < .65 ? ri(0, 11) : ri(12, 17);
    let cand = couples.filter(c => age(c.w) >= a + 19 && age(c.w) <= a + 42 && c.kids.length < 6);
    if (!cand.length) { a = ri(0, 5); cand = couples.filter(c => age(c.w) <= a + 42); }
    if (!cand.length) cand = couples;
    cand.sort((x, y) => x.kids.length - y.kids.length);
    const cp = cand[Math.floor(Math.random() * Math.min(4, cand.length))];
    const c = mk(g, a, cp.h.s); addChild(cp, c);
    c.hl = ri(85, 100);
  }

  // 4) Evler
  let hi = 0;
  const houseOrder = shuffle(M.houses.map(h => h.idx));
  const takeHouse = () => { const i = houseOrder[hi++]; S.built[i] = true; return i; };
  for (const cp of couples) { const i = takeHouse(); cp.h.h = cp.w.h = i; for (const k of cp.kids) k.h = i; }
  for (const p of singles) if (p.liveWith) { p.h = p.liveWith.h.h; delete p.liveWith; }
  for (const p of loneHouseholds) p.h = takeHouse();

  // 5) Eğitim, okul ve meslekler
  const all = alive();
  for (const p of all) {
    const a = age(p);
    if (a < 18) {
      p.edu = a >= 18 ? 3 : a >= 14 ? 2 : a >= 10 ? 1 : 0;
      if (a >= 6 && a < 10) p.school = 'ilkokul';
      else if (a >= 10 && a < 14 && chance(.4)) p.school = 'ortaokul';
      else if (a >= 14 && chance(.25)) p.school = 'lise';
    }
  }
  const adults = all.filter(p => age(p) >= 18);
  // İmam
  const imam = adults.filter(p => p.g === 'E' && age(p) >= 30 && age(p) < 65).sort((a, b) => (has(b, 'dindar') - has(a, 'dindar')) || (b.edu - a.edu))[0];
  if (imam) { imam.job = {t: 'imam', w: 'cami'}; if (!has(imam, 'dindar')) imam.tr[1] = 'dindar'; imam.edu = Math.max(imam.edu, 3); imam.rep = 72; }
  for (const p of adults) {
    if (p.job) continue;
    const a = age(p);
    if (a >= 65) p.job = {t: 'emekli'};
    else if (p.edu === 4 && chance(.5)) p.job = {t: 'ogretmen', w: 'ilkokul'};
    else if (p.g === 'K' && p.sp != null && chance(.55)) p.job = {t: 'ev'};
    else if (chance(.18)) p.job = {t: 'hayvanci', w: ri(0, M.ahir.length - 1)};
    else if (chance(.12)) p.job = {t: 'issiz'};
    else p.job = {t: 'ciftci', w: ri(0, M.tarla.length - 1)};
    if (p.job.t !== 'issiz' && p.job.t !== 'ev') p.worked = true;
  }
  // Teacher limit
  let tcount = 0; for (const p of adults) if (p.job.t === 'ogretmen' && ++tcount > 2) p.job = {t: 'ciftci', w: 0};
  // Başlangıç işletmeleri: bakkal + kahvehane
  const owners = adults.filter(p => age(p) >= 28 && age(p) < 62 && p.job.t !== 'imam' && p.job.t !== 'ogretmen').sort((a, b) => b.money - a.money);
  const bo = owners[0], ko = owners.find(p => p !== bo && p.g === 'E') || owners[1];
  if (bo) createBiz(bo, 'bakkal', true);
  if (ko) createBiz(ko, 'kahvehane', true);

  // 6) İlişkiler: aile içi sıcak, komşular ve köylüler arasında karışık
  for (const p of all) {
    for (const q of [P(p.f), P(p.m), ...children(p), ...siblings(p)]) if (q) { changeRel(p, q, ri(40, 80), false); }
    for (let i = 0; i < 9; i++) {
      const q = pick(all); if (q === p) continue;
      changeRel(p, q, ri(-35, 55));
    }
  }
  for (let i = 0; i < 8; i++) { const a = pick(adults), b = pick(adults); if (a !== b && !isKin(a, b)) { changeRel(a, b, -ri(40, 70)); setKus(a, b, true); } }
  // Sülaleler arası ilişki: birkaç husumet ve birkaç dostluk
  const vClans = [...new Set(all.map(p => p.s))];
  for (let i = 0; i < vClans.length; i++) for (let j = i + 1; j < vClans.length; j++) if (chance(.2)) S.clan[clanKey(vClans[i], vClans[j])] = ri(-35, 45);
  for (let i = 0; i < 2; i++) { const a = pick(vClans), b = pick(vClans); if (a !== b) S.clan[clanKey(a, b)] = -ri(55, 75); }
  for (const p of all) if (p.ms && p.ms !== p.s) S.clan[clanKey(p.ms, p.s)] = Math.max(S.clan[clanKey(p.ms, p.s)] || 0, ri(25, 55));

  // 7) Muhtar: en saygın orta yaşlı
  for (const p of adults) if (p.goal === 'muhtar') p.rep = Math.min(85, p.rep + 10);
  const muh = adults.filter(p => age(p) >= 35 && age(p) < 70 && p.job.t !== 'ev').sort((a, b) => b.rep - a.rep)[0];
  if (muh) { S.muhtar = muh.id; muh.rep = Math.max(muh.rep, 70); if (muh.goal === 'muhtar') muh.goalDone = true;
    S.elections.push({y: curYear(), w: muh.id, wn: fn(muh), note: 'Başlangıç muhtarı', votes: []}); }

  news('🏡', 'Köyümüze hoş geldiniz! 100 kişilik köyde yeni bir dönem başlıyor.');
  if (muh) news('🏛️', `Köyün muhtarı ${fn(muh)}.`);
  R.mapDirty = true;
}

/* ======================= 6) EKONOMİ ======================= */
function bizById(id) { return S.biz.find(b => b.id === id); }
function freeLot() { const used = new Set(S.biz.map(b => b.lot)); for (const l of M.lots) if (!used.has(l.idx)) return l.idx; return -1; }
function bizUnlocked(t) { return alive().length >= ISLETME[t].pop; }
/* Aynı türden en fazla kaç işletme olabilir (dükkân yerleri üst işletmelere de kalsın) */
function bizRoom(t) { return S.biz.filter(b => b.t === t).length < 1 + Math.floor(alive().length / 70); }
function createBiz(owner, t, silent) {
  const lot = freeLot(); if (lot < 0) return null;
  const T = ISLETME[t];
  if (!silent) {
    if (owner.money < T.cost) { owner.debt += T.cost - owner.money; owner.money = 0; } else owner.money -= T.cost;
  }
  leaveJob(owner);
  const b = {id: S.nextBiz++, t, owner: owner.id, lot, emp: [], open: curMonth(), profit: 0, loss: 0};
  S.biz.push(b);
  owner.job = {t: 'sahip', w: b.id}; owner.worked = true;
  if (owner.goal === 'is') owner.goalDone = true;
  if (!silent) { news(T.ikon, `${fn(owner)} köye bir ${T.ad.toLocaleLowerCase('tr')} açtı.`); owner.mood += 15; owner.rep += 3; }
  R.mapDirty = true;
  return b;
}
function closeBiz(b, why) {
  const o = P(b.owner), T = ISLETME[b.t];
  for (const eid of b.emp) { const e = P(eid); if (e && e.job && e.job.w === b.id) e.job = {t: 'issiz'}; }
  if (o && o.job && o.job.t === 'sahip' && o.job.w === b.id) o.job = {t: 'issiz'};
  S.biz = S.biz.filter(x => x !== b);
  if (o && why === 'iflas') { news('📉', `${nin(o.n)} ${T.ad.toLocaleLowerCase('tr')} iflas etti!`); o.rep -= 8; o.mood -= 30; }
  else if (o && why === 'kapat') news('🔒', `${fn(o)} ${T.ad.toLocaleLowerCase('tr')} dükkânını kapattı.`);
  R.mapDirty = true;
}
function leaveJob(p) {
  if (!p.job) return;
  if (p.job.t === 'isci') { const b = bizById(p.job.w); if (b) b.emp = b.emp.filter(x => x !== p.id); }
  if (p.job.t === 'sahip') { const b = bizById(p.job.w); if (b) { p.job = null; closeBiz(b, 'kapat'); } }
  p.job = {t: 'issiz'};
}
/* Köyün refahı: yetişkinlerin medyan parası (birkaç zengin ya da batık kişi ölçüyü bozmasın) */
function prosperity() {
  const m = alive().filter(p => age(p) >= 18).map(p => Math.max(0, p.money)).sort((a, b) => a - b);
  return m.length ? clamp(m[m.length >> 1] / 15000, .5, 2.2) : 1;
}
function workF(p) { return (has(p, 'caliskan') ? 1.2 : 1) * (has(p, 'tembel') ? .8 : 1) * (.6 + .4 * p.hl / 100); }
function wageOf(p) { return 2400 + 250 * p.edu; }

/* Bir kategoride yeni bir işletmenin beklenen aylık kârı (kurma kararı için) */
function expectedProfit(t) {
  const T = ISLETME[t], pop = alive().length;
  let pf = prosperity(); if (T.cat === 'yakit' || T.cat === 'araba') pf = Math.pow(pf, 1.5);
  const demand = pop * KATEGORI[T.cat] * pf;
  const comp = S.biz.filter(b => ISLETME[b.t].cat === T.cat).reduce((s, b) => s + ISLETME[b.t].w, 0);
  const share = T.w / (comp + T.w);
  return demand * share * T.margin - T.staff * 2600 - T.cost * .006 - 1200;
}

function monthlyEconomy() {
  const all = alive(), pop = all.length, mo = moy();
  const harvestMonth = mo >= 5 && mo <= 9;
  const pros = prosperity();
  const asfalt = S.proj.asfalt.st === 2;
  // 1) Maaşlar ve gelirler
  for (const p of all) {
    if (p.away === 'uni') { const par = P(p.f) || P(p.m); if (isAlive(par)) par.money -= 1500; continue; }
    if (p.away) continue;
    const j = p.job ? p.job.t : null;
    let inc = 0;
    if (j === 'ciftci') inc = (harvestMonth ? 5200 : 450) * S.harvest * workF(p) * (1 + .04 * p.edu);
    else if (j === 'hayvanci') inc = 2600 * workF(p) * (.7 + .3 * S.harvest);
    else if (j === 'ogretmen') inc = 4800; else if (j === 'doktor') inc = 7500;
    else if (j === 'hemsire') inc = 3600; else if (j === 'imam') inc = 3600;
    else if (j === 'emekli') inc = p.worked ? 2200 : 900;
    if (S.muhtar === p.id) inc += 3000;
    p.money += inc;
  }
  // 2) İşletmeler: aynı kategoridekiler pazarı paylaşır (rekabet)
  for (const b of S.biz.slice()) if (!present(P(b.owner))) closeBiz(b, 'kapat');
  const cats = {};
  for (const b of S.biz) (cats[ISLETME[b.t].cat] = cats[ISLETME[b.t].cat] || []).push(b);
  for (const cat in cats) {
    const list = cats[cat];
    let pf = pros; if (cat === 'yakit' || cat === 'araba') pf = Math.pow(pros, 1.5);
    const demand = pop * KATEGORI[cat] * pf * (asfalt ? 1.1 : 1);
    const scores = list.map(b => {
      const o = P(b.owner), T = ISLETME[b.t];
      const q = 1 + (has(o, 'kurnaz') ? .15 : 0) + (has(o, 'caliskan') ? .1 : 0) - (has(o, 'tembel') ? .12 : 0) + (o.rep - 50) / 200;
      const staffF = .6 + .4 * Math.min(1, b.emp.length / T.staff);
      return T.w * q * staffF * rnd(.9, 1.1);
    });
    const sum = scores.reduce((a, b) => a + b, 0);
    list.forEach((b, i) => {
      const o = P(b.owner), T = ISLETME[b.t];
      const rev = demand * scores[i] / sum;
      let wages = 0;
      for (const eid of b.emp) { const e = P(eid); if (e) { const w = wageOf(e); e.money += w; wages += w; } }
      const profit = rev * T.margin - wages - T.cost * .006 - 1200; // 1200: kira, elektrik, vergi
      const tax = profit > 0 ? profit * .1 : 0;
      S.treasury += tax;
      o.money += profit - tax;
      b.profit = Math.round(profit - tax);
      b.loss = profit < 0 ? b.loss + 1 : 0;
    });
  }
  // 3) Geçim masrafları (çocukların masrafını ebeveyn öder)
  for (const p of all) {
    if (p.away) continue;
    const a = age(p);
    let cost = a < 18 ? 500 : (a >= 65 ? 900 : 1100);
    let payer = p;
    if (a < 18) payer = [P(p.f), P(p.m)].find(q => isAlive(q) && q.h === p.h) || hm(p.h).filter(q => age(q) >= 18).sort((x, y) => y.money - x.money)[0] || p;
    if (has(payer, 'cimri')) cost *= .85; if (payer.goal === 'zengin') cost *= .92; if (has(payer, 'comert')) cost *= 1.05;
    payer.money -= cost;
    // Varlıklılar daha çok harcar (ev eşyası, araba, düğün hediyesi…)
    if (a >= 18 && p.money > 20000) p.money -= (p.money - 20000) * (has(p, 'cimri') ? .01 : has(p, 'comert') ? .03 : .02);
  }
  // 4) Borçlar: faiz, otomatik kredi, geri ödeme
  for (const p of all) {
    if (p.debt > 0) p.debt *= 1.015;
    if (p.money < 0) { p.debt += -p.money + 1000; p.money = 1000; }
    const monthly = 1500;
    if (p.debt > 0 && p.money > monthly * 6) { const pay = Math.min(p.debt, p.money - monthly * 4); p.debt -= pay; p.money -= pay; }
    if (p.debt < 1) p.debt = 0;
    if (p.debt > 80000 && p.debt > p.money * 3 && !p.borcHaber && age(p) >= 18) { p.borcHaber = true; news('💸', `${fn(p)} borç batağına saplandı (${para(p.debt)}).`); p.mood -= 20; p.rep -= 4; }
    if (p.debt < 20000) p.borcHaber = false;
    // İcra: ödenemeyecek kadar büyüyen borç kısmen silinir, malına el konur
    if (p.debt > 150000 && p.money < 5000 && !(p.job && p.job.t === 'sahip')) {
      p.debt = Math.round(p.debt * .25); p.money = 0; p.rep -= 10; p.mood -= 25;
      news('⚖️', `${fn(p)} borçlarını ödeyemedi; icra yoluyla malına el konuldu.`);
    }
  }
  // 5) İflaslar
  for (const b of S.biz.slice()) {
    const o = P(b.owner), T = ISLETME[b.t];
    if ((b.loss >= 4 && o.debt > T.cost * .5) || o.debt > T.cost * 1.5 + 50000) closeBiz(b, 'iflas');
    else if (b.loss >= 7 && !controlled(o)) closeBiz(b, 'kapat');
  }
  // 6) Köy hazinesi: aidat + devlet payı
  const adults = all.filter(p => age(p) >= 18 && !p.away).length;
  S.treasury += adults * 40 + pop * 25;
  // Kurnaz muhtar hazineden para aşırabilir
  const muh = P(S.muhtar);
  if (isAlive(muh) && has(muh, 'kurnaz') && !controlled(muh) && chance(.08) && S.treasury > 20000) {
    const amt = Math.round(S.treasury * .05); S.treasury -= amt; muh.money += amt;
    if (chance(.3)) { muh.rep -= 18; news('🕵️', `Muhtar ${nin(fn(muh))} hazineden ${para(amt)} aşırdığı ortaya çıktı! Köyde büyük tepki var.`); }
  }
}

/* İş bulma, işe alma ve işletme kurma kararları */
function monthlyJobs() {
  const all = presentList();
  const pop = alive().length;
  // Kamu kadroları
  const count = t => all.filter(p => p.job && p.job.t === t).length;
  const teacherCap = KADRO.ogretmen.ilkokul + (S.proj.ortaokul.st === 2 ? KADRO.ogretmen.ortaokul : 0) + (S.proj.lise.st === 2 ? KADRO.ogretmen.lise : 0);
  const docCap = S.proj.saglik.st === 2 ? KADRO.doktor : 0, nurseCap = S.proj.saglik.st === 2 ? KADRO.hemsire : 0;
  const hayCap = M.ahir.length * 10;
  let teachers = count('ogretmen'), docs = count('doktor'), nurses = count('hemsire'), imams = count('imam'), hay = count('hayvanci');
  // İşe alım: işletmeler boş kadrolarını doldurur (akrabalar önce)
  for (const b of S.biz) {
    const T = ISLETME[b.t]; b.emp = b.emp.filter(id => { const e = P(id); return present(e) && e.job && e.job.t === 'isci' && e.job.w === b.id; });
    if (b.emp.length >= T.staff) continue;
    const o = P(b.owner);
    const cand = all.filter(p => age(p) >= 17 && age(p) < 62 && !p.school && p.job && (p.job.t === 'issiz' || (p.job.t === 'ev' && chance(.2))) && !controlled(p));
    if (!cand.length) continue;
    cand.sort((x, y) => sc(y) - sc(x));
    function sc(p) { return (isKin(p, o) ? 40 : 0) + relV(o, p) * .3 + p.edu * 8 + (has(p, 'caliskan') ? 10 : 0) - (has(p, 'tembel') ? 10 : 0) + rnd(0, 15); }
    const e = cand[0]; e.job = {t: 'isci', w: b.id}; e.worked = true; b.emp.push(e.id);
  }
  for (const p of all) {
    const a = age(p);
    if (a < 17 || p.school || controlled(p)) continue;
    // Emeklilik
    if (a >= 65 && p.job && !['emekli', 'sahip'].includes(p.job.t)) { leaveJob(p); p.job = {t: 'emekli'}; continue; }
    if (a >= 72 && p.job && p.job.t === 'sahip') { handOver(p); continue; }
    if (!p.job) p.job = {t: 'issiz'};
    const j = p.job.t;
    if (j === 'issiz' || (j === 'ciftci' && p.edu === 4)) {
      if (p.edu === 4 && teachers < teacherCap) { leaveJob(p); p.job = {t: 'ogretmen', w: pick(['ilkokul'].concat(S.proj.ortaokul.st === 2 ? ['ortaokul'] : [], S.proj.lise.st === 2 ? ['lise'] : []))}; teachers++; p.worked = true; news('👩‍🏫', `${fn(p)} köy okulunda öğretmen olarak işe başladı.`); continue; }
      if (p.edu === 4 && docs < docCap && p.zeka > 55) { leaveJob(p); p.job = {t: 'doktor', w: 'saglik'}; docs++; p.worked = true; p.rep += 10; news('🩺', `${fn(p)} sağlık ocağında doktor olarak göreve başladı.`); continue; }
      if (p.edu >= 3 && nurses < nurseCap) { leaveJob(p); p.job = {t: 'hemsire', w: 'saglik'}; nurses++; p.worked = true; continue; }
      if (imams < 1 && p.g === 'E' && a >= 25 && p.edu >= 3 && has(p, 'dindar')) { leaveJob(p); p.job = {t: 'imam', w: 'cami'}; imams++; p.worked = true; news('🕌', `${fn(p)} köyün yeni imamı oldu.`); continue; }
    }
    if (j === 'issiz') {
      if (p.g === 'K' && p.sp != null && chance(.35)) { p.job = {t: 'ev'}; continue; }
      if (chance(has(p, 'tembel') ? .25 : .55)) {
        if (hay < hayCap && chance(.3)) { p.job = {t: 'hayvanci', w: ri(0, M.ahir.length - 1)}; hay++; }
        else p.job = {t: 'ciftci', w: ri(0, M.tarla.length - 1)};
        p.worked = true;
      }
    }
    // Tembel çalışan arada işi bırakır
    if (j === 'isci' && has(p, 'tembel') && chance(.01)) { leaveJob(p); }
  }
  // İşletme kurma: hırslı / kurnaz / işi hedefleyenler
  if (freeLot() >= 0) {
    const types = Object.keys(ISLETME).filter(t => bizUnlocked(t) && bizRoom(t));
    for (const p of shuffle(all.slice())) {
      const a = age(p);
      if (a < 22 || a > 60 || controlled(p) || (p.job && p.job.t === 'sahip')) continue;
      const wants = p.goal === 'is' ? .05 : (p.goal === 'zengin' || has(p, 'hirsli') ? .02 : (has(p, 'kurnaz') ? .01 : .002));
      if (!chance(wants)) continue;
      let best = null, bp = 1800;
      for (const t of types) { const T = ISLETME[t]; if (p.money + 20000 < T.cost * .5) continue; const ep = expectedProfit(t) * rnd(.8, 1.2); if (ep > bp) { bp = ep; best = t; } }
      if (best) { createBiz(p, best); break; }
    }
  }
}
/* İşletmeyi devret (yaşlılık/ölüm) */
function handOver(p) {
  const b = p.job && p.job.t === 'sahip' ? bizById(p.job.w) : null;
  if (!b) return;
  const heir = children(p).filter(c => present(c) && age(c) >= 18 && !(c.job && c.job.t === 'sahip')).sort((a, b) => b.edu - a.edu || a.b - b.b)[0]
    || (present(P(p.sp)) && !(P(p.sp).job && P(p.sp).job.t === 'sahip') ? P(p.sp) : null);
  if (heir) {
    if (heir.job && heir.job.t === 'isci') { const hb = bizById(heir.job.w); if (hb) hb.emp = hb.emp.filter(x => x !== heir.id); }
    b.owner = heir.id; heir.job = {t: 'sahip', w: b.id}; heir.worked = true;
    if (p.dead) news('🔑', `${nin(fn(p))} ${ISLETME[b.t].ad.toLocaleLowerCase('tr')} dükkânı ${ye(fn(heir))} kaldı.`);
    else news('🔑', `${fn(p)} dükkânını ${ye(fn(heir))} devretti.`);
    if (!p.dead) p.job = {t: 'emekli'};
  } else {
    if (!p.dead) p.job = {t: 'emekli'};
    p.job = p.dead ? null : p.job;
    closeBiz(b, 'kapat');
  }
}

/* ======================= 7) YAŞAM DÖNGÜSÜ ======================= */
function findFreeHouse(nearIdx) {
  const occ = new Set(alive().map(p => p.h));
  let best = -1, bd = 1e9; const near = nearIdx >= 0 ? M.houses[nearIdx] : M.meydan;
  for (const h of M.houses) {
    if (occ.has(h.idx)) continue;
    const d = Math.hypot(h.x - near.x, h.y - near.y) - (S.built[h.idx] ? 300 : 0);
    if (d < bd) { bd = d; best = h.idx; }
  }
  return best;
}

function birth(mother) {
  const father = P(mother.sp);
  const g = chance(.51) ? 'E' : 'K';
  const sibNames = new Set(children(mother).map(c => c.n));
  let n = null;
  // Gelenek: ilk çocuklara dede/nine adı verilir
  if (father && chance(.3)) { const gp = g === 'E' ? P(father.f) : P(father.m); if (gp && !sibNames.has(gp.n)) n = gp.n; }
  if (!n) { do n = pick(g === 'E' ? ERKEK : KADIN); while (sibNames.has(n)); }
  const tr = randomTraits();
  // Kişilik kısmen anne-babadan
  if (father && chance(.4)) { const t = pick(father.tr.concat(mother.tr)); if (!tr.includes(t) && ZIT[t] !== tr[0]) tr[1] = t; }
  const c = newPerson({g, n, s: father ? father.s : mother.s, b: curMonth(), f: father ? father.id : null, m: mother.id,
    h: mother.h, tr, goal: randomGoal(tr), hl: 95, rep: 50, hap: 80,
    zeka: clamp(Math.round(((father ? father.zeka : 55) + mother.zeka) / 2 + rnd(-20, 20)), 10, 100)});
  mother.ch.push(c.id); if (father) father.ch.push(c.id);
  for (const par of [father, mother]) if (par) { changeRel(par, c, 70); par.mood += 15; }
  for (const gp of [P(father && father.f), P(father && father.m), P(mother.f), P(mother.m)]) if (isAlive(gp)) { changeRel(gp, c, 60); gp.mood += 8; }
  const ebeveyn = father ? `${father.n} ve ${mother.n} ${father.s}` : fn(mother);
  news('👶', `${nin(ebeveyn)} bir ${g === 'E' ? 'oğlu' : 'kızı'} oldu: ${n}.`);
}

function die(p, sebep) {
  if (!isAlive(p)) return;
  p.dead = true; p.dm = curMonth();
  const sp = P(p.sp);
  if (sp && isAlive(sp)) { sp.sp = null; sp.dul = true; sp.mood -= 40; }
  // Aile ve dostların üzüntüsü
  for (const q of alive()) { const v = relV(q, p); if (v > 30 || isKin(q, p)) q.mood -= Math.min(30, 5 + v / 4); }
  // Miras
  inheritance(p);
  if (p.job && p.job.t === 'sahip') handOver(p);
  if (p.job && p.job.t === 'isci') { const b = bizById(p.job.w); if (b) b.emp = b.emp.filter(x => x !== p.id); }
  S.courts = S.courts.filter(c => c.g !== p.id && c.b !== p.id);
  if (S.ctrl === p.id) { S.ctrl = null; toast('Yönettiğin karakter hayatını kaybetti.'); }
  if (S.muhtar === p.id) { S.muhtar = null; news('🏛️', 'Köy muhtarsız kaldı. Erken seçime gidilecek.'); if (!S.secim) secimBaslat(40); }
  p.h = -1; S.graves++;
  dirty(); delete R.ag[p.id]; R.mapDirty = true;
  // Yetim kalan çocuklar akrabaya geçer
  rehouseOrphans();
  news('🕯️', `${fn(p)} ${age(p)} yaşında ${sebep || 'hayatını kaybetti'}. Allah rahmet eylesin.`);
  S.events.push({k: 'cenaze', day: curDay() + 1, id: p.id});
}

function inheritance(p) {
  let estate = p.money - p.debt; p.money = 0; p.debt = 0;
  if (estate <= 0) return; // borçlar mirasla kapanır, fazlası silinir
  const sp = isAlive(P(p.sp)) ? P(p.sp) : null;
  const kids = children(p).filter(isAlive);
  const heirs = [];
  if (sp) { if (kids.length) { sp.money += estate * .25; estate *= .75; } else { sp.money += estate; estate = 0; } }
  if (estate > 0) {
    let list = kids;
    if (!list.length) list = [P(p.f), P(p.m)].filter(isAlive);
    if (!list.length) list = siblings(p).filter(isAlive);
    if (list.length) for (const h of list) { h.money += estate / list.length; heirs.push(h); }
    else { S.treasury += estate; news('🏦', `${nin(fn(p))} mirasçısı olmadığından ${para(estate)} köy hazinesine kaldı.`); return; }
  }
  if (estate > 50000 && heirs.length) news('📜', `${nin(fn(p))} mirası (${para(estate)}) ${heirs.map(fn).join(', ')} arasında paylaşıldı.`);
}

function rehouseOrphans() {
  for (const p of alive()) {
    if (age(p) >= 16 || p.h < 0) continue;
    const adultsHere = hm(p.h).some(q => age(q) >= 18 && q !== p);
    if (adultsHere) continue;
    const rel = [P(p.f), P(p.m), ...[P(p.f), P(p.m)].filter(Boolean).flatMap(x => [P(x.f), P(x.m)]),
      ...siblings(p)].filter(q => isAlive(q) && age(q) >= 18 && q.h >= 0);
    const g = rel[0];
    if (g) { const kids = hm(p.h).filter(q => age(q) < 18); for (const k of kids) k.h = g.h; dirty(); news('🏠', `Kimsesiz kalan ${kids.map(k => k.n).join(', ')} artık ${fn(g)} yanında yaşayacak.`); }
  }
}

function monthlyLife() {
  const mo = moy(), cm = curMonth();
  const pop = alive().length;
  const saglik = S.proj.saglik.st === 2;
  const capF = Math.max(0, 1 - Math.pow(pop / MAX_POP, 4));
  for (const p of alive().slice()) {
    if (!isAlive(p)) continue;
    const a = ageY(p);
    // --- Sağlık ---
    if (a > 45) p.hl -= (a - 45) * .025 * rnd(.4, 1.6);
    if (a < 50 && p.hl < 90) p.hl += 1.5;
    if (chance(.012)) p.hl -= rnd(5, 25);           // hastalık
    if (saglik) p.hl += .7;
    if (p.hap < 25) p.hl -= .5;
    p.hl = clamp(p.hl, 0, 100);
    // --- Ölüm ---
    let q = .0003 * Math.exp(.085 * a) + (a < 1 ? .004 : 0);
    q = q / 12 * (p.hl < 25 ? 3 : p.hl < 50 ? 1.6 : 1) * (saglik ? .75 : 1);
    if (p.hl <= 0 || chance(q)) { die(p, a > 70 ? 'yaşlılıktan vefat etti' : 'hastalıktan vefat etti'); continue; }
    // --- Dönüşler: asker, üniversite ---
    if (p.away && cm >= p.ret) {
      dirty();
      if (p.away === 'uni') { p.away = null; p.edu = 4; p.school = null; p.job = {t: 'issiz'}; news('🎓', `${fn(p)} üniversiteyi bitirip köye döndü.`); p.rep += 6; }
      else if (p.away === 'asker') { p.away = null; p.askerDone = true; p.job = {t: 'issiz'}; S.events.push({k: 'donus', day: curDay() + 1, id: p.id}); }
    }
    if (p.away) continue;
    // --- Doğum ---
    if (p.g === 'K' && p.sp != null && a >= 18 && a < 45) {
      const h = P(p.sp);
      if (present(h)) {
        const kids = p.ch.length;
        let pb = .03 * (a < 35 ? 1 : a < 40 ? .5 : .2) * (kids >= 5 ? .15 : kids >= 3 ? .45 : kids >= 2 ? .75 : 1);
        if (p.goal === 'aile' || h.goal === 'aile') pb *= 1.3;
        if (relV(p, h) < -20) pb *= .4;
        if (chance(pb * capF)) birth(p);
      }
    }
    // --- Askerlik ---
    if (p.g === 'E' && !p.askerDone && a >= 20 && !p.school && !courtOf(p.id) && p.sp == null && !S.events.some(e => e.id === p.id && (e.k === 'ugurlama' || e.k === 'askerGit'))) {
      S.events.push({k: 'ugurlama', day: curDay() + ri(2, 20), id: p.id});
    }
    // --- Göç (nüfus kalabalıksa ya da iş yoksa gençler şehre gider) ---
    if (a >= 18 && a < 32 && p.sp == null && !controlled(p) && p.job && p.job.t === 'issiz' && !p.ch.length && !courtOf(p.id)) {
      const pg = (pop > 270 ? .05 : .004) + (p.edu === 4 ? .02 : 0);
      if (chance(pg)) { p.left = true; p.dm = cm; leaveJob(p); p.h = -1; dirty(); delete R.ag[p.id]; news('🚌', `${fn(p)} iş bulmak için şehre göç etti.`); continue; }
    }
  }
  // --- Okul yılı (Eylül) ---
  if (mo === 8) {
    const ortaP = S.proj.ortaokul.st === 2 ? .9 : .4, liseP = S.proj.lise.st === 2 ? .8 : .25;
    const kut = S.proj.kutuphane.st === 2 ? .1 : 0;
    let mezun = 0;
    for (const p of presentList()) {
      const a = age(p), apt = (p.zeka - 50) / 200 + kut;
      if (p.school === 'ilkokul' && a >= 10) { p.edu = 1; p.school = chance(ortaP + apt) ? 'ortaokul' : null; }
      else if (p.school === 'ortaokul' && a >= 14) { p.edu = 2; p.school = chance(liseP + apt) ? 'lise' : null; }
      else if (p.school === 'lise' && a >= 18) {
        p.edu = 3; p.school = null; mezun++;
        const fam = (P(p.f) ? P(p.f).money : 0) + p.money;
        if (chance(clamp((p.zeka - 45) / 70 + (fam > 30000 ? .1 : 0) + kut, .03, .8))) {
          p.school = 'uni'; p.away = 'uni'; p.ret = curMonth() + 48; delete R.ag[p.id]; dirty();
          news('🎒', `${fn(p)} üniversiteyi kazandı ve şehre okumaya gitti.`); p.rep += 4;
          for (const par of [P(p.f), P(p.m)]) if (isAlive(par)) { par.mood += 15; par.rep += 2; }
        }
      } else if (!p.school && p.edu === 0 && a >= 6 && a < 10) p.school = 'ilkokul';
      if (p.school === null && a < 18 && p.edu < 3 && a >= 10 && !p.job) p.job = null;
    }
    news('🏫', `Okullar açıldı. ${presentList().filter(p => p.school && p.school !== 'uni').length} öğrenci ders başı yaptı.`);
    if (mezun) news('🎓', `Bu yıl ${mezun} genç liseden mezun oldu.`);
  }
}

/* Mutluluk ve itibar */
function monthlyMood() {
  const all = alive();
  for (const p of all) {
    const a = age(p);
    let t = 50;
    if (p.money < 1500 && a >= 18) t -= 10; if (p.money > 50000) t += 6; if (p.money > 200000) t += 6;
    if (p.debt > 50000) t -= 10;
    if (a >= 18 && p.job && p.job.t === 'issiz') t -= 12;
    if (p.sp != null) { const v = relV(p, P(p.sp)); t += 8 + (v > 30 ? 6 : v < -20 ? -18 : 0); }
    else if (a >= 28 && (p.goal === 'aile' || a > 35)) t -= 6;
    t += Math.min(12, p.ch.length * 3);
    t += (p.hl - 60) / 4;
    let fr = 0, en = 0;
    for (const id in p.rel) { const v = p.rel[id]; if (v >= 40) fr++; else if (v <= -40) en++; }
    t += Math.min(10, fr * 2) - Math.min(12, en * 3);
    if (has(p, 'neseli')) t += 10; if (has(p, 'sinirli')) t -= 5;
    const gp = goalProgress(p); t += gp >= 1 ? 15 : gp * 6;
    if (S.proj.park.st === 2 && a < 14) t += 4;
    t += (S.proj.cesme.n || 0) * .8 + (S.proj.asfalt.st === 2 ? 2 : 0);
    if (p.away === 'asker') t -= 5;
    p.hap = clamp(p.hap + (t + p.mood - p.hap) * .3, 0, 100);
    p.mood *= .6;
    // İtibar
    p.rep += (50 - p.rep) * .02;
    if (S.muhtar === p.id) p.rep += .6;
    if (has(p, 'comert')) p.rep += .3; if (has(p, 'cimri')) p.rep -= .2;
    if (has(p, 'dindar')) p.rep += .2;
    if (p.job && ['ogretmen', 'doktor', 'imam'].includes(p.job.t)) p.rep += .4;
    if (a >= 18 && a < 65 && p.job && p.job.t === 'issiz') p.rep -= .25;
    if (a >= 60) p.rep += .15;
    if (p.money > 150000) p.rep += .2;
    p.rep = clamp(p.rep, 0, 100);
    if (gp >= 1 && !p.goalDone && p.goal !== 'muhtar') { p.goalDone = true; p.mood += 20; if (a >= 18) news('⭐', `${fn(p)} hayat hedefine ulaştı: ${HEDEF[p.goal]}.`); }
  }
}

/* Cömert davranışlar ve sülale ilişkisi */
function monthlyGenerosity() {
  for (const p of presentList()) {
    if (age(p) < 25 || controlled(p) || p.money < 25000) continue;
    const gen = (has(p, 'comert') ? .15 : 0) + (p.goal === 'saygin' ? .08 : 0) + (p.goal === 'muhtar' ? .06 : 0) - (has(p, 'cimri') ? .1 : 0);
    if (!chance(gen)) continue;
    const poor = presentList().filter(q => q !== p && age(q) >= 18 && q.money < 3000 && (relV(p, q) > 0 || isKin(p, q) || q.h === p.h)).sort((a, b) => a.money - b.money)[0];
    if (!poor) continue;
    const amt = Math.round(p.money * rnd(.03, .07) / 100) * 100;
    p.money -= amt; poor.money += amt; changeRel(p, poor, 15); changeRel(poor, p, 10, false); p.rep += 2;
    if (chance(.3) && newsQuota('yardim', 2)) news('🤲', `${fn(p)}, zor durumdaki ${ye(fn(poor))} ${para(amt)} yardım etti.`);
  }
}

/* ======================= 8) ÖRF VE ÂDETLER, SOSYAL HAYAT ======================= */
function courtOf(id) { return S.courts.find(c => c.g === id || c.b === id); }
function marriageable(p, g) {
  if (!present(p) || p.g !== g || p.sp != null || courtOf(p.id)) return false;
  const a = age(p);
  return g === 'K' ? (a >= 18 && a <= 45) : (a >= 21 && a <= 60);
}
function suitable(groom, bride) {
  if (!marriageable(bride, 'K') || isKin(groom, bride)) return false;
  const d = age(groom) - age(bride);
  return d >= -3 && d <= 14;
}
function startCourt(g, b, gor, soon) {
  if (courtOf(g.id) || courtOf(b.id)) return;
  S.courts.push({g: g.id, b: b.id, st: 'isteme', gor: !!gor});
  S.events.push({k: 'isteme', day: curDay() + (soon ? 1 : ri(3, 20)), g: g.id, b: b.id});
}
function endCourt(c) { S.courts = S.courts.filter(x => x !== c); }

/* Evlilik başlatma: tanışma (karşılıklı sevgi) ya da görücü usulü */
function monthlyMarriage() {
  const women = presentList().filter(p => marriageable(p, 'K'));
  if (!women.length) return;
  for (const g of presentList()) {
    if (!marriageable(g, 'E') || controlled(g)) continue;
    const a = age(g);
    if (!g.askerDone && a < 27) continue;
    // Tanışma: karşılıklı hoşlanma
    let best = null, bv = 45;
    for (const id in g.rom) { const b = P(id); if (!b || !suitable(g, b)) continue; const v = Math.min(g.rom[id], b.rom[g.id] || 0); if (v > bv) { bv = v; best = b; } }
    if (best && chance(.3)) { startCourt(g, best, false); continue; }
    // Görücü usulü
    let pg = .015 + Math.max(0, a - 23) * .006;
    if (g.goal === 'aile') pg += .04; if (has(g, 'dindar')) pg += .02; if (g.dul || g.bosandi) pg *= .5;
    if (!chance(pg)) continue;
    const cands = shuffle(women.filter(b => suitable(g, b))).slice(0, 8);
    if (!cands.length) continue;
    cands.sort((x, y) => score(y) - score(x));
    function score(b) { return clanRel(g.s, b.s) * .5 + b.rep * .3 + (P(b.f) ? P(b.f).money / 5000 : 0) + relV(g, b) * .3 + (has(b, 'caliskan') ? 8 : 0) + rnd(0, 20); }
    startCourt(g, cands[0], true);
  }
}

/* Kız tarafının kabul olasılığı */
function istemeScore(g, b) {
  const bf = P(b.f);
  let s = 40 + relV(b, g) * .4 + (b.rom[g.id] || 0) * .5 + clanRel(g.s, bf ? bf.s : b.s) * .35 + (g.rep - 50) * .4;
  if (bf) s += relV(bf, g) * .2;
  const j = g.job ? g.job.t : 'issiz';
  if (j === 'issiz') s -= 25; if (['sahip', 'ogretmen', 'doktor'].includes(j)) s += 10;
  s += Math.min(15, (g.money + (P(g.f) ? P(g.f).money * .4 : 0)) / 10000);
  s += g.edu * 3; if (age(b) > 30) s += 12; if (g.dul || g.bosandi) s -= 8;
  if (has(b, 'dindar') && has(g, 'dindar')) s += 6;
  return clamp(s, 5, 95);
}

function familyOf(p) { return [p, P(p.f), P(p.m), P(p.sp), ...siblings(p), ...children(p)].filter(q => present(q)); }
function friendsOf(p, n, min = 25) {
  const out = [];
  for (const id in p.rel) if (p.rel[id] >= min) { const q = S.people[id]; if (q && present(q)) out.push(q); }
  out.sort((a, b) => p.rel[b.id] - p.rel[a.id]);
  return out.slice(0, n);
}

/* Bugünün etkinlikleri (kız isteme, düğün, cenaze...) */
function runEvents() {
  const d = curDay();
  const todays = S.events.filter(e => e.day <= d);
  S.events = S.events.filter(e => e.day > d);
  for (const e of todays) { try { EVENT[e.k] && EVENT[e.k](e); } catch (err) { console.error('olay hatası', e, err); } }
}
function addGather(k, dest, start, end, att, icon, extra) {
  const g = Object.assign({id: R.gather.length + 1, k, dest, start, end, att: [...new Set(att.filter(present).map(p => p.id))], icon}, extra || {});
  R.gather.push(g);
  for (const id of g.att) { if (!R.gatherBy.has(id)) R.gatherBy.set(id, []); R.gatherBy.get(id).push(g); }
  return g;
}
const sample = (arr, frac) => arr.filter(() => chance(frac));

const EVENT = {
  isteme(e) {
    const g = P(e.g), b = P(e.b), c = S.courts.find(x => x.g === e.g && x.b === e.b);
    if (!c) return;
    if (!present(g) || !present(b) || b.sp != null || g.sp != null) { endCourt(c); return; }
    const bf = P(b.f), bm = P(b.m);
    const gFam = [g, P(g.f), P(g.m)].filter(present);
    addGather('isteme', {pl: M.houses[b.h], out: false}, 19, 21.5, gFam.concat(hm(b.h).filter(present)), '☕');
    news('☕', `${g.s} ailesi, ${nin(bf ? fn(bf) : fn(b))} kızı ${yi(b.n)} ${ye(g.n)} istemeye gitti. ${c.gor ? '(Görücü usulü)' : ''} Kahveler ikram edildi.`);
    const decider = [b, bf, bm].find(q => q && controlled(q));
    const sc = istemeScore(g, b);
    if (decider) {
      ask(`<b>${g.s} ailesi</b> kapınızda! ${fn(g)} (${age(g)} yaş, ${MESLEK[g.job ? g.job.t : 'issiz']}, itibar ${Math.round(g.rep)}) için <b>${b.n}</b> isteniyor.<br><br>Kahveler içildi. Ne cevap veriyorsunuz?<br><small>Köylülerin tahmini: %${Math.round(sc)} kabul.</small>`,
        [{t: '💍 Kabul (Allah\'ın emri…)', fn: () => istemeSonuc(c, true)}, {t: '🙅 Ret', r: true, fn: () => istemeSonuc(c, false)}]);
    } else istemeSonuc(c, chance(sc / 100));
  },
  nisan(e) {
    const c = S.courts.find(x => x.g === e.g && x.b === e.b), g = P(e.g), b = P(e.b);
    if (!c || !present(g) || !present(b)) { if (c) endCourt(c); return; }
    // Nadiren nişan bozulur
    if (relV(b, g) < -30 && chance(.5)) { endCourt(c); changeClan(g.s, b.s, -10); news('💔', `${fn(g)} ile ${nin(b.n)} nişanı bozuldu.`); return; }
    c.st = 'nisan';
    const gold = 15000; pay(g, gold, P(g.f));
    changeRel(g, b, 15); g.rom[b.id] = Math.max(g.rom[b.id] || 0, 50); b.rom[g.id] = Math.max(b.rom[g.id] || 0, 40);
    addGather('nisan', {pl: M.houses[b.h], out: false}, 18, 21.5, familyOf(g).concat(familyOf(b), friendsOf(b, 4), friendsOf(g, 4)), '💍');
    news('💍', `${fn(g)} ile ${fn(b)} nişanlandı. Yüzükler takıldı, tatlılar dağıtıldı.`);
    S.events.push({k: 'kina', day: curDay() + ri(25, 55), g: g.id, b: b.id});
  },
  kina(e) {
    const c = S.courts.find(x => x.g === e.g && x.b === e.b), g = P(e.g), b = P(e.b);
    if (!c || !present(g) || !present(b)) { if (c) endCourt(c); return; }
    c.st = 'kina';
    const women = familyOf(b).concat(familyOf(g), friendsOf(b, 8), sample(presentList().filter(q => q.g === 'K' && age(q) >= 12), .25)).filter(q => q.g === 'K');
    addGather('kina', {pl: M.houses[b.h], out: false}, 19, 23, women, '🌿');
    news('🌿', `${nin(fn(b))} kına gecesi yapıldı. Kadınlar türküler söyledi, gelinin eline kına yakıldı.`);
    S.events.push({k: 'dugun', day: curDay() + 1, g: g.id, b: b.id});
  },
  dugun(e) {
    const c = S.courts.find(x => x.g === e.g && x.b === e.b), g = P(e.g), b = P(e.b);
    if (c) endCourt(c);
    if (!present(g) || !present(b) || g.sp != null || b.sp != null) return;
    const salon = S.proj.salon.st === 2;
    const cost = salon ? 25000 : 30000;
    pay(g, cost * .7, P(g.f)); pay(b, cost * .3, P(b.f));
    marry(g, b);
    const guests = familyOf(g).concat(familyOf(b), friendsOf(g, 10), friendsOf(b, 10), sample(presentList().filter(q => age(q) >= 4), .55));
    const pl = salon ? M.kamu.salon : M.meydan;
    const cx = salon ? pl.x + pl.w / 2 : M.meydan.cx, cy = salon ? pl.y + pl.h / 2 : M.meydan.cy;
    addGather('dugun', {pl, out: true, ring: {cx, cy, r: salon ? 28 : 46}}, 14, 22, guests, '💃');
    for (const q of guests) { if (present(q)) { q.mood += 6; changeRel(q, g, 2, false); changeRel(q, b, 2, false); } }
    for (const par of [P(g.f), P(g.m), P(b.f), P(b.m)]) if (isAlive(par)) { par.mood += 20; par.rep += 2; }
    news('💒', `${fn(g)} ile ${b.n} ${b.ms || b.s} evlendi! ${salon ? 'Düğün salonunda' : 'Köy meydanında'} davullar, zurnalar çalındı; halaylar çekildi.`);
  },
  cenaze(e) {
    const p = P(e.id); if (!p) return;
    const fam = [P(p.sp), P(p.f), P(p.m), ...children(p), ...siblings(p)].filter(present);
    const att = fam.concat(presentList().filter(q => relV(q, p) > 20), sample(presentList().filter(q => age(q) >= 14), .45));
    addGather('cenaze', {pl: M.cami, out: true, area: M.cami.yard}, 12, 13.5, att, '🕌');
    addGather('cenaze', {pl: M.mezar, out: true, area: M.mezar.yard}, 13.5, 15, att, '⚱️');
    // Taziye: katılanlar ile ailenin ilişkisi güçlenir; küsler barışabilir
    for (const q of new Set(att)) for (const f of fam) if (q !== f) { changeRel(q, f, 4); if (q.kus[f.id] && chance(.4)) setKus(q, f, false); }
    news('🤲', `${fn(p)} için cenaze namazı kılındı. Köy halkı cenazeye katıldı, ailesine taziyede bulundu.`);
  },
  ugurlama(e) {
    const p = P(e.id); if (!present(p) || p.askerDone || p.away) return;
    const att = familyOf(p).concat(friendsOf(p, 10), sample(presentList().filter(q => age(q) >= 10), .35));
    addGather('ugurlama', {pl: M.meydan, out: true, area: M.meydan.yard}, 17, 21, att, '🎖️');
    for (const q of att) if (q !== p) changeRel(q, p, 4);
    news('🎖️', `${fn(p)} askere uğurlandı! Köy meydanında davul zurna eşliğinde "Asker yolu gözlüyor" dendi.`);
    S.events.push({k: 'askerGit', day: curDay() + 1, id: p.id});
  },
  askerGit(e) {
    const p = P(e.id); if (!present(p)) return;
    leaveJob(p); p.job = null; p.away = 'asker'; p.ret = curMonth() + 12; delete R.ag[p.id]; dirty();
  },
  donus(e) {
    const p = P(e.id); if (!present(p)) return;
    const att = familyOf(p).concat(friendsOf(p, 10), sample(presentList().filter(q => age(q) >= 10), .2));
    addGather('donus', {pl: M.meydan, out: true, area: M.meydan.yard}, 18, 21, att, '🎉');
    p.rep += 4; p.mood += 20;
    news('🎉', `${fn(p)} askerden döndü! Köyde davullar çaldı, kurbanlar kesildi.`);
  },
  kampanya(e) {
    const c = P(e.id); if (!present(c) || !S.secim) return;
    const kh = S.biz.find(b => b.t === 'kahvehane');
    const att = [c].concat(friendsOf(c, 6), sample(presentList().filter(q => age(q) >= 18), .15));
    const dest = kh ? {pl: M.lots[kh.lot], out: true, area: M.lots[kh.lot].yard} : {pl: M.meydan, out: true, area: M.meydan.yard};
    addGather('kampanya', dest, 19, 21.5, att, '📣');
    const k = has(c, 'kurnaz') ? 1.5 : 1;
    for (const q of att) if (q !== c) changeRel(q, c, rnd(2, 7) * k, false);
    const spend = Math.min(c.money * .1, 5000); c.money -= spend;
    S.secim.camp[c.id] = (S.secim.camp[c.id] || 0) + spend / 1000 + 2;
    if (chance(.5)) news('📣', `Muhtar adayı ${fn(c)} ${kh ? 'kahvehanede' : 'meydanda'} köylülere seslendi, çaylar ondan!`);
  },
  secim(e) {
    if (!S.secim) return;
    const okul = M.okul.ilkokul;
    const voters = presentList().filter(q => age(q) >= 18);
    const g = addGather('secim', {pl: okul, out: false}, 9, 17, voters, '🗳️', {per: {}});
    for (const v of voters) g.per[v.id] = rnd(9, 16);
    news('🗳️', 'Muhtarlık seçimi için sandıklar kuruldu. Köylüler oy vermek için okulda!');
    S.events.push({k: 'secimSonuc', day: curDay() + 1});
  },
  secimSonuc() { secimSonuc(); },
  senlik() {
    const m = P(S.muhtar); if (S.treasury < 40000) return;
    S.treasury -= 30000;
    const att = sample(presentList().filter(q => age(q) >= 4), .7).concat(m ? [m] : []);
    addGather('senlik', {pl: M.meydan, out: true, ring: {cx: M.meydan.cx, cy: M.meydan.cy, r: 50}}, 15, 22, att, '🎪');
    for (const q of att) if (present(q)) { q.mood += 8; if (m && q !== m) changeRel(q, m, 3, false); }
    if (m) m.rep += 2;
    news('🎪', `Geleneksel köy şenliği yapıldı! Güreşler tutuldu, pilavlar dağıtıldı, gece boyu halay çekildi.`);
  },
};

function istemeSonuc(c, ok) {
  const g = P(c.g), b = P(c.b); if (!g || !b) { endCourt(c); return; }
  const bf = P(b.f);
  if (ok) {
    c.st = 'soz';
    news('🤝', `${b.s} ailesi ${nin(g.n)} isteğini kabul etti. "Allah'ın emri, Peygamber'in kavliyle" söz kesildi.`);
    changeClan(g.s, bf ? bf.s : b.s, 8); g.mood += 15; b.mood += 8;
    S.events.push({k: 'nisan', day: curDay() + ri(12, 35), g: g.id, b: b.id});
  } else {
    endCourt(c);
    news('🙅', `${bf ? bf.s : b.s} ailesi kızları ${yi(b.n)} ${ye(g.n)} vermedi.`);
    g.mood -= 20; changeRel(g, b, -10); changeClan(g.s, bf ? bf.s : b.s, -6);
    // Kız kaçırma: karşılıklı büyük aşk varsa
    if ((g.rom[b.id] || 0) >= 65 && (b.rom[g.id] || 0) >= 65 && !controlled(g) && chance(.35)) {
      marry(g, b);
      changeClan(g.s, bf ? bf.s : b.ms, -25);
      if (bf) { changeRel(bf, g, -40); setKus(bf, g, true); }
      news('🏃', `Köy çalkalanıyor: ${fn(g)} ile ${b.n} birlikte kaçtı! Aileler arasında gerginlik var.`);
    }
  }
}

/* Para ödeme: önce kendisi, yetmezse babası yardım eder, kalan borca yazılır */
function pay(p, amt, helper) {
  let need = amt;
  const own = Math.min(Math.max(0, p.money), need); p.money -= own; need -= own;
  if (need > 0 && isAlive(helper)) { const h = Math.min(Math.max(0, helper.money * .5), need); helper.money -= h; need -= h; }
  if (need > 0) p.debt += need;
}

function marry(g, b) {
  g.sp = b.id; b.sp = g.id; g.dul = b.dul = false; g.bosandi = b.bosandi = false;
  if (b.s !== g.s) { b.ms = b.ms || b.s; b.s = g.s; }
  changeRel(g, b, 25); g.rom[b.id] = Math.max(60, g.rom[b.id] || 0); b.rom[g.id] = Math.max(50, b.rom[g.id] || 0);
  const bClan = b.ms || (P(b.f) ? P(b.f).s : null);
  if (bClan) changeClan(g.s, bClan, 25);
  // İki ailenin bireyleri arasında yakınlık
  for (const x of familyOf(g)) for (const y of familyOf(b)) if (x !== y) changeRel(x, y, 8);
  // Yeni hane
  const others = hm(g.h).filter(q => q !== g && q !== b);
  let newH = g.h;
  if (g.h < 0 || others.length) {
    const free = findFreeHouse(g.h);
    if (free >= 0) {
      const cost = S.built[free] ? 20000 : 60000;
      const fund = g.money + (P(g.f) ? Math.max(0, P(g.f).money) * .4 : 0);
      if (fund >= cost * .7 || others.length >= 5 || g.h < 0) {
        pay(g, cost, P(g.f)); newH = free;
        if (!S.built[free]) { S.built[free] = true; R.mapDirty = true; }
        news('🏠', `${g.n} ve ${b.n} ${g.s} yeni evlerine taşındı; köyde yeni bir hane kuruldu.`);
      }
    }
  }
  const bKids = children(b).filter(k => isAlive(k) && age(k) < 18 && k.h === b.h);
  g.h = newH; b.h = newH; for (const k of bKids) k.h = newH;
  dirty();
  g.mood += 25; b.mood += 20;
  if (b.job && b.job.t === 'isci' && chance(.3)) { leaveJob(b); b.job = {t: 'ev'}; }
}

function divorce(a, b) {
  a.sp = null; b.sp = null; a.bosandi = b.bosandi = true;
  const w = a.g === 'K' ? a : b, h = w === a ? b : a;
  const kids = children(w).filter(k => isAlive(k) && age(k) < 18 && k.h === w.h);
  const wf = P(w.f);
  let to = isAlive(wf) && wf.h >= 0 ? wf.h : findFreeHouse(w.h);
  if (to >= 0) { if (!S.built[to]) { S.built[to] = true; R.mapDirty = true; } w.h = to; for (const k of kids) k.h = to; }
  if (w.ms) { w.s = w.ms; }
  changeRel(a, b, -30); setKus(a, b, true); a.mood -= 30; b.mood -= 30; a.rep -= 3; b.rep -= 3;
  changeClan(h.s, w.s, -20);
  dirty();
  news('💔', `${fn(h)} ile ${fn(w)} boşandı. ${kids.length ? 'Çocuklar anneleriyle kalacak.' : ''}`);
}

/* Etkileşim: aynı yerde bulunan iki kişi arasında */
function canRomance(a, b) {
  if (a.g === b.g || a.sp != null || b.sp != null) return false;
  const aa = age(a), ab = age(b);
  if (aa < 16 || ab < 16 || Math.abs(aa - ab) > 12) return false;
  const ca = courtOf(a.id), cb = courtOf(b.id);
  if ((ca && ca !== cb) || (cb && ca !== cb)) return false;
  return !isKin(a, b);
}
function chem(a, b) { const x = ((Math.min(a.id, b.id) * 73856093) ^ (Math.max(a.id, b.id) * 19349663)) >>> 0; return (x % 100) / 100; }
function interact(a, b, ctx) {
  if (a === b || !present(a) || !present(b)) return;
  const va = relV(a, b);
  let d = rnd(-2.5, 5);
  if (has(a, 'neseli') || has(b, 'neseli')) d += 1.5;
  if (has(a, 'sinirli')) d -= 1.5; if (has(b, 'sinirli')) d -= 1.5;
  if (has(a, 'sakin') && has(b, 'sakin')) d += 1;
  if (has(a, 'dindar') && has(b, 'dindar')) d += 1.5;
  d += clanRel(a.s, b.s) / 50;
  d += va > 30 ? 1 : (va < -30 ? -1.5 : 0);
  if (a.kus[b.id]) d = Math.min(d, 0) - .5;
  if (ctx === 'dugun' || ctx === 'bayram') d += 3; else if (ctx === 'cenaze') d += 2;
  changeRel(a, b, d * .9);
  if (canRomance(a, b)) {
    const c = chem(a, b) * 3 - 1;
    let sh = 0; for (const t of a.tr) { if (b.tr.includes(t)) sh += 1; if (ZIT[t] && b.tr.includes(ZIT[t])) sh -= 1.5; }
    a.rom[b.id] = clamp((a.rom[b.id] || 0) + rnd(-1.5, 3.5) + c + sh * .5, 0, 100);
    b.rom[a.id] = clamp((b.rom[a.id] || 0) + rnd(-1.5, 3.5) + c + sh * .5, 0, 100);
    if (a.rom[b.id] < 1) delete a.rom[b.id]; if (b.rom[a.id] < 1) delete b.rom[a.id];
  }
  const v = relV(a, b);
  if (!controlled(a) && v < -45 && (ctx === 'kahve' || ctx === 'meydan' || ctx === 'is')) {
    const pf = .005 + (has(a, 'sinirli') ? .025 : 0) + (has(b, 'sinirli') ? .01 : 0) - (has(a, 'sakin') ? .004 : 0) - (a.goal === 'saygin' ? .003 : 0);
    if (chance(pf)) kavga(a, b);
  }
  if (!controlled(a) && has(a, 'dedikoducu') && chance(.02)) dedikodu(a, b);
  if (!a.kus[b.id] && v < -35 && chance(.05)) {
    setKus(a, b, true);
    if (newsQuota('kus', 2)) news('😤', `${fn(a)} ile ${fn(b)} birbirine küstü.`);
  }
}

function kavga(a, b, silent) {
  changeRel(a, b, -30); setKus(a, b, true);
  a.rep -= has(a, 'sinirli') ? 6 : 4; b.rep -= 2;
  a.hl -= rnd(0, 8); b.hl -= rnd(0, 10); a.mood -= 10; b.mood -= 15;
  if (a.s !== b.s) changeClan(a.s, b.s, -12);
  // Aileler de taraf tutar
  for (const f of familyOf(a)) if (f !== a) changeRel(f, b, -8);
  for (const f of familyOf(b)) if (f !== b) changeRel(f, a, -8);
  const yer = pick(['Kahvehanede', 'Köy meydanında', 'Çarşıda', 'Tarla sınırında']);
  if (!silent && newsQuota('kavga', 2)) news('👊', `${yer} kavga! ${fn(a)} ile ${fn(b)} birbirine girdi. Araya girenler zor ayırdı.`);
}
function dedikodu(a, listener, target) {
  if (!target) {
    let worst = null, wv = -10;
    for (const id in a.rel) { const q = P(id); if (present(q) && q !== listener && a.rel[id] < wv) { wv = a.rel[id]; worst = q; } }
    target = worst || pick(presentList().filter(q => q !== a && q !== listener && age(q) >= 16));
  }
  if (!target) return;
  const dmg = rnd(2, 5) * (has(a, 'kurnaz') ? 1.3 : 1);
  target.rep -= dmg; if (listener) changeRel(listener, target, -5, false);
  if (chance(.25)) {
    changeRel(target, a, -25); setKus(target, a, true); a.rep -= 3;
    if (newsQuota('dedikodu', 2)) news('🗣️', `${nin(fn(a))}, ${fn(target)} hakkında dedikodu yaptığı ortaya çıktı. İkisi küstü.`);
  } else if (chance(.15) && newsQuota('dedikodu', 2)) news('🗣️', `Köyde ${fn(target)} hakkında dedikodular dolaşıyor…`);
}
function baris(a, b, why) {
  setKus(a, b, false); changeRel(a, b, Math.max(10, -relV(a, b) * .5));
  if (why !== 'sessiz' && newsQuota('baris', 3)) news('🕊️', `${fn(a)} ile ${fn(b)} ${why || 'barıştı'}.`);
}

function monthlySocial() {
  // Küsler barışabilir
  const all = presentList();
  for (const a of all) for (const id in a.kus) {
    const b = P(id); if (!b || !present(b) || a.id > b.id) continue;
    let p = .025; for (const q of [a, b]) { if (has(q, 'dindar')) p += .015; if (has(q, 'sakin')) p += .015; if (has(q, 'comert')) p += .01; if (has(q, 'sinirli')) p -= .01; }
    if (isKin(a, b)) p += .04;
    if (!controlled(a) && !controlled(b) && chance(p)) baris(a, b, chance(.5) ? 'barıştı' : 'sessiz');
  }
  // Boşanma
  for (const a of all) {
    if (a.g !== 'E' || a.sp == null) continue; const b = P(a.sp); if (!present(b)) continue;
    // Evlilik içi ilişki yavaşça değişir
    let d = rnd(-1.5, 2.5) + (has(a, 'sinirli') ? -1 : 0) + (has(b, 'sinirli') ? -1 : 0) + (has(a, 'neseli') || has(b, 'neseli') ? 1 : 0);
    if (a.money < 0 || a.debt > 60000) d -= 1;
    changeRel(a, b, d);
    const v = Math.min(relV(a, b), relV(b, a));
    if (v < -40 && !controlled(a) && !controlled(b)) {
      const pd = .04 + (has(a, 'sinirli') || has(b, 'sinirli') ? .02 : 0) - (has(a, 'dindar') || has(b, 'dindar') ? .025 : 0);
      if (chance(pd)) divorce(a, b);
    }
  }
}

/* Bayram */
function bayramStart(k) {
  const all = presentList();
  let barisan = [];
  for (const a of all) for (const id in a.kus) {
    const b = P(id); if (!b || !present(b) || a.id > b.id) continue;
    let p = .35 + (has(a, 'dindar') || has(b, 'dindar') ? .15 : 0) - (has(a, 'sinirli') && has(b, 'sinirli') ? .15 : 0);
    if (controlled(a) || controlled(b)) p = 0;
    if (chance(p)) { baris(a, b, 'sessiz'); barisan.push([a, b]); }
  }
  // El öpme ve bayram harçlığı
  for (const p of all) {
    const a = age(p);
    if (a < 25) {
      for (const e of [P(p.f), P(p.m), ...[P(p.f), P(p.m)].filter(Boolean).flatMap(x => [P(x.f), P(x.m)])]) {
        if (!present(e)) continue; changeRel(p, e, 4); e.mood += 3;
