        if (a < 15 && e.money > 2000) { e.money -= 100; p.money += 100; }
      }
    }
    p.mood += 10;
  }
  for (const k2 in S.clan) S.clan[k2] = clamp(S.clan[k2] + (S.clan[k2] < 0 ? 4 : 1), -100, 100);
  if (k === 'kur') {
    let n = 0;
    const houses = new Set(all.map(p => p.h));
    for (const h of houses) {
      const head = hm(h).filter(q => age(q) >= 18).sort((a, b) => b.money - a.money)[0];
      if (head && head.money > 40000) { head.money -= 9000; head.rep += 2; n++; }
    }
    for (const p of all) if (p.money < 5000) p.mood += 8;
    news('🐑', `Kurban Bayramı: ${n} hane kurban kesti, etler komşulara ve ihtiyaç sahiplerine dağıtıldı.`);
  } else {
    news('🍬', 'Ramazan Bayramı: Çocuklar kapı kapı şeker topladı, büyüklerin elleri öpüldü.');
  }
  if (barisan.length) news('🕊️', `Bayram vesilesiyle ${barisan.length} küs çift barıştı${barisan.length ? ': ' + barisan.slice(0, 3).map(([a, b]) => `${a.n}–${b.n}`).join(', ') : ''}.`);
}

/* ======================= 9) SEÇİM VE MUHTARLIK ======================= */
function secimBaslat(gunSonra) {
  if (S.secim) return;
  const adults = presentList().filter(p => age(p) >= 25);
  let cands = adults.filter(p => (p.goal === 'muhtar' && p.rep >= 30) || p.cand);
  const inc = P(S.muhtar);
  if (present(inc) && inc.rep >= 30 && !cands.includes(inc) && (!controlled(inc) || inc.cand)) cands.push(inc);
  if (cands.length < 2) {
    const extra = adults.filter(p => !cands.includes(p) && !controlled(p)).sort((a, b) => (b.rep + (has(b, 'hirsli') ? 15 : 0)) - (a.rep + (has(a, 'hirsli') ? 15 : 0)));
    while (cands.length < 2 && extra.length) cands.push(extra.shift());
  }
  cands.sort((a, b) => (b.cand ? 100 : 0) + b.rep - (a.cand ? 100 : 0) - a.rep);
  cands = cands.slice(0, 4);
  const d = curDay();
  S.secim = {cands: cands.map(c => c.id), camp: {}, day: d + gunSonra};
  for (const c of cands) {
    c.cand = false;
    for (let i = 0; i < 3; i++) S.events.push({k: 'kampanya', day: d + ri(3, Math.max(4, gunSonra - 3)), id: c.id});
  }
  S.events.push({k: 'secim', day: d + gunSonra});
  news('🗳️', `Muhtarlık seçimi ${tarihStr(d + gunSonra)} tarihinde. Adaylar: ${cands.map(fn).join(', ')}.`);
}
function addCandidate(p) {
  if (!S.secim) { p.cand = true; return 'Bir sonraki seçimde aday olacaksın.'; }
  if (S.secim.cands.includes(p.id)) return 'Zaten adaysın.';
  S.secim.cands.push(p.id); news('📣', `${fn(p)} muhtarlığa adaylığını açıkladı!`);
  return 'Adaylığın açıklandı. Kampanya için halkla iyi geçin!';
}
function voteScore(v, c, sec) {
  let s = relV(v, c) * .8 + (c.rep - 50) * .6 + clanRel(v.s, c.s) * .3 + (sec.camp[c.id] || 0);
  if (v.s === c.s) s += 20; if (isKin(v, c) || v.sp === c.id) s += 40;
  if (has(v, 'dindar') && has(c, 'dindar')) s += 8;
  if (S.muhtar === c.id) s += S.termProjects * 4 - 5;
  if (v.kus[c.id]) s -= 40;
  return s + rnd(-15, 15);
}
function secimSonuc() {
  const sec = S.secim; S.secim = null; if (!sec) return;
  const cands = sec.cands.map(P).filter(present);
  if (!cands.length) return;
  const votes = {}; cands.forEach(c => votes[c.id] = 0);
  for (const v of presentList().filter(q => age(q) >= 18)) {
    let best = cands[0], bs = -1e9;
    for (const c of cands) { const s = c === v ? 1e6 : voteScore(v, c, sec); if (s > bs) { bs = s; best = c; } }
    votes[best.id]++;
  }
  cands.sort((a, b) => votes[b.id] - votes[a.id]);
  const w = cands[0], old = P(S.muhtar);
  const list = cands.map(c => `${fn(c)}: ${votes[c.id]}`).join(', ');
  S.elections.push({y: curYear(), w: w.id, wn: fn(w), note: '', votes: cands.map(c => [fn(c), votes[c.id]])});
  if (old && old !== w && isAlive(old)) { old.mood -= 15; }
  for (const c of cands) if (c !== w) { c.mood -= 15; }
  S.muhtar = w.id; S.muhtarSince = curMonth(); S.termProjects = 0;
  w.rep += 10; w.mood += 30; if (w.goal === 'muhtar') w.goalDone = true;
  news('🏛️', `Seçim sonuçlandı! Yeni muhtar ${fn(w)}. Oylar — ${list}.`);
}

/* Muhtar yatırımları */
function projeUygun(k) {
  const st = S.proj[k], pop = alive().length, kids = alive().filter(p => age(p) >= 6 && age(p) < 18).length;
  if (k === 'cesme') return st.n < PROJE.cesme.max;
  if (st.st !== 0) return false;
  switch (k) {
    case 'park': return pop >= 80; case 'ortaokul': return kids >= 12; case 'asfalt': return pop >= 90;
    case 'saglik': return pop >= 120; case 'kutuphane': return S.proj.ortaokul.st === 2;
    case 'lise': return S.proj.ortaokul.st === 2 && pop >= 140; case 'salon': return pop >= 150;
  }
  return false;
}
function projePuan(k) {
  const all = alive(), kids = all.filter(p => age(p) >= 6 && age(p) < 18).length, old = all.filter(p => age(p) >= 60).length;
  switch (k) {
    case 'ortaokul': return 50 + kids; case 'lise': return 40 + kids * .8; case 'saglik': return 35 + old * 2;
    case 'cesme': return 25 - S.proj.cesme.n * 5; case 'asfalt': return 30; case 'park': return 18 + kids * .3;
    case 'kutuphane': return 20 + kids * .3; case 'salon': return 15;
  }
  return 0;
}
function startProject(k, by) {
  const P0 = PROJE[k], st = S.proj[k];
  if (S.treasury < P0.cost) return false;
  S.treasury -= P0.cost; st.st = 1; st.kalan = P0.ay; S.termProjects++;
  const m = P(S.muhtar); if (m) m.rep += 3;
  news('🚧', `Muhtar ${m ? fn(m) : ''} ${P0.ad.toLocaleLowerCase('tr')} yapımını başlattı (${para(P0.cost)}).`);
  R.mapDirty = true; return true;
}
function monthlyProjects() {
  // Hizmetteki tesislerin bakım gideri
  for (const k in S.proj) if (S.proj[k].st === 2) S.treasury -= PROJE[k].cost * .006;
  S.treasury -= (S.proj.cesme.n || 0) * 150;
  // Köy şenliği (her Ağustos)
  if (moy() === 7 && S.treasury > 60000 && present(P(S.muhtar))) S.events.push({k: 'senlik', day: curDay() + ri(5, 20)});
  for (const k in S.proj) {
    const st = S.proj[k];
    if (st.st === 1 && --st.kalan <= 0) {
      if (k === 'cesme') { st.n++; st.st = 0; } else st.st = 2;
      news(PROJE[k].ikon, `${PROJE[k].ad} hizmete açıldı! Köylüler çok memnun.`);
      for (const p of alive()) p.mood += 4;
      R.mapDirty = true;
    }
  }
  const m = P(S.muhtar);
  if (!present(m) || controlled(m)) return;
  if (Object.values(S.proj).some(s => s.st === 1)) return;
  const opts = Object.keys(PROJE).filter(projeUygun).filter(k => S.treasury >= PROJE[k].cost * 1.05).sort((a, b) => projePuan(b) - projePuan(a));
  if (opts.length && chance(.5)) startProject(opts[0]);
  else if (!Object.keys(PROJE).some(projeUygun) && S.treasury > 250000 && chance(.25)) {
    // Yapılacak proje kalmadıysa hazine fazlası yoksul hanelere dağıtılır
    const poor = alive().filter(p => age(p) >= 18 && p.money < 15000).sort((a, b) => a.money - b.money).slice(0, 15);
    if (poor.length) { const amt = Math.round(S.treasury * .25 / poor.length); for (const p of poor) { p.money += amt; changeRel(p, m, 10, false); p.mood += 10; } S.treasury -= amt * poor.length; m.rep += 4; news('🤲', `Muhtar ${fn(m)} hazineden ${poor.length} ihtiyaç sahibine ${para(amt)} yardım dağıttı.`); }
  }
}

function dailyTick() {

function pruneRelations() {
  for (const p of alive()) {
    for (const id in p.rel) { const q = S.people[id]; if (!q || q.dead || q.left) delete p.rel[id]; }
    for (const id in p.rom) { const q = S.people[id]; if (!q || !isAlive(q) || q.sp != null || p.sp != null) delete p.rom[id]; }
    for (const id in p.kus) { const q = S.people[id]; if (!q || !isAlive(q)) delete p.kus[id]; }
    const keys = Object.keys(p.rel);
    if (keys.length > 45) {
      keys.sort((a, b) => Math.abs(p.rel[a]) - Math.abs(p.rel[b]));
      for (let i = 0; i < keys.length - 40; i++) { const q = S.people[keys[i]]; if (q && isKin(p, q)) continue; delete p.rel[keys[i]]; }

}
/* Aile ağacı için gerekmeyen eski kayıtları sil (kayıt dosyası küçük kalsın) */
function prunePeople() {
  const keep = new Set();
  for (const p of alive()) {
    keep.add(p.id); if (p.sp != null) keep.add(p.sp);
    for (const id of [p.f, p.m]) { if (id != null) { keep.add(id); const q = S.people[id]; if (q) { if (q.f != null) keep.add(q.f); if (q.m != null) keep.add(q.m); if (q.sp != null) keep.add(q.sp); } } }
    for (const c of p.ch) keep.add(c);
  }
  for (const id in S.people) if (!keep.has(+id)) delete S.people[id];
  for (const p of Object.values(S.people)) p.ch = p.ch.filter(c => S.people[c]);
  dirty();
}

}
const dIn = pl => ({pl, out: false});
function dOut(pl, area) { area = area || pl.yard || pl; return {pl, out: true, x: area.x + 4 + Math.random() * (area.w - 8), y: area.y + 4 + Math.random() * (area.h - 8)}; }
function homeDest(p) { return dIn(houseOf(p) || M.meydan); }

function buildSchedules(bay) {
  const d = curDay(), dow = d % 7, mo = moy(), se = MEVSIM(mo);
  const schoolOpen = !bay && dow < 5 && !(mo >= 5 && mo <= 7);
  const workDay = !bay && dow < 6;
  R.groups = new Map();
  const addG = (k, p) => { if (!k) return; if (!R.groups.has(k)) R.groups.set(k, []); R.groups.get(k).push(p); };
  const muhId = S.muhtar;
  for (const p of presentList()) {
    const ag = agentOf(p), a = age(p), home = homeDest(p);
    const J = () => rnd(-.4, .4);
    let s = [[0, home]], main = null, mainDest = null, eve = null;
    const jt = p.job ? p.job.t : null;
    const set = (h, dest, key) => { s.push([h, dest]); if (key) { main = main || key; mainDest = mainDest || dest; } };
    if (a < 4) { /* bebekler evde */ }
    else if (p.school && p.school !== 'uni') {
      if (schoolOpen) { const pl = M.okul[p.school] && S.proj[p.school] && S.proj[p.school].st !== 2 && p.school !== 'ilkokul' ? null : M.okul[p.school];
        if (pl) { set(7.5 + J(), dIn(pl), 'okul:' + p.school); s.push([12.2, dOut(M.okulAvlu)]); s.push([12.8, dIn(pl)]); s.push([15 + J(), home]); }
        else { // köyde okul yok: ilçeye taşımalı eğitim (minibüsle köyden çıkar)
          set(7.2 + J(), dIn(M.muhtarlik), 'tasimali'); s.push([16 + J(), home]); }
      } else if (a >= 6 && chance(.6)) { const pl = S.proj.park.st === 2 ? dOut(M.kamu.park) : dOut(M.meydan); set(10 + J(), pl, 'meydan'); s.push([13 + J(), home]); }
    }
    else if (a < 6) { if (chance(.25)) { set(10 + J(), dOut(M.meydan), 'meydan'); s.push([11.5, home]); } }
    else if (jt && workDay) {
      switch (jt) {
        case 'ciftci':
          if (se !== 0) { const t = M.tarla[p.job.w % M.tarla.length]; set(6.5 + J(), dOut(t), 'tarla:' + t.idx); s.push([18 + J(), home]); }
          else if (p.g === 'E') { const [kd, kk] = kahveDest(p); set(10 + J(), kd, kk); s.push([16 + J(), home]); }
          break;
        case 'hayvanci': { const ah = M.ahir[p.job.w % M.ahir.length]; set(6 + J(), se === 0 ? dIn(ah) : dOut(ah, ah.mera), 'ahir:' + ah.idx); s.push([17.5 + J(), home]); break; }
        case 'isci': case 'sahip': {
          const b = bizById(p.job.w); if (!b) break; const l = M.lots[b.lot];
          if (b.t === 'kahvehane') set(8 + J(), dOut(l, l.yard), 'kahve:' + b.id); else set(8 + J(), dIn(l), 'is:' + b.id);
          s.push([19.5 + J(), home]); break;
        }
        case 'ogretmen': if (schoolOpen) { const pl = M.okul[p.job.w] || M.okul.ilkokul; set(7.8, dIn(pl), 'okul:' + (p.job.w || 'ilkokul')); s.push([16 + J(), home]); } break;
        case 'doktor': case 'hemsire': if (S.proj.saglik.st === 2) { set(8, dIn(M.kamu.saglik), 'is:saglik'); s.push([17, home]); } break;
        case 'imam': set(5.5, dIn(M.cami), 'cami'); s.push([21, home]); break;
        case 'ev': {
          if (chance(.4)) { const sd = shopDest('gida'); if (sd) { set(10 + J(), sd[0], sd[1]); s.push([11, home]); } }
          if (chance(.45)) { const v = visitDest(p); if (v) { set(14.5 + J(), v[0], v[1]); s.push([16.5 + J(), home]); } }
          break;
        }
        case 'emekli': case 'issiz':
          if (p.g === 'E' && chance(.75)) { const [kd, kk] = kahveDest(p); set(9.5 + J(), kd, kk); s.push([12, home]); s.push([14 + J(), kd]); s.push([18.5 + J(), home]); }
          else if (chance(.5)) { const v = visitDest(p); if (v) { set(14.5 + J(), v[0], v[1]); s.push([16.5 + J(), home]); } }
          if (has(p, 'dindar') && a >= 55 && chance(.5)) { s.push([12.5, dIn(M.cami)]); s.push([13.3, home]); }
          break;
      }
    } else if (bay) {
      if (bay.n === 0 && p.g === 'E' && a >= 12) { s.push([7, dOut(M.cami, M.cami.yard)]); s.push([8.2, home]); addG('cami', p); }
      const v1 = visitDest(p); if (v1) { s.push([10 + J(), v1[0]]); s.push([12, home]); addG('bayram:' + v1[1], p); }
      const v2 = visitDest(p); if (v2) { s.push([14 + J(), v2[0]]); s.push([16.5, home]); addG('bayram:' + v2[1], p); }
    } else if (a >= 14 && dow === 6) {
      // Pazar: meydan, kahve, komşu
      if (p.g === 'E' && a >= 18 && chance(.5)) { const [kd, kk] = kahveDest(p); set(11 + J(), kd, kk); s.push([17, home]); }
      else if (chance(.4)) { const v = visitDest(p); if (v) { set(14 + J(), v[0], v[1]); s.push([17, home]); } }
    }
    // Cuma namazı
    if (dow === 4 && !bay && p.g === 'E' && a >= 14 && (has(p, 'dindar') || chance(.5))) {
      s = s.filter(e => e[0] < 12.2 || e[0] >= 13.4); s.push([12.2, dIn(M.cami)]); s.push([13.4, mainDest || home]); addG('cami', p);
    }
    // Muhtar sabahları muhtarlıkta
    if (p.id === muhId && workDay) { s = s.filter(e => e[0] < 9 || e[0] >= 11.5); s.push([9, dIn(M.muhtarlik)]); s.push([11.5, mainDest || home]); addG('muhtarlik', p); }
    // Akşam: kahvehane / meydanda gezinti
    if (a >= 18 && p.g === 'E' && jt !== 'imam' && chance(has(p, 'neseli') || has(p, 'sinirli') ? .35 : .22)) { const [kd, kk] = kahveDest(p); s.push([19.8 + J(), kd]); s.push([22.5, home]); eve = kk; }
    else if (a >= 15 && a < 30 && p.sp == null && chance(.15)) { s.push([19.5 + J(), dOut(M.meydan)]); s.push([21.5, home]); eve = 'meydan'; }
    // Toplu etkinlikler (düğün, cenaze, uğurlama...) programın önüne geçer
    const gl = R.gatherBy.get(p.id);
    if (gl) for (const g of gl) {
      let st = g.start, en = g.end;
      if (g.per) { st = g.per[p.id]; en = st + .7; }
      const before = s.filter(e => e[0] < st), after = s.filter(e => e[0] >= en);
      const resume = s.filter(e => e[0] < en).pop();
      let dest = g.dest;
      if (g.dest.ring) { const n = g.att.length, i = g.att.indexOf(p.id); dest = {pl: g.dest.pl, out: true, ring: Object.assign({a0: i / n * Math.PI * 2}, g.dest.ring)}; dest.x = dest.ring.cx + dest.ring.r * Math.cos(dest.ring.a0); dest.y = dest.ring.cy + dest.ring.r * Math.sin(dest.ring.a0); }
      else if (g.dest.out) dest = dOut(g.dest.pl, g.dest.area);
      s = before.concat([[st, dest], [en, resume ? resume[1] : home]], after);
      addG('g:' + g.k + ':' + g.id, p);
    }
    s.sort((x, y) => x[0] - y[0]);
    ag.sched = s; ag.si = 0;
    addG(main, p); addG(eve, p);
  }
}

function socialFromGroups() {
  for (const [k, arr] of R.groups) {
    if (arr.length < 2) continue;
    const ctx = k.startsWith('kahve') ? 'kahve' : k.startsWith('g:dugun') ? 'dugun' : k.startsWith('g:cenaze') ? 'cenaze'
      : k.startsWith('bayram') ? 'bayram' : k.startsWith('meydan') || k.startsWith('g:') ? 'meydan' : k.startsWith('okul') ? 'okul'
      : (k.startsWith('is') || k.startsWith('tarla') || k.startsWith('ahir')) ? 'is' : 'ev';
    const n = Math.min(Math.ceil(arr.length * .5), 24);
    for (let i = 0; i < n; i++) { const a = pick(arr), b = pick(arr); if (a !== b) interact(a, b, ctx); }
  }
  // Hane içi sıcaklık (haftada bir)
  if (curDay() % 7 === 6) for (const p of presentList()) for (const q of hm(p.h)) if (q !== p && present(q) && chance(.5)) changeRel(p, q, rnd(-.5, 2), false);
}

/* Yol bulma: ızgara yollar üzerinde L biçimli rota */
const onH = p => { for (const h of HY) if (Math.abs(p.y - h) < .5) return h; return null; };
const onV = p => { for (const v of VX) if (Math.abs(p.x - v) < .5) return v; return null; };
function roadPath(a, b) {
  const ah = onH(a), av = onV(a), bh = onH(b), bv = onV(b);
  if (ah !== null && ah === bh) return [b];
  if (av !== null && av === bv) return [b];
  if (ah !== null && bv !== null) return [{x: bv, y: ah}, b];
  if (av !== null && bh !== null) return [{x: av, y: bh}, b];
  if (ah !== null && bh !== null) { let best = VX[0]; for (const v of VX) if (Math.abs(a.x - v) + Math.abs(b.x - v) < Math.abs(a.x - best) + Math.abs(b.x - best)) best = v; return [{x: best, y: ah}, {x: best, y: bh}, b]; }
  if (av !== null && bv !== null) { let best = HY[0]; for (const h of HY) if (Math.abs(a.y - h) + Math.abs(b.y - h) < Math.abs(a.y - best) + Math.abs(b.y - best)) best = h; return [{x: av, y: best}, {x: bv, y: best}, b]; }
  return [b];
}
function goTo(ag, dest) {
  if (ag.inside && ag.curPl === dest.pl && !dest.out) { ag.dest = dest; return; }
  const pts = [];
  let from;
  if (ag.inside) { from = {x: ag.curPl.door.x, y: ag.curPl.door.y}; ag.x = from.x; ag.y = from.y; ag.inside = false; }
  else {
    from = {x: ag.x, y: ag.y};
    // Yol dışındaysa (tarla, meydan...) önce bulunduğu yerin kapısına döner
    if (onH(from) === null && onV(from) === null) { from = {x: ag.curPl.door.x, y: ag.curPl.door.y}; pts.push(from); }
  }
  for (const q of roadPath(from, dest.pl.door)) pts.push(q);
  if (dest.out) pts.push({x: dest.x, y: dest.y});
  ag.path = pts; ag.pi = 0; ag.dest = dest; ag.curPl = dest.pl; ag.ring = null;
}
function updateAgents(gm) {
  const hr = hourNow(), dist = gm * WALK;
  for (const id in R.ag) {
    const ag = R.ag[id], p = S.people[id];
    if (!p || !present(p)) { delete R.ag[id]; continue; }
    let nd = null;
    while (ag.si < ag.sched.length && ag.sched[ag.si][0] <= hr) { nd = ag.sched[ag.si][1]; ag.si++; }
    if (nd) goTo(ag, nd);
    if (ag.pi < ag.path.length) {
      let dd = dist;
      while (dd > 0 && ag.pi < ag.path.length) {
        const t = ag.path[ag.pi], dx = t.x - ag.x, dy = t.y - ag.y, L = Math.hypot(dx, dy);
        if (L <= dd) { ag.x = t.x; ag.y = t.y; dd -= L; ag.pi++; } else { ag.x += dx / L * dd; ag.y += dy / L * dd; dd = 0; }
      }
      if (ag.pi >= ag.path.length && ag.dest) { if (!ag.dest.out) ag.inside = true; else if (ag.dest.ring) ag.ring = ag.dest.ring; }
    }
    if (ag.ring) { const a = ag.ring.a0 + performance.now() / 2500; ag.x = ag.ring.cx + ag.ring.r * Math.cos(a); ag.y = ag.ring.cy + ag.ring.r * Math.sin(a); }
  }
}

  if (hr < 5 || hr >= 21) dark = .58; else if (hr < 7) dark = .58 * (7 - hr) / 2; else if (hr >= 18.5) dark = .58 * (hr - 18.5) / 2.5;
  if (dark > 0) {
    ctx.fillStyle = `rgba(12,18,48,${dark})`; ctx.fillRect(0, 0, VW, VH);
    if (dark > .2) {
      ctx.setTransform(DPR * c.z, 0, 0, DPR * c.z, -c.x * c.z * DPR, -c.y * c.z * DPR);
      ctx.fillStyle = `rgba(255,214,110,${Math.min(1, dark * 1.6)})`;
      for (const h of M.houses) { if (!S.built[h.idx] || h.x < vx0 || h.x > vx1 || h.y < vy0 || h.y > vy1) continue; if (!hm(h.idx).length) continue; if ((hr > 23 || hr < 5) && (h.idx % 3)) continue; ctx.fillRect(h.x + 8, h.y + 14, 6, 6); ctx.fillRect(h.x + 30, h.y + 22, 6, 6); }
      if (S.proj.asfalt.st === 2) { ctx.fillStyle = `rgba(255,230,150,${dark * .5})`; for (const v of VX) for (const hh of HY) { ctx.beginPath(); ctx.arc(v + 10, hh + 10, 10, 0, 7); ctx.fill(); } }
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
  }
  // Kar yağışı
  if (se === 0) {
    if (!R.snow) R.snow = Array.from({length: 90}, () => ({x: Math.random(), y: Math.random(), s: rnd(.3, 1)}));
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const f of R.snow) { f.y += dtReal * .06 * f.s * (1 + (S.speed > 0 ? .5 : 0)); f.x += Math.sin(f.y * 20 + f.s * 10) * .0007; if (f.y > 1) { f.y = 0; f.x = Math.random(); } ctx.beginPath(); ctx.arc(f.x * VW, f.y * VH, 1.2 + f.s * 1.4, 0, 7); ctx.fill(); }
  } else if (se === 3 && R.leaves !== false) {
    if (!R.leaf) R.leaf = Array.from({length: 18}, () => ({x: Math.random(), y: Math.random(), s: rnd(.3, 1)}));
    for (const f of R.leaf) { f.y += dtReal * .04 * f.s; f.x += Math.sin(f.y * 12 + f.s * 7) * .002; if (f.y > 1) { f.y = 0; f.x = Math.random(); } ctx.fillStyle = f.s > .6 ? '#d9822b' : '#c0532a'; ctx.beginPath(); ctx.ellipse(f.x * VW, f.y * VH, 3, 1.6, f.y * 10, 0, 7); ctx.fill(); }
  }
}
function updateAnimals(gm) {
  if (gm <= 0) return;
  for (const an of R.animals) {
    an.t -= gm;
    if (an.t <= 0) { an.tx = an.a.mera.x + rnd(8, an.a.mera.w - 8); an.ty = an.a.mera.y + rnd(8, an.a.mera.h - 8); an.t = rnd(60, 300); }
    const dx = an.tx - an.x, dy = an.ty - an.y, L = Math.hypot(dx, dy); if (L > 1) { const s = Math.min(L, gm * .3); an.x += dx / L * s; an.y += dy / L * s; }
  }
}

const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1) drag = {x: e.clientX, y: e.clientY, cx: R.cam.x, cy: R.cam.y, t: performance.now(), moved: 0};
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), z: R.cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: R.cam.x, cy: R.cam.y}; drag = null; }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    const nz = clamp(pinch.z * d / pinch.d, minZoom(), 4);
    const wx = pinch.cx + pinch.mx / pinch.z, wy = pinch.cy + pinch.my / pinch.z;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    R.cam.z = nz; R.cam.x = wx - mx / nz; R.cam.y = wy - my / nz; clampCam(); R.follow = null;
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    if (drag.moved > 6) { R.cam.x = drag.cx - dx / R.cam.z; R.cam.y = drag.cy - dy / R.cam.z; clampCam(); R.follow = null; }
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (drag && drag.moved <= 8 && performance.now() - drag.t < 450 && ptrs.size === 0) handleTap(e.clientX, e.clientY);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) drag = null;
  else if (ptrs.size === 1) { const [a] = [...ptrs.values()]; drag = {x: a.x, y: a.y, cx: R.cam.x, cy: R.cam.y, t: 0, moved: 99}; }
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {
  e.preventDefault(); const z0 = R.cam.z, nz = clamp(z0 * (e.deltaY < 0 ? 1.12 : 1 / 1.12), minZoom(), 4);
  const wx = R.cam.x + e.clientX / z0, wy = R.cam.y + e.clientY / z0; R.cam.z = nz; R.cam.x = wx - e.clientX / nz; R.cam.y = wy - e.clientY / nz; clampCam();
}, {passive: false});

function handleTap(sx, sy) {
  const wx = R.cam.x + sx / R.cam.z, wy = R.cam.y + sy / R.cam.z;
  const rad = Math.max(9, 16 / R.cam.z);
  let best = null, bd = rad;
  for (const id in R.ag) { const ag = R.ag[id]; if (ag.inside) continue; const d = Math.hypot(ag.x - wx, ag.y - wy); if (d < bd) { bd = d; best = +id; } }
  if (best != null) { openProfile(best, true); return; }
  const inR = r => r && wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h;
  for (const h of M.houses) if (S.built[h.idx] && inR(h)) return openHouse(h.idx);
  for (const l of M.lots) if (inR(l)) { const b = S.biz.find(x => x.lot === l.idx); if (b) return openBiz(b.id); return openPlace('lot'); }
  if (inR(M.cami) || inR(M.cami.yard)) return openPlace('cami');
  if (inR(M.muhtarlik)) return openPlace('muhtarlik');
  if (inR(M.meydan)) return openPlace('meydan');
  for (const k in M.okul) if (inR(M.okul[k])) return openPlace('okul', k);
  for (const k in M.kamu) if (inR(M.kamu[k])) return openPlace('kamu', k);
  for (const t of M.tarla) if (inR(t)) return openPlace('tarla', t.idx);
  for (const a of M.ahir) if (inR(a) || inR(a.mera)) return openPlace('ahir', a.idx);
  if (inR(M.mezar)) return openPlace('mezar');
  R.sel = null;
}

function familyTree(p) {
  const gps = [P(p.f), P(p.m)].flatMap(x => x ? [P(x.f), P(x.m)] : []).filter(Boolean);
  const pars = [P(p.f), P(p.m)].filter(Boolean);
  const sibs = siblings(p);
  const kids = children(p);
  const grand = kids.flatMap(children);
  const row = (lbl, arr, me) => arr.length || me ? `<div class="lvl">${lbl}</div><div class="lv">${arr.map(q => chipP(q)).join('')}${me || ''}</div>` : '';
  const sp = P(p.sp);
  const exes = Object.values(S.people).filter(q => q !== sp && q.id !== p.id && ((q.ch.some(c => p.ch.includes(c)))));
  let h = '<div class="tree">';
  h += row('Dede & Nine', gps);
  h += row('Anne & Baba', pars);
  h += row('Kendisi, eşi ve kardeşleri', sibs, `<span class="chip me">${esc(p.n)}</span>${sp ? chipP(sp, 'eşi') : ''}${exes.map(q => chipP(q, 'eski eş')).join('')}`);
  h += row('Çocukları', kids);
  h += row('Torunları', grand);
  h += '</div>';
  return h;
}

  if (tab === 'genel') {

  } else if (tab === 'zengin' || tab === 'saygin') {

  } else if (tab === 'nufus') {
    h += '<canvas id="chart" style="width:100%;height:220px"></canvas><div class="note">Aylık nüfus (turuncu) ve kişi başı ortalama para (yeşil, sağ eksen).</div>';
  } else if (tab === 'secim') {
    if (S.secim) h += `<div class="kv"><span>Yaklaşan seçim</span><span>${tarihStr(S.secim.day)}</span></div><div>${S.secim.cands.map(id => chipP(P(id), 'aday')).join('')}</div>`;
    else { let ny = START_YEAR + 5; while (ny < curYear() || (ny === curYear() && moy() >= 2)) ny += 5; h += `<div class="note">Seçimler her 5 yılda bir Mart ayında yapılır. Sıradaki: Mart ${ny}.</div>`; }
    h += '<div class="list">' + S.elections.slice().reverse().map(e => `<div class="it" ${S.people[e.w] ? `data-act="profile" data-id="${e.w}"` : ''}><b>${e.y}</b><span class="nm">${esc(e.wn)} <small>${e.note || e.votes.map(v => v[0] + ': ' + v[1]).join(' · ')}</small></span></div>`).join('') + '</div>';
  } else if (tab === 'isletme') {

  } else if (tab === 'aile') {
    const fam = {}; for (const p of all) fam[p.s] = (fam[p.s] || 0) + 1;
    h += '<div class="sec">Sülaleler</div>' + Object.keys(fam).sort((a, b) => fam[b] - fam[a]).map(s => `<span class="chip">${esc(s)}: ${fam[s]}</span>`).join('');
    const ks = Object.keys(S.clan).filter(k => k.split('|').every(s => fam[s])).sort((a, b) => S.clan[a] - S.clan[b]);
    h += '<div class="sec">Husumetler</div>' + (ks.filter(k => S.clan[k] <= -30).map(k => `<span class="chip">⚔️ ${k.replace('|', ' – ')} (${Math.round(S.clan[k])})</span>`).join('') || '<span class="note">Yok</span>');
    h += '<div class="sec">Dost / akraba aileler</div>' + (ks.filter(k => S.clan[k] >= 30).reverse().map(k => `<span class="chip">🤝 ${k.replace('|', ' – ')} (+${Math.round(S.clan[k])})</span>`).join('') || '<span class="note">Yok</span>');
  }
  openSheet('📊 İstatistikler', h, () => openStats(R.statTab));
  if (tab === 'nufus') drawChart();
}
function drawChart() {
  const c = $('chart'); if (!c) return;
  const w = c.clientWidth, hh = c.clientHeight, d = Math.min(2, window.devicePixelRatio || 1);
  c.width = w * d; c.height = hh * d; const g = c.getContext('2d'); g.scale(d, d);
  const data = S.hist; if (data.length < 2) { g.fillStyle = '#8c7a63'; g.font = '13px system-ui'; g.fillText('Veri birikiyor…', 10, 20); return; }
  const pad = {l: 34, r: 40, t: 10, b: 24};
  const m0 = data[0][0], m1 = data[data.length - 1][0];
  const maxP = Math.max(...data.map(x => x[1])) * 1.1, maxM = Math.max(1, ...data.map(x => x[2])) * 1.1;
  const X = m => pad.l + (m - m0) / Math.max(1, m1 - m0) * (w - pad.l - pad.r);
  const Y = (v, mx) => hh - pad.b - v / mx * (hh - pad.t - pad.b);
  g.strokeStyle = '#eadcc4'; g.fillStyle = '#8c7a63'; g.font = '10px system-ui'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const v = maxP * i / 4, y = Y(v, maxP); g.beginPath(); g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke(); g.textAlign = 'right'; g.fillText(Math.round(v), pad.l - 4, y + 3); g.textAlign = 'left'; g.fillText(para(maxM * i / 4).replace(' ₺', ''), w - pad.r + 3, y + 3); }
  g.textAlign = 'center';
  const yrs = Math.max(1, Math.round((m1 - m0) / 12 / 5));
  for (let m = Math.ceil(m0 / 12) * 12; m <= m1; m += 12 * yrs) g.fillText(START_YEAR + m / 12, X(m), hh - 8);
  const line = (idx, mx, col) => { g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); data.forEach((x, i) => { const px = X(x[0]), py = Y(x[idx], mx); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); };
  line(2, maxM, '#4f8a3c'); line(1, maxP, '#e9a23b');
}

    const p = P(S.ctrl);
    choosePerson('🕊️ Kiminle barışmak istiyorsun?', q => q !== p && (p.kus[q.id] || relV(p, q) < -10), q => {
      let pr = .45 + (has(q, 'sakin') ? .2 : 0) + (has(q, 'dindar') ? .15 : 0) - (has(q, 'sinirli') ? .2 : 0) + relV(q, p) / 200;
      if (bayramToday(curDay())) pr += .3;
      if (chance(pr)) { baris(p, q); toast(`${q.n} elini sıktı. Barıştınız!`); } else { changeRel(q, p, -3, false); toast(`${q.n} barışmaya yanaşmadı.`); }
    }, 'Küs olduğun veya arası bozuk olduğun kişiler.');
  },
  a_fight: () => { const p = P(S.ctrl); choosePerson('👊 Kiminle kavga edeceksin?', q => q !== p && age(q) >= 14, q => { ask(`${ye(fn(q))} gerçekten saldıracak mısın? İtibarın düşer, aileler arası husumet çıkabilir.`, [{t: '👊 Evet', r: true, fn: () => { kavga(p, q); toast('Kavga çıktı! Köy bunu konuşacak.'); }}, {t: 'Vazgeç', s: true}]); }); },
  a_gossip: () => { const p = P(S.ctrl); choosePerson('🗣️ Kimin hakkında dedikodu?', q => q !== p && age(q) >= 14, q => { const l = pick(presentList().filter(x => x !== p && x !== q)); dedikodu(p, l, q); toast(`${nin(q.n)} itibarı zedelendi… (${Math.round(q.rep)})`); }); },
  a_cand: () => { const p = P(S.ctrl); toast(addCandidate(p)); },
  a_invest: () => {
    const opts = Object.keys(PROJE).filter(projeUygun);
    const busy = Object.values(S.proj).some(s => s.st === 1);
    let h = `<div class="note">Köy hazinesi: <b>${para(S.treasury)}</b>${busy ? ' · Şu an bir inşaat sürüyor.' : ''}</div><div class="list">`;
    for (const k of opts) h += `<div class="it" ${!busy && S.treasury >= PROJE[k].cost ? `data-act="a_invest2" data-k="${k}"` : 'style="opacity:.45"'}><span>${PROJE[k].ikon}</span><span class="nm">${PROJE[k].ad} <small>${para(PROJE[k].cost)} · ${PROJE[k].ay} ay</small></span></div>`;
    openSheet('🏛️ Köye yatırım', h + (opts.length ? '' : '<div class="note">Şu an yapılabilecek proje yok.</div>') + '</div>', null, true);
  },
  a_invest2: d => { if (startProject(d.k)) { closeSheet(); toast('İnşaat başladı!'); } },
  a_loan: () => { const p = P(S.ctrl); p.money += 20000; p.debt += 20000; actionResult('20.000 ₺ borç aldın (aylık %1,5 faiz).'); },
  a_repay: () => { const p = P(S.ctrl); const x = Math.min(p.debt, Math.max(0, p.money)); p.money -= x; p.debt -= x; actionResult(x > 0 ? `${para(x)} borç ödendi.` : 'Ödeyecek paran yok.'); },
  a_divorce: () => { const p = P(S.ctrl); ask('Gerçekten boşanmak istiyor musun?', [{t: '💔 Boşan', r: true, fn: () => { divorce(p, P(p.sp)); refreshSheet(); }}, {t: 'Vazgeç', s: true}]); },
  // ---- Tanrı modu ----
  g_money: d => { const p = P(+d.id); p.money += +d.v; actionResult(`${p.n}: ${para(p.money)}`); },
  g_heal: d => { const p = P(+d.id); p.hl = 100; actionResult(`${p.n} turp gibi oldu.`); },
  g_happy: d => { const p = P(+d.id); p.hap = 100; p.mood += 30; actionResult(`${p.n} çok mutlu.`); },
  g_rep: d => { const p = P(+d.id); p.rep = clamp(p.rep + +d.v, 0, 100); actionResult(`${nin(p.n)} itibarı: ${Math.round(p.rep)}`); },
  g_wed: d => {
    const p = P(+d.id); const g = p.g === 'E' ? 'K' : 'E';
    if (p.sp != null || courtOf(p.id)) { toast('Bu kişi evli ya da nişanlı.'); return; }
    choosePerson('💒 Kiminle evlensin?', q => q.g === g && q.sp == null && !courtOf(q.id) && age(q) >= 18 && !isKin(p, q), q => {
      const gr = p.g === 'E' ? p : q, br = p.g === 'E' ? q : p;
      S.courts.push({g: gr.id, b: br.id, st: 'nisan'}); S.events.push({k: 'kina', day: curDay() + 1, g: gr.id, b: br.id});
      news('✨', `Kader ağlarını ördü: ${fn(gr)} ile ${fn(br)} evleniyor! Kına gecesi yarın.`); toast('Düğün hazırlıkları başladı!');
    });
  },
  g_fight: d => { const p = P(+d.id); choosePerson('👊 Kiminle kavga etsin?', q => q !== p && age(q) >= 14, q => { kavga(p, q); toast('Kavga çıktı!'); }); },
  g_toggle: () => { S.god = !S.god; $('bGod').classList.toggle('on', S.god); updateModeChip(); openGod(); },
  g_drought: () => { S.harvest = .4; S.harvestSet = null; news('☀️', 'Tanrı modu: Köyü büyük bir kuraklık vurdu! Bu yılın hasadı çok zayıf olacak.'); toast('Kuraklık başladı.'); },
  g_bounty: () => { S.harvest = 1.7; news('🌾', 'Tanrı modu: Bereketli bir yıl! Ekinler hiç olmadığı kadar bol.'); toast('Bereketli yıl!'); },
  g_treasury: () => { S.treasury += 100000; toast('Hazineye 100 bin ₺ eklendi.'); refreshSheet(); },
  g_rwed: () => {
    const men = shuffle(presentList().filter(p => marriageable(p, 'E')));
    for (const m of men) { const w = presentList().find(q => suitable(m, q)); if (w) { S.courts.push({g: m.id, b: w.id, st: 'nisan'}); S.events.push({k: 'kina', day: curDay() + 1, g: m.id, b: w.id}); news('✨', `Kader: ${fn(m)} ile ${fn(w)} evleniyor!`); toast('Düğün yarın sonra!'); return; } }
    toast('Uygun çift bulunamadı.');
  },
  g_rfight: () => { const ad = presentList().filter(p => age(p) >= 16); const a = pick(ad), b = pick(ad); if (a && b && a !== b) { kavga(a, b); toast('Kavga çıktı!'); } },
  g_elect: () => { if (S.secim) { toast('Zaten seçim takviminde.'); return; } secimBaslat(20); toast('Erken seçim kararı alındı!'); },
  g_plague: () => { for (const p of alive()) p.hl -= rnd(5, 30); news('🦠', 'Tanrı modu: Köyde salgın hastalık baş gösterdi!'); toast('Salgın başladı.'); },
  g_baby: () => { let n = 0; for (const p of presentList()) if (p.g === 'K' && p.sp != null && age(p) < 42 && present(P(p.sp)) && chance(.35) && alive().length < MAX_POP) { birth(p); n++; } toast(`${n} bebek dünyaya geldi!`); },
  g_bayram: () => { const b = bayramToday(curDay()); bayramStart(b ? b.k : 'ram'); toast('Bayram havası!'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset);
});

function openGod() {
  const h = `<div class="note">Tanrı modunda köye istediğin gibi müdahale edebilirsin. Bir köylüye dokununca profilinde ek düğmeler çıkar.</div>
  <div class="btns"><button class="btn ${S.god ? 'r' : 'v'}" data-act="g_toggle">${S.god ? 'Tanrı modunu kapat' : '⚡ Tanrı modunu aç'}</button></div>
  ${S.god ? `<div class="sec">Köy olayları</div><div class="grid2">
    <button class="btn" data-act="g_drought">☀️ Kuraklık</button><button class="btn" data-act="g_bounty">🌾 Bereketli yıl</button>
    <button class="btn" data-act="g_treasury">💰 Hazineye +100 bin</button><button class="btn" data-act="g_elect">🗳️ Erken seçim</button>
    <button class="btn" data-act="g_rwed">💒 Rastgele düğün</button><button class="btn r" data-act="g_rfight">👊 Rastgele kavga</button>
    <button class="btn" data-act="g_baby">👶 Bebek patlaması</button><button class="btn" data-act="g_bayram">🍬 Bayram havası</button>
    <button class="btn r" data-act="g_plague">🦠 Salgın</button></div>` : ''}`;
  openSheet('⚡ Tanrı Modu', h, openGod);
}
function openMenu() {
  const h = `<div class="btns" style="flex-direction:column">
    <button class="btn" id="mSave">💾 Şimdi kaydet</button>
    <button class="btn s" id="mHelp">❓ Nasıl oynanır?</button>
    <button class="btn r" id="mNew">🔄 Yeni oyun başlat</button></div>
    <div class="note">Oyun her oyun ayında otomatik kaydedilir (5 gerçek dakika, 1x hızda).</div>`;
  openSheet('☰ Menü', h, openMenu);
  $('mSave').onclick = () => { save(); toast('Kaydedildi.'); };
  $('mHelp').onclick = showHelp;
  $('mNew').onclick = () => ask('Mevcut köy silinip yeni bir köy kurulacak. Emin misin?', [{t: 'Evet, yeni köy', r: true, fn: () => { localStorage.removeItem(SAVE_KEY); startNew(); closeSheet(); }}, {t: 'Vazgeç', s: true}]);
}
function showHelp() {
  ask(`<b>🏡 Türk Köyü'ne hoş geldin!</b><br><br>
  • Haritayı parmağınla kaydır, iki parmakla yakınlaştır.<br>
  • Bir köylüye ya da binaya dokun: profil/bilgi açılır.<br>
  • <b>🎮 Bu karakteri yönet</b> dersen onun kararlarını sen verirsin (iş kur, kız iste, kavga, barış, aday ol…).<br>
  • <b>⚡ Tanrı modu</b> ile kuraklık, düğün, kavga gibi olayları tetikle.<br>
  • 📊 İstatistikler: en zenginler, en saygınlar, nüfus grafiği, muhtarlık geçmişi.<br>
  • 1x hızda 5 dakika = 1 oyun ayı. Oyun her ay kendini kaydeder.`, [{t: 'Başlayalım!'}]);
}

/* Üst çubuk ve mod etiketi */
function updateModeChip() {
  const el = $('modeChip'), p = P(S.ctrl);
  if (p) { el.classList.remove('hidden'); el.innerHTML = `🎮 <b>${esc(fn(p))}</b> yönetiliyor <span class="sp" style="flex:1"></span><button data-act="actions">Eylemler</button><button data-act="release">Bırak</button>`; }
  else el.classList.add('hidden');
  $('fab').classList.toggle('hidden', !p);
  $('bGod').classList.toggle('on', !!S.god);
}
let lastTop = '';
function updateTop() {
  const hr = hourNow(), h = Math.floor(hr), m = Math.floor((hr - h) * 60 / 10) * 10;
  const bay = bayramToday(curDay());
  const s = [tarihStr(), MEVSIM_IKON[MEVSIM(moy())] + ' ' + (bay ? '🎉 Bayram' : MEVSIM_AD[MEVSIM(moy())]), (hr >= 6 && hr < 19 ? '☀️' : '🌙') + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'), '👥' + alive().length, '🏦' + para(S.treasury).replace(' ₺', '')].join('|');
  if (s === lastTop) return; lastTop = s;
  const [a, b, c, d, e] = s.split('|');
  $('tDate').textContent = a; $('tSeason').textContent = b; $('tTime').textContent = c; $('tPop').textContent = d; $('tTre').textContent = e;
}
function updateSpeeds() { for (const b of document.querySelectorAll('#speeds button')) b.classList.toggle('on', +b.dataset.s === S.speed); }
for (const b of document.querySelectorAll('#speeds button')) b.onclick = () => { S.speed = +b.dataset.s; updateSpeeds(); };
$('bStats').onclick = () => openStats();
$('bNews').onclick = openNews;
$('bGod').onclick = openGod;
$('bMenu').onclick = openMenu;
$('fab').onclick = openActions;
$('ticker').onclick = openNews;

/* Kayan haber şeridi */
function updateTicker(dt) {
  const el = $('tkText'), box = el.parentElement;
  R.tk.x -= dt * 55;
  if (R.tk.x < -R.tk.w || !R.tk.w) {
    const items = S.news.slice(-6).reverse().map(n => `${n.i} ${n.s}`);
    el.textContent = items.join('     •     ') || 'Köyde hayat sakin akıyor…';
    R.tk.w = el.scrollWidth; R.tk.x = box.clientWidth;
  }
  el.style.transform = `translate(${R.tk.x}px,-50%)`;
}

/* ======================= 15) KAYIT / YÜKLEME ======================= */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch (e) { prunePeople(); S.news = S.news.slice(-80); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e2) { console.warn('Kayıt başarısız', e2); } }
}
function load() {
  try { const t = localStorage.getItem(SAVE_KEY); if (!t) return false; const d = JSON.parse(t); if (!d || d.v !== 1) return false; S = d; return true; }
  catch (e) { console.warn('Kayıt okunamadı', e); return false; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
window.addEventListener('pagehide', () => { if (S) save(); });

/* ======================= 16) ANA DÖNGÜ ======================= */
/* Zamanı ilerlet; gün ve ay sınırlarında tik fonksiyonlarını çalıştır */
function advance(gm) {
  const target = S.min + gm;
  while (true) {
    const next = (Math.floor(S.min / DAY_MIN) + 1) * DAY_MIN;
    if (target >= next) {
      S.min = next;
      if (curDay() % MONTH_DAYS === 0) monthlyTick();
      dailyTick();
    } else { S.min = target; break; }
  }
}
function centerOn(x, y) { R.cam.x = x - VW / 2 / R.cam.z; R.cam.y = y - VH / 2 / R.cam.z; clampCam(); }

function startNew() {
  R.ag = {}; R.sel = null; R.follow = null; R.gather = []; R.gatherBy = new Map();
  newGame(); afterLoad();
  setTimeout(showHelp, 400);
}
function afterLoad() {
  dirty(); R.ag = {}; R.mapDirty = true;
  // Yarım kalan günün programını yeniden kur
  buildSchedules(bayramToday(curDay()));
  updateAgents(0);
  for (const id in R.ag) { const ag = R.ag[id]; if (ag.pi < ag.path.length) { const last = ag.path[ag.path.length - 1]; ag.x = last.x; ag.y = last.y; ag.pi = ag.path.length; if (ag.dest && !ag.dest.out) ag.inside = true; } }
  updateModeChip(); updateSpeeds(); R.tk.w = 0;
  R.cam.z = clamp(VW / 520, minZoom(), 4); centerOn(M.meydan.cx, M.meydan.cy + 60);
}

let lastT = performance.now(), topT = 0, sheetT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  const sp = R.modal ? 0 : S.speed;
  const gm = dt * GAME_MIN_PER_SEC * sp;
  try {
    if (gm > 0) advance(gm);
    updateAgents(gm); updateAnimals(gm);
    if (R.follow != null) { const ag = R.ag[R.follow]; if (ag) { const tx = ag.x - VW / 2 / R.cam.z, ty = ag.y - VH / 2 / R.cam.z; R.cam.x += (tx - R.cam.x) * .12; R.cam.y += (ty - R.cam.y) * .12; clampCam(); } }
    render(dt);
    topT -= dt; if (topT <= 0) { topT = .25; updateTop(); }
    sheetT -= dt; if (sheetT <= 0) { sheetT = 2; if (R.curView && R.autoRefresh !== false && !document.activeElement.matches('input')) refreshSheetLight(); }
    updateTicker(dt);
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
/* Açık profil paneli zaman geçtikçe güncellensin (sadece profil ve istatistik genel) */
function refreshSheetLight() { if (R.curView && R.curView.light) refreshSheet(); }

/* Başlat */
buildMap(); initAnimals(); resize();
window.addEventListener('resize', resize);
if (load()) { afterLoad(); toast('Kaldığın yerden devam ediliyor: ' + tarihStr()); }
else startNew();
requestAnimationFrame(frame);

/* Hata ayıklama / test için */
window.KOY = {get S() { return S; }, R, advance, ff: days => { for (let i = 0; i < days; i++) advance(DAY_MIN); }, alive};
</script>
