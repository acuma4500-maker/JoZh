<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#4a2814"/>
      <stop offset="0.55" stop-color="#2a150a"/>
      <stop offset="1" stop-color="#120804"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3c66b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3c66b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5530"/>
      <stop offset="0.5" stop-color="#6b3d1f"/>
      <stop offset="1" stop-color="#46240f"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e1608"/>
      <stop offset="1" stop-color="#5a3118"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3a0"/>
      <stop offset="0.45" stop-color="#d9a945"/>
      <stop offset="1" stop-color="#8f6420"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a33"/>
      <stop offset="1" stop-color="#6e4a14"/>
    </linearGradient>
    <radialGradient id="face" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#3b2312"/>
      <stop offset="1" stop-color="#1d0f06"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="540" r="470" fill="url(#glow)"/>

  <g transform="rotate(-7 540 545)" filter="url(#shadow)">
    <!-- page edges -->
    <rect x="300" y="238" width="492" height="624" rx="18" fill="#e9d9b4"/>
    <g stroke="#c8b183" stroke-width="3">
      <line x1="772" y1="256" x2="772" y2="846"/>
      <line x1="782" y1="256" x2="782" y2="846"/>
    </g>
    <!-- cover -->
    <rect x="282" y="226" width="492" height="628" rx="22" fill="url(#leather)"/>
    <rect x="282" y="226" width="64" height="628" rx="22" fill="url(#spine)"/>
    <line x1="346" y1="240" x2="346" y2="840" stroke="#2a1306" stroke-width="4" opacity="0.6"/>
    <!-- stitching -->
    <rect x="368" y="252" width="380" height="576" rx="14" fill="none" stroke="#d9b465" stroke-width="4" stroke-dasharray="14 10" opacity="0.75"/>
    <!-- corner caps -->
    <path d="M714 226 h38 a22 22 0 0 1 22 22 v38 z" fill="url(#gold)"/>
    <path d="M774 816 v16 a22 22 0 0 1 -22 22 h-38 z" fill="url(#gold)"/>
    <!-- strap -->
    <rect x="700" y="500" width="110" height="78" rx="10" fill="#3f1f0c"/>
    <rect x="770" y="510" width="34" height="58" rx="8" fill="none" stroke="url(#gold)" stroke-width="7"/>

    <!-- compass -->
    <g transform="translate(558 540)">
      <circle r="168" fill="url(#gold)"/>
      <circle r="150" fill="url(#face)"/>
      <circle r="132" fill="none" stroke="#d9a945" stroke-width="3" opacity="0.8"/>
      <g stroke="#d9a945" stroke-width="4" opacity="0.9">
        <line x1="0" y1="-150" x2="0" y2="-136"/><line x1="0" y1="150" x2="0" y2="136"/>
        <line x1="-150" y1="0" x2="-136" y2="0"/><line x1="150" y1="0" x2="136" y2="0"/>
      </g>
      <!-- diagonal points -->
      <g transform="rotate(45)">
        <path d="M0 -92 L16 0 L0 92 L-16 0 Z" fill="url(#goldDark)"/>
        <path d="M-92 0 L0 16 L92 0 L0 -16 Z" fill="url(#goldDark)"/>
      </g>
      <!-- main points -->
      <path d="M0 -128 L24 0 L0 0 Z" fill="#fbe3a0"/>
      <path d="M0 -128 L-24 0 L0 0 Z" fill="#c8932f"/>
      <path d="M0 128 L-24 0 L0 0 Z" fill="#fbe3a0"/>
      <path d="M0 128 L24 0 L0 0 Z" fill="#c8932f"/>
      <path d="M128 0 L0 24 L0 0 Z" fill="#c8932f"/>
      <path d="M128 0 L0 -24 L0 0 Z" fill="#fbe3a0"/>
      <path d="M-128 0 L0 -24 L0 0 Z" fill="#c8932f"/>
      <path d="M-128 0 L0 24 L0 0 Z" fill="#fbe3a0"/>
      <circle r="14" fill="url(#gold)" stroke="#5a3a10" stroke-width="3"/>
    </g>
  </g>
</svg>
