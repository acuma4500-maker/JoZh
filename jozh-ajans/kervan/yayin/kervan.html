:root{

}
@media (prefers-color-scheme: dark){

}

}
*{box-sizing:border-box}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

main.wrap{padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}

p{margin:0}
.muted{color:var(--soft);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}

.scene .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-weight:600;font-size:14px}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--soft)}

.say{border-left:3px solid var(--gold);padding-left:10px;font-size:15px}

.kasa{border:1px dashed var(--rule);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.kasa .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.opts{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px}

.pager{display:flex;justify-content:space-between;gap:8px}
.pager a{color:var(--gold);font-weight:700;text-decoration:none}
.fallback{width:100%;min-height:8em;font-family:var(--f-mono);font-size:12px;background:var(--code);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px}

/* Rota, karakterler, profil, kasa aracı */
.rt summary{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;color:var(--ink);font-size:15px}
.rt summary::before{content:none}
.rt summary .n{font-family:var(--f-mono);font-size:12px;color:var(--soft)}
.rt{border-bottom:1px solid var(--rule)}
.rt dl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:4px 12px;margin:0 0 10px 44px;font-size:14px}
.rt dt{color:var(--soft)} .rt dd{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field .v{background:var(--code);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:15px;word-break:break-word}
.amblem{width:120px;height:120px;border-radius:50%;overflow:hidden;border:1px solid var(--rule)}
textarea#ka-metin{width:100%;min-height:7em;font-family:var(--f-mono);font-size:14px;background:var(--code);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px}
.err{color:var(--down);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* Kasa promptu motoru. Tek kaynak: "Dedemin Defteri" sayfası ve "Kasa Prompt Aracı" bu dosyayı build sırasında aynen içine alır.
   parseLine(satır) -> {ok:true, sabit, old, neu, delta, abs, up} ya da {ok:false, msg, fixes?}
   buildPrompt(o, cfg) -> Flow'a yapıştırılacak sabit İngilizce prompt.
   cfg = {birim:"₺"|"TL", gecis:"akici"|"anlik", etiket:"var"|"yok"} */
const KasaMotor = (function(){
"use strict";
const MAX = 999999999;
const fmt = n => String(Math.abs(Math.trunc(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const sg = n => (n < 0 ? "−" : "+") + fmt(n);
const bad = (msg, extra) => Object.assign({ ok: false, msg: msg }, extra || {});
const canon = (a, b) => fmt(a) + " ₺ → " + fmt(b) + " ₺ (" + sg(b - a) + " ₺)";

/* ---------- satırı oku ---------- */
function norm(raw){
  return raw
    .replace(/[-−–—‒]{1,2}>|=+>|[→➜➝➔⇒>]/g, " → ")
    .replace(/[−–—‒]/g, "-")
    .replace(/₺|\bTRY\b|\bTL\b|\blira\b/gi, " ")
    .replace(/\b(?:s[aA]b[iİıI]t|k[aA]s[aA])\b:?/gi, " ")
    .replace(/[()\[\]{}]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function parseLine(raw){
  const s = norm(raw);
  if (!s) return null;
  const arrows = (s.match(/→/g) || []).length;
  if (arrows > 1) return bad("Satırda tek bir ok olmalı: eski → yeni.");
  const arrowAt = s.indexOf("→");
  const re = /([+-])?(\d{1,3}(?:[.,]\d{3})+|\d+)(?:([.,])(\d+))?/g;
  const toks = [];
  let m;
  while ((m = re.exec(s))) {
    if (m[3]) return bad("Kuruş desteklenmiyor. Tam lira yaz, örnek: 7.000");
    if (m[1] && m.index > 0 && /\d/.test(s[m.index - 1])) {
      return bad("Sayıların arasında eksi işareti var ve ok yok. Eski ve yeni bakiyenin arasına → koy: 7.000 ₺ → 6.700 ₺");
    }
    toks.push({ sign: m[1] || "", val: parseInt(m[2].replace(/[.,]/g, ""), 10), side: arrows && m.index > arrowAt ? 1 : 0 });
  }
  const rest = s.replace(new RegExp(re.source, "g"), " ").replace(/→/g, " ").replace(/\s+/g, " ").trim();
  if (rest) return bad("\"" + rest + "\" kısmını anlayamadım. Satırda yalnızca sayı, ₺ ve → kullan.");
  if (!toks.length) return bad("Bu satırda bakiye göremedim. Şöyle yaz: 7.000 ₺ → 6.700 ₺ (−300 ₺)");

  let old, neu, typed = null;
  if (arrows === 1) {
    const L = toks.filter(t => t.side === 0), R = toks.filter(t => t.side === 1);
    if (L.length !== 1 || L[0].sign) return bad("Okun soluna yalnızca eski bakiyeyi yaz: 7.000 ₺ → 6.700 ₺");
    if (R.length < 1 || R.length > 2 || R[0].sign) return bad("Okun sağına yeni bakiyeyi, istersen parantez içinde farkı yaz: 7.000 ₺ → 6.700 ₺ (−300 ₺)");
    old = L[0].val; neu = R[0].val;
    if (R[1]) typed = { sign: R[1].sign === "-" ? -1 : R[1].sign === "+" ? 1 : 0, val: R[1].val };
  } else if (toks.length === 1 && !toks[0].sign) {
    old = neu = toks[0].val;
  } else if (toks.length === 2 && !toks[0].sign && toks[1].sign) {
    old = toks[0].val;
    typed = { sign: toks[1].sign === "-" ? -1 : 1, val: toks[1].val };
    neu = old + typed.sign * typed.val;
  } else {
    return bad("Eski ve yeni bakiyenin arasına → koy. Örnek: 7.000 ₺ → 6.700 ₺ (−300 ₺). Kasa değişmiyorsa tek sayı yaz: 7.000 ₺");
  }

  if (old > MAX || neu > MAX || (typed && typed.val > MAX)) return bad("Sayı çok büyük. En fazla " + fmt(MAX) + " ₺ yazabilirsin.");
  if (neu < 0) return bad("Yeni bakiye eksiye düşüyor (" + sg(neu) + " ₺). Kasa eksiye inmez, sayıları kontrol et.");
  const calc = neu - old;
  const t = !typed ? calc : typed.sign !== 0 ? typed.sign * typed.val : (calc === 0 ? typed.val : Math.sign(calc) * typed.val);
  if (t !== calc) {
    const fixes = [{
      label: calc === 0 ? "Bakiyeleri kullan (sabit kasa)" : "Bakiyeleri kullan (" + sg(calc) + " ₺)",
      text: calc === 0 ? fmt(old) + " ₺" : canon(old, neu)
    }];
    if (t !== 0 && old + t >= 0 && old + t <= MAX) fixes.push({ label: "Farkı kullan (yeni bakiye " + fmt(old + t) + " ₺)", text: canon(old, old + t) });
    return bad("Fark tutmuyor: " + fmt(old) + " ₺ ile " + fmt(neu) + " ₺ arası " + (calc === 0 ? "fark yok" : sg(calc) + " ₺") + ", ama sen " + sg(t) + " ₺ yazmışsın.", { fixes: fixes });
  }

  return { ok: true, sabit: false, old: old, neu: neu, delta: calc, abs: Math.abs(calc), up: calc > 0 };
}

/* ---------- sabit prompt ---------- */
function buildPrompt(o, cfg){
  const U = cfg && cfg.birim === "TL" ? "TL" : "₺";
  const lab = !(cfg && cfg.etiket === "yok");
  const anlik = !!(cfg && cfg.gecis === "anlik");

  const sabit = !!o.sabit;
  const chg = (o.up ? "+" : "-") + money(o.abs);

  const colorWord = o.up ? "green" : "red";
  const dir = o.up ? "UP" : "DOWN";
  const balSize = "Its digits are about 3.2% of the frame height tall and it is the largest element";

  const stack = [];

    stack.push("the BALANCE in bold white (#FFFFFF) monospaced cash-register digits followed by the currency sign, written exactly \"" + b0 + "\". " + balSize);
  } else {
    stack.push("the BALANCE in bold white (#FFFFFF) monospaced cash-register digits followed by the currency sign, written exactly \"" + b0 + "\" at the start. " + balSize);
    stack.push("directly under the balance, with a small gap, the CHANGE line in " + colorTxt + ": \"" + chg + "\". Bold, same monospaced font, about 65% of the balance size");
  }
  const layout = stack.map((t, i) => (i + 1) + ") " + t + (i < stack.length - 1 ? ";" : ".")).join("\n")
    + (sabit ? "\nThere is no change line: nothing appears under the balance." : "");

  let tl;
  if (sabit) {
    tl = ["0.0-8.0 s: " + (lab ? "\"KASA\" and the balance \"" + b0 + "\" are" : "the balance \"" + b0 + "\" is") + " visible and perfectly still for the entire video. Nothing changes, nothing moves and nothing else appears."];
  } else {
    const first = lab ? "only \"KASA\" and the balance \"" + b0 + "\" are visible" : "only the balance \"" + b0 + "\" is visible";
    tl = [
      "0.0-1.0 s: " + first + ", perfectly still. The change line is not visible yet.",
      "1.0-1.4 s: the change line \"" + chg + "\" fades in directly under the balance. Nothing else moves."
    ];
    if (anlik) {
      tl.push("1.4 s: the balance changes instantly, in a single frame, from \"" + b0 + "\" to \"" + b1 + "\". No counting, no rolling, no fade, no animation.");
      tl.push("1.4-8.0 s: everything stays frozen. The final frame shows exactly \"" + b1 + "\" in white and \"" + chg + "\" in " + colorWord + ", unchanged until the end.");
    } else {
      tl.push("1.4-3.4 s: the balance counts smoothly " + dir + " from \"" + b0 + "\" to \"" + b1 + "\": the digits roll in place like a simple counter, in one direction only, without flicker and without overshooting.");
      tl.push("3.4-8.0 s: everything freezes. The final frame shows exactly \"" + b1 + "\" in white and \"" + chg + "\" in " + colorWord + ", unchanged until the end.");
    }
  }
  const texts = sabit
    ? (lab ? "\"KASA\" and \"" + b0 + "\"" : "\"" + b0 + "\"")
    : (lab ? "\"KASA\", " : "") + "\"" + b0 + "\", \"" + b1 + "\" and \"" + chg + "\"";

  return [
    "Vertical 9:16 video, 8 seconds. Flat 2D motion-graphics overlay, not a cinematic scene. PURE SOLID BLACK background (#000000) filling the entire frame, made to be layered over another video with a Screen / Lighten blend mode. Locked static camera: no movement, no zoom, no cuts, no transitions. Silent: no sound, no music.",
    "LAYOUT: one small cash counter in the TOP-RIGHT corner and nothing else. Its right edge is 5% from the right edge of the frame and its top edge is 6% from the top edge. All lines are right-aligned to the same right edge and stacked from top to bottom:\n" + layout + "\nThe counter stays within 45% of the frame width and 12% of the frame height. The rest of the frame stays pure black. Position, size and colors never change during the video.",
    "TIMELINE (exact):\n" + tl.join("\n"),
    "TEXT: the only text in the whole video is " + texts + ", written exactly like this. Digits are crisp, sharp and fully legible at all times.",
    "AVOID: money effects, banknotes, coins, particles, sparkles, glow, light rays, shine, bloom, confetti, arrows, icons, boxes, borders, shadows, gradients, vignette, film grain, textures, characters, hands, objects, scenery, extra text, subtitles, logos, watermarks."
  ].join("\n\n");
}

return { MAX: MAX, fmt: fmt, sg: sg, canon: canon, parseLine: parseLine, buildPrompt: buildPrompt };
})();

const durum = oku("kervan-durum", {});
const uretildi = new Set(oku("kervan-uretildi", []));
const KC = Object.assign({ birim: "₺", gecis: "akici", etiket: "var" }, oku("kervan-kasa-ayar", {}));

/* ── Kopyala ── */
const METIN = new Map();
let sayac = 0;
function kopyaBtn(metin, etiket, sinif){
  const id = "k" + (++sayac);
  METIN.set(id, metin);
  return `<button type="button" class="btn ${sinif || ""}" data-kopya="${id}">${esc(etiket || "Kopyala")}</button>`;
}
function kopyalandi(btn){
  const eski = btn.textContent;
  btn.classList.add("done"); btn.textContent = "Kopyalandı ✓";
  setTimeout(() => { btn.classList.remove("done"); btn.textContent = eski; }, 1600);
}
function yedekKopya(metin, btn){
  const ta = document.createElement("textarea");
  ta.value = metin; ta.setAttribute("readonly", ""); ta.className = "fallback";
  btn.closest(".btns, section, .field, .kasa").appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  if (ok) { ta.remove(); kopyalandi(btn); }
  else { btn.textContent = "Metni seçtim, uzun basıp kopyala"; }
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-kopya]");
  if (b) {
    const metin = METIN.get(b.dataset.kopya) || "";
    try { navigator.clipboard.writeText(metin).then(() => kopyalandi(b), () => yedekKopya(metin, b)); }
    catch (e) { yedekKopya(metin, b); }
    return;
  }
  const m = ev.target.closest("[data-made]");
  if (m) {
    const k = m.dataset.made;
    if (uretildi.has(k)) uretildi.delete(k); else uretildi.add(k);
    yaz("kervan-uretildi", [...uretildi]);
    m.setAttribute("aria-pressed", uretildi.has(k)); m.textContent = uretildi.has(k) ? "✓ Ürettim" : "Ürettim";
    return;
  }
  const d = ev.target.closest("[data-durum]");
  if (d) {
    const no = d.dataset.durum;
    durum[no] = ((durum[no] || 0) + 1) % 3;
    yaz("kervan-durum", durum);
    d.dataset.d = durum[no]; d.textContent = DURUM[durum[no]];
    ust();
  }
});
const madeBtn = k => `<button type="button" class="made" data-made="${k}" aria-pressed="${uretildi.has(k)}">${uretildi.has(k) ? "✓ Ürettim" : "Ürettim"}</button>`;

/* ── Üst özet ── */
function ust(){
  const yayin = V.rota.filter(r => durum[r.no] === 2);
  const kasa = yayin.length ? Math.max(...yayin.map(r => r.no)) : 0;
  const deger = kasa ? V.rota[kasa - 1].kasa_son : V.rota[0].kasa_bas;
  const hazir = V.rota.filter(r => r.hazir).length;
  $("#ozet").innerHTML = `<b>${yayin.length}</b> / 50 yayınlandı · ${hazir} bölüm hazır · Kasa <b>${para(deger)}</b>`;
  $("#ilerleme").style.width = (yayin.length / 50 * 100) + "%";
}

/* ── Kasa promptu ── */
function kasaPrompt(eski, yeni){
  const o = eski === yeni ? { sabit: true, old: eski, neu: eski }
    : { sabit: false, old: eski, neu: yeni, abs: Math.abs(yeni - eski), up: yeni > eski };
  return KasaMotor.buildPrompt(o, KC);
}
function kasaAyarlari(){
  const r = (ad, deger, metin) => `<label><input type="radio" name="${ad}" id="${ad}-${deger}" value="${deger}" ${KC[ad] === deger ? "checked" : ""}> ${metin}</label>`;
  return `<div class="opts" id="kasa-ayar">
    <span>${r("birim", "₺", "₺")} ${r("birim", "TL", "TL")}</span>
    <span>${r("gecis", "akici", "Rakam sayarak değişir")} ${r("gecis", "anlik", "Anında değişir")}</span>
    <span>${r("etiket", "var", "KASA yazısı var")} ${r("etiket", "yok", "Yazı yok")}</span></div>`;
}
document.addEventListener("change", ev => {
  if (ev.target.closest("#kasa-ayar")) {
    KC[ev.target.name] = ev.target.value; yaz("kervan-kasa-ayar", KC); goster();
  }
});

/* ── Görünümler ── */
function bolumListesi(){
  let h = `<div class="ephead"><h2>Sezon 1 · 50 bölüm</h2><p class="muted">Durum düğmesine dokundukça Yapılmadı → Üretiliyor → Yayınlandı olarak değişir. Telefonun hatırlar.</p></div>`;
  for (const bolge of BOLGELER) {
    h += `<div class="region"><h3>${esc(bolge)}</h3>`;
    for (const r of V.rota.filter(x => x.bolge === bolge)) {
      const d = durum[r.no] || 0, up = r.kasa_son >= r.kasa_bas;
      const t = `<b>${esc(r.baslik)}</b><span>${esc(r.sehir)}${r.hazir ? "" : " · hazırlanıyor"}</span>`;
      h += `<div class="row ${r.hazir ? "" : "off"}"><span class="no">B${pad(r.no)}</span>
        ${r.hazir ? `<a class="t" href="#b${pad(r.no)}">${t}</a>` : `<div class="t">${t}</div>`}
        <div class="side"><span class="delta ${up ? "up" : "down"}">${fark(r.kasa_bas, r.kasa_son)}</span>
        <button type="button" class="durum" data-durum="${r.no}" data-d="${d}">${DURUM[d]}</button></div></div>`;
    }
    h += `</div>`;
  }
  return h;
}

function promptBlok(baslik, metin, kod, aciklama){
  return `<section class="blk"><div class="blkhead"><h3>${esc(baslik)}</h3>${kod ? madeBtn(kod) : ""}</div>
    ${aciklama ? `<p class="muted">${aciklama}</p>` : ""}
    <details><summary>Promptu göster</summary><pre class="prompt">${esc(metin)}</pre></details>
    <div class="btns">${kopyaBtn(metin)}</div></section>`;
}

function bolum(no){
  const b = V.bolumler[no];
  if (!b) return `<p>Bu bölüm henüz hazırlanıyor.</p><p><a href="#bolumler">Bölümlere dön</a></p>`;
  const K = "B" + pad(b.no);
  let h = `<div class="ephead"><span class="eyebrow">Bölüm ${b.no} · ${esc(b.sehir)} · ${esc(b.bolge)}</span>
    <h2>${esc(b.baslik)}</h2>
    <span class="kasaline">Kasa ${para(b.kasa_bas)} → ${para(b.kasa_son)} <span class="delta ${b.kasa_son >= b.kasa_bas ? "up" : "down"}">(${fark(b.kasa_bas, b.kasa_son)})</span></span></div>`;
  h += promptBlok("Kapak 1 · Ana kapak", b.kapak1, K + "-K1");
  h += promptBlok("Kapak 2 · Pek yakında", b.kapak2, K + "-K2");
  h += `<section class="blk"><div class="blkhead"><h3>Video açıklaması</h3></div>
    <div class="field"><div class="v">${esc(b.aciklama)}</div></div><div class="btns">${kopyaBtn(b.aciklama)}</div></section>`;
  h += `<section class="blk"><div class="blkhead"><h3>Sabit kasa</h3></div>
    <p class="muted">Para değişmeyen senaryolar için. Aynı rakamı taşıyan senaryolar tek klibi paylaşır. Klibi senaryonun üstüne koy, karıştırma modunu Ekran (Screen) yap.</p>
    ${kasaAyarlari()}`;
  for (const s of b.sabit) {
    h += `<div class="kasa"><span class="val">${para(s.deger)} · Senaryo ${s.sahneler.join(", ")}</span>
      <div class="btns">${kopyaBtn(kasaPrompt(s.deger, s.deger), "Sabit kasa promptunu kopyala", "ghost")}${madeBtn(K + "-SK" + s.deger)}</div></div>`;
  }
  h += `</section>`;
  for (const s of b.senaryolar) {
    h += `<section class="blk scene" id="${s.kod}"><div class="blkhead"><div class="meta"><span class="code">${s.kod}</span>
      <span class="tag">${esc(s.rol)}</span><span class="tag">${s.sure}</span>${s.kasa ? `<span class="tag k">Kasa değişiyor</span>` : ""}</div>${madeBtn(s.kod)}</div>`;
    if (s.altyazi) h += `<p class="say">Altyazı: <b>${esc(s.altyazi)}</b></p>`;
    h += s.replik ? `<p class="say"><b>${esc(s.replik[0])}:</b> “${esc(s.replik[1])}”</p>` : `<p class="muted">Replik yok.</p>`;
    h += `<details><summary>Promptu göster</summary><pre class="prompt">${esc(s.prompt)}</pre></details><div class="btns">${kopyaBtn(s.prompt)}</div>`;
    if (s.kasa) {
      h += `<div class="kasa"><span class="val">Kasa ${para(s.kasa[0])} → ${para(s.kasa[1])} <span class="delta ${s.kasa[1] > s.kasa[0] ? "up" : "down"}">(${fark(s.kasa[0], s.kasa[1])})</span></span>
        <div class="btns">${kopyaBtn(kasaPrompt(s.kasa[0], s.kasa[1]), "Kasa promptunu kopyala", "ghost")}${madeBtn(s.kod + "-KASA")}</div></div>`;
    } else if (s.gizli) {
      h += `<p class="muted">Bu senaryoda kasa göstergesi yok.</p>`;
    }
    h += `</section>`;
  }
  const hazir = V.rota.filter(r => r.hazir).map(r => r.no);
  const i = hazir.indexOf(b.no), once = hazir[i - 1], sonra = hazir[i + 1];
  h += `<div class="pager"><span>${once ? `<a href="#b${pad(once)}">◀ Bölüm ${once}</a>` : ""}</span><span>${sonra ? `<a href="#b${pad(sonra)}">Bölüm ${sonra} ▶</a>` : ""}</span></div>`;
  return h;
}

function rota(){
  let h = `<div class="ephead"><h2>Rota</h2><p class="muted">İstanbul'dan Kapadokya'ya, defterin izinde 50 durak. Satıra dokununca ayrıntılar açılır.</p></div>`;
  for (const bolge of BOLGELER) {
    h += `<div class="region"><h3>${esc(bolge)}</h3>`;
    for (const r of V.rota.filter(x => x.bolge === bolge)) {
      h += `<details class="rt"><summary><span class="n">B${pad(r.no)}</span><span>${esc(r.sehir)} · ${esc(r.baslik)}</span>
        <span class="delta ${r.kasa_son >= r.kasa_bas ? "up" : "down"}">${para(r.kasa_son)}</span></summary>
        <dl><dt>Alınan</dt><dd>${esc(r.alinan)}</dd><dt>Satılan</dt><dd>${esc(r.satilan)}</dd>
        <dt>Kasa</dt><dd>${para(r.kasa_bas)} → ${para(r.kasa_son)} (${fark(r.kasa_bas, r.kasa_son)})</dd>
        <dt>Aksilik</dt><dd>${esc(r.aksilik)}</dd><dt>Defter</dt><dd>${esc(r.ipucu)}</dd><dt>Son</dt><dd>${esc(r.son)}</dd></dl></details>`;
    }
    h += `</div>`;
  }
  return h;
}

function karakterler(){
  let h = `<div class="ephead"><h2>Karakterler</h2><p class="muted">Önce her karakterin referans görselini Flow'da üret. Tarifler bütün promptlara harfi harfine aynı girer.</p></div>`;
  for (const k of V.karakterler) {
    h += `<section class="blk"><div class="blkhead"><h3>${esc(k.isim)} · ${esc(k.alt)}</h3></div><p>${esc(k.ozet)}</p>
      <details><summary>İngilizce tarif</summary><pre class="prompt">${esc(k.tarif)}</pre></details>
      <div class="btns">${k.referans ? kopyaBtn(k.referans, "Referans görsel promptunu kopyala") : ""}${kopyaBtn(k.tarif, "Tarifi kopyala", "ghost")}</div></section>`;
  }
  return h;
}

function profil(){
  const p = V.profil;
  const alan = (b, v, not) => `<div class="field"><h3>${esc(b)}</h3><div class="v">${esc(v)}</div>${not ? `<p class="muted">${not}</p>` : ""}<div class="btns">${kopyaBtn(v)}</div></div>`;
  return `<div class="ephead"><h2>Profil</h2><p class="muted">Instagram ve TikTok'ta aynı kullanıcı adı. Alınmışsa sırayla kervandizisi, kervan.tr dene.</p></div>
    <section class="blk">${alan("Kullanıcı adı", p.kullanici)}${alan("Ad", p.ad)}</section>
    <section class="blk">${alan("Instagram biyografisi", p.biyo_ig, [...p.biyo_ig].length + " / 150 karakter")}
      ${alan("TikTok biyografisi", p.biyo_tt, [...p.biyo_tt].length + " / 80 karakter")}</section>
    <section class="blk"><div class="blkhead"><h3>Profil fotoğrafı</h3></div>
      <div class="amblem" role="img" aria-label="Kervan amblemi: pusulalı deri defter">${AMBLEM}</div>
      <p class="muted">Hazır amblem sohbette PNG olarak gönderildi. Flow'da 3D sürümünü üretmek için:</p>
      <details><summary>Promptu göster</summary><pre class="prompt">${esc(p.foto)}</pre></details>
      <div class="btns">${kopyaBtn(p.foto)}</div></section>`;
}

function kasaAraci(){
  let metin = oku("kervan-kasa-arac", "200.000 → 185.000\n186.000");
  return `<div class="ephead"><h2>Kasa aracı</h2><p class="muted">Her satıra bir kasa yaz: değişim için <b>eski → yeni</b>, sabit kasa için tek rakam. Her satır için Flow promptu çıkar.</p></div>
    <section class="blk">${kasaAyarlari()}<label for="ka-metin" class="muted">Satırlar</label>
    <textarea id="ka-metin" spellcheck="false">${esc(metin)}</textarea><div id="ka-sonuc" class="region"></div></section>`;
}
function kasaAraciCiz(){
  const ta = $("#ka-metin"); if (!ta) return;
  yaz("kervan-kasa-arac", ta.value);
  let h = "";
  ta.value.split("\n").forEach((satir, i) => {
    const o = KasaMotor.parseLine(satir);
    if (!o) return;
    if (!o.ok) { h += `<p class="err">Satır ${i + 1}: ${esc(o.msg)}</p>`; return; }
    const metin = KasaMotor.buildPrompt(o, KC);
    const lbl = o.sabit ? "Sabit " + para(o.old) : para(o.old) + " → " + para(o.neu);
    h += `<div class="kasa"><span class="val">${lbl}</span><div class="btns">${kopyaBtn(metin, "Kopyala", "ghost")}</div></div>`;
  });
  $("#ka-sonuc").innerHTML = h;
}
document.addEventListener("input", ev => { if (ev.target.id === "ka-metin") kasaAraciCiz(); });

const AMBLEM = `<svg viewBox="0 0 1080 1080" width="120" height="120" xmlns="http://www.w3.org/2000/svg"><rect width="1080" height="1080" fill="#24130a"/><g transform="rotate(-7 540 545)"><rect x="300" y="238" width="492" height="624" rx="18" fill="#e9d9b4"/><rect x="282" y="226" width="492" height="628" rx="22" fill="#6b3d1f"/><rect x="282" y="226" width="64" height="628" rx="22" fill="#3d1d0b"/><rect x="368" y="252" width="380" height="576" rx="14" fill="none" stroke="#d9b465" stroke-width="5" stroke-dasharray="14 10"/><g transform="translate(558 540)"><circle r="168" fill="#d9a945"/><circle r="150" fill="#2a170a"/><path d="M0 -128L24 0L0 128L-24 0Z" fill="#fbe3a0"/><path d="M-128 0L0 24L128 0L0 -24Z" fill="#e0b25a"/><circle r="14" fill="#d9a945"/></g></g></svg>`;

/* ── Yönlendirme ── */
function goster(){
  const h = location.hash.replace("#", "") || "bolumler";
  const m = h.match(/^b(\d{2})$/);
  const sekme = m ? "bolumler" : h;
  METIN.clear();
  let html;
  if (m) html = bolum(String(parseInt(m[1], 10)));
  else if (h === "rota") html = rota();
  else if (h === "karakterler") html = karakterler();
  else if (h === "kasa") html = kasaAraci();
  else if (h === "profil") html = profil();
  else html = bolumListesi();
  $("#sayfa").innerHTML = html;
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.tab === sekme) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (h === "kasa") kasaAraciCiz();
  ust();
}
let sonHash = null;
window.addEventListener("hashchange", () => { goster(); if (location.hash !== sonHash) window.scrollTo(0, 0); sonHash = location.hash; });
goster();
</script>
