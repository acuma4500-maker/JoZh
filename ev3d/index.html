<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bahçeli Ev Turu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tam ekran 3D sahne; üstünde kenarlara yaslanmış, çizim kâğıdı hissinde yarı saydam paneller.
   Telefon dik tutulduğunda bütün sahne 90° döndürülür, tur hep yatay görünür. */
:root {
  --paper: #f5f6f2;
  --glass: rgba(245, 246, 242, 0.9);
  --ink: #1c2321;
  --muted: #5b6662;
  --line: rgba(28, 35, 33, 0.16);
  --accent: #2c6a58;
  --accent-ink: #f5f6f2;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131816; --glass: rgba(19, 24, 22, 0.86); --ink: #e7ece9; --muted: #9ba7a2;
    --line: rgba(231, 236, 233, 0.16); --accent: #7cc5ab; --accent-ink: #0f1513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131816; --glass: rgba(19, 24, 22, 0.86); --ink: #e7ece9; --muted: #9ba7a2;
  --line: rgba(231, 236, 233, 0.16); --accent: #7cc5ab; --accent-ink: #0f1513;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-display); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
#app.rot { position: fixed; top: 0; transform-origin: 0 0; transform: rotate(90deg); }
#c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.panel {
  background: var(--glass); color: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.eyebrow {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.room-card {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  padding: 10px 14px 11px; display: grid; gap: 2px; max-width: min(320px, calc(100% - 32px));
}
.room-card h1 {
  margin: 0; font-size: 22px; line-height: 1.1; font-weight: 750; font-stretch: 82%;
  letter-spacing: -0.01em; text-wrap: balance;
}
.room-card .mono { font-size: 12px; color: var(--muted); }

.modes {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; padding: 3px; gap: 3px; flex-wrap: wrap; justify-content: flex-end;
}
.modes button {
  font: 600 13px/1 var(--font-display); font-stretch: 90%; color: var(--ink);
  background: transparent; border: 0; border-radius: 7px; padding: 9px 12px; cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.modes .sep { width: 1px; background: var(--line); margin: 4px 2px; }
button:focus-visible, #mini:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.map {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding: 6px; display: grid; gap: 5px;
}
#mini { display: block; width: 260px; height: auto; cursor: crosshair; border-radius: 6px; }
.map .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding-inline: 2px; }
.map .mono { font-size: 10.5px; color: var(--muted); }

.hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px));
  bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding: 8px 12px;
  font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap;
  max-width: calc(100% - 330px);
}
.hint b { font: 500 11px var(--font-mono); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-right: 3px; }

.crosshair {
  position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
  border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); pointer-events: none;
}
.prompt {
  position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%);
  padding: 7px 12px; font-size: 13.5px; font-weight: 600; white-space: nowrap; pointer-events: none;
}
.prompt b { font: 500 11.5px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-right: 6px; }

.joy {
  position: absolute; left: max(22px, calc(env(safe-area-inset-left, 0px) + 12px));
  bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  width: 124px; height: 124px; border-radius: 50%; touch-action: none; display: none;
  background: var(--glass); border: 1px solid var(--line);
}
.joy .knob {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: var(--accent); opacity: 0.9; pointer-events: none;
}
.actions-touch {
  position: absolute; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 186px);
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  display: none; gap: 10px; align-items: flex-end;
}
.round {
  width: 62px; height: 62px; border-radius: 50%; touch-action: none;
  font: 700 12.5px/1.1 var(--font-display); font-stretch: 88%; color: var(--ink);
  background: var(--glass); border: 1px solid var(--line); cursor: pointer;
}
.round[aria-pressed="true"], .round.door { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.coarse .joy { display: block; }
.coarse .actions-touch { display: flex; }
.coarse .hint, .coarse .crosshair, .coarse .prompt { display: none; }
.coarse #mini { width: 160px; }
.coarse .room-card h1 { font-size: 18px; }

#labels { position: absolute; inset: 0; pointer-events: none; }
.label {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font: 700 12px/1.15 var(--font-display); font-stretch: 85%; color: #1c2321; text-align: center;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
}
.label span { display: block; font: 500 10px var(--font-mono); color: #3d4744; }
.label.out { color: #1f3d22; }

.start {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px;
  background: color-mix(in srgb, var(--paper) 30%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.start-btn {
  width: 148px; height: 148px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
  font: 800 24px/1 var(--font-display); font-stretch: 85%; letter-spacing: 0.01em;
  box-shadow: 0 10px 40px rgba(0,0,0,.28), 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent);
  transition: transform .15s ease;
}
.start-btn:hover:not(:disabled) { transform: scale(1.04); }
.start-btn:disabled { cursor: progress; opacity: .75; font-size: 15px; }
.start-sub { padding: 7px 14px; font-size: 13px; color: var(--ink); text-align: center; max-width: 90%; }
@media (prefers-reduced-motion: reduce) { .start-btn { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Evin üç boyutlu modeli"></canvas>
  <div id="labels" hidden></div>
  <div class="crosshair" id="cross"></div>
  <div class="prompt panel" id="prompt" hidden><b>E</b><span id="promptText">Kapıyı aç</span></div>

  <div class="room-card panel" aria-live="polite">
    <span class="eyebrow" id="roomEyebrow">Bulunduğunuz yer</span>
    <h1 id="roomName">Salon</h1>
    <span class="mono" id="roomArea"></span>
  </div>

  <div class="modes panel" role="group" aria-label="Görünüm">
    <button id="btnWalk" type="button" aria-pressed="true">İçeride gez</button>
    <button id="btnTop" type="button" aria-pressed="false">Üstten bak</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="btnQuality" type="button" aria-pressed="true" title="Köşe gölgeleri ve yumuşak gölgeler">Yüksek kalite</button>
  </div>

  <div class="hint panel" id="hint">
    <span><b>W A S D</b>yürü</span><span><b>Shift</b>koş</span><span><b>Boşluk</b>zıpla</span><span><b>C</b>eğil</span><span><b>E</b>kapı aç/kapat</span><span><b>T</b>üstten bak</span><span><b>Esc</b>fareyi bırak</span>
  </div>

  <div class="map panel">
    <canvas id="mini" tabindex="0" aria-label="Kat planı. Bir yere dokunun, oraya gidin."></canvas>
    <div class="row"><span class="eyebrow">Sizin planınız</span><span class="mono">Dokun, git</span></div>
  </div>

  <div class="joy" id="joy" aria-hidden="true"><div class="knob" id="knob"></div></div>
  <div class="actions-touch">
    <button class="round door" id="tDoor" type="button" hidden>Kapıyı aç</button>
    <button class="round" id="tCrouch" type="button" aria-pressed="false">Eğil</button>
    <button class="round" id="tJump" type="button">Zıpla</button>
  </div>

  <div class="start" id="intro">
    <button class="start-btn" id="startBtn" type="button" disabled>Hazırlanıyor…</button>
    <div class="start-sub panel" id="startSub">Ev yükleniyor</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Plan ölçüleri metre: x batı→doğu (0–20), z kuzey→güney (0–15, yol güneyde).
// Ev plana göre SX × SZ oranında büyütülür; mobilya boyutları gerçek kalır, yalnızca yerleri taşınır.
const SX = 1.2, SZ = 1.2;
const MX = x => x * SX, MZ = z => z * SZ;
const H = 2.8, EYE = 1.62, EYE_CROUCH = 1.0, R = 0.2;
const COARSE = matchMedia('(pointer: coarse)').matches;
const TQ = COARSE ? 0.5 : 1; // doku çözünürlüğü çarpanı
let HQ = !COARSE;

const app = document.getElementById('app');
if (COARSE) app.classList.add('coarse');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, COARSE ? 1.5 : 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 2500);
camera.rotation.order = 'YXZ';
let world = new THREE.Group(); scene.add(world);
const ROOT = world;
const roof = new THREE.Group(); scene.add(roof);

// ---------- gökyüzü, güneş, ortam ışığı ----------
const CX = MX(10), CZ = MZ(7.5);
const sunDir = new THREE.Vector3(-0.42, 0.62, 0.66).normalize();
function makeSky(scale) {
  const s = new Sky(); s.scale.setScalar(scale);
  const u = s.material.uniforms;
  u.turbidity.value = 3.2; u.rayleigh.value = 1.1; u.mieCoefficient.value = 0.004; u.mieDirectionalG.value = 0.82;
  u.sunPosition.value.copy(sunDir);
  return s;
}
const sky = makeSky(2000); sky.userData.noAO = true; scene.add(sky);
scene.fog = new THREE.Fog('#c9d9e2', 70, 240);
{
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(makeSky(50));
  const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 32), new THREE.MeshBasicMaterial({ color: '#8a8478' }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.5; envScene.add(ground);
  scene.environment = pm.fromScene(envScene, 0.02, 0.1, 200).texture;
}
const sun = new THREE.DirectionalLight('#fff0dc', 3.2);
sun.position.copy(sunDir).multiplyScalar(34).add(new THREE.Vector3(CX, 0, CZ));
sun.target.position.set(CX, 0, CZ);
sun.castShadow = true;
sun.shadow.mapSize.set(HQ ? 4096 : 2048, HQ ? 4096 : 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 5, far: 80 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.025; sun.shadow.radius = 3;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight('#dfeaf5', '#6b5f48', 0.35));

// ---------- prosedürel dokular: döşenebilir gürültü ile tarayıcıda çizilir ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
function canvas2(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// periyodik değer gürültüsü: (x, y) kafes biriminde, px × py kafeste sarar
function noise2(px, py) {
  const g = new Float32Array(px * py); for (let i = 0; i < g.length; i++) g[i] = Math.random();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py, x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = g[y0 * px + x0], b = g[y0 * px + x1], c = g[y1 * px + x0], d = g[y1 * px + x1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
// fbm alanı: w × h piksel, döşenebilir, değerler ~0..1
function field(w, h, px, py, oct = 5) {
  const ns = []; for (let o = 0; o < oct; o++) ns.push(noise2(px << o, py << o));
  const out = new Float32Array(w * h);
  let norm = 0; for (let o = 0; o < oct; o++) norm += 0.5 ** o;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    let s = 0, amp = 1;
    for (let o = 0; o < oct; o++) { s += amp * ns[o](i / w * (px << o), j / h * (py << o)); amp *= 0.5; }
    out[j * w + i] = s / norm;
  }
  return out;
}
function fieldCanvas(w, h, f, fn) {
  const c = canvas2(w, h), g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let i = 0; i < w * h; i++) { const [r, gg, b, a = 255] = fn(f[i], i); d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = a; }
  g.putImageData(img, 0, 0);
  return c;
}
const N = n => Math.max(64, Math.round(n * TQ));
// ortak gürültü kaynakları
const MOTTLE = (() => { const n = N(1024), f = field(n, n, 6, 6, 5); return fieldCanvas(n, n, f, v => { const l = 150 + (v - 0.5) * 210; return [l, l, l]; }); })();
// ahşap lif kaynağı: yatay uzanan lifler + yıllık halkalar
const GRAIN = (() => {
  const w = N(1024), h = N(1024), f = field(w, h, 2, 24, 5), fine = field(w, h, 4, 160, 2);
  return fieldCanvas(w, h, f, (v, i) => {
    const y = Math.floor(i / w) / h;
    const ring = 0.5 + 0.5 * Math.sin((y * 90 + v * 14) * Math.PI);
    const l = 255 * (0.8 + 0.12 * ring + 0.1 * (fine[i] - 0.5) - 0.1 * Math.pow(ring, 8));
    return [l, l, l];
  });
})();
function multiplyColor(g, x, y, w, h, color) { g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = color; g.fillRect(x, y, w, h); g.restore(); }
function overlay(g, n, src, alpha, op = 'multiply') { g.save(); g.globalAlpha = alpha; g.globalCompositeOperation = op; g.drawImage(src, 0, 0, n, n); g.restore(); }
// draw(g, h, r, n): g renk, h yükseklik, r pürüzlülük (gri) kanvası
function surface(size, draw) {
  const n = N(size), c = canvas2(n), hc = canvas2(n), rc = canvas2(n);
  const g = c.getContext('2d'), h = hc.getContext('2d'), r = rc.getContext('2d');
  h.fillStyle = '#808080'; h.fillRect(0, 0, n, n); r.fillStyle = '#ffffff'; r.fillRect(0, 0, n, n);
  draw(g, h, r, n);
  return { map: tex(c), bump: tex(hc, false), rough: tex(rc, false) };
}
// tahta döşeme: lifli tahtalar, uçları kaydırılmış, kenarları pahlı
function boards(g, h, r, n, rows, colorFn, gap, minL, maxL, roughFn) {
  const rh = n / rows, gs = GRAIN.width;
  for (let row = 0; row < rows; row++) {
    let x = -Math.random() * n;
    while (x < n) {
      const len = n * rnd(minL, maxL), col = colorFn(), sx = rnd(0, gs * 0.2), sy = rnd(0, GRAIN.height - rh * 1.2), rv = roughFn();
      const flip = Math.random() < 0.5;
      for (const off of [0, n]) {
        const X = x + off, Y = row * rh;
        g.save(); g.beginPath(); g.rect(X, Y, len, rh); g.clip();
        if (flip) { g.translate(X + len, Y); g.scale(-1, 1); g.drawImage(GRAIN, sx, sy, gs * 0.75, rh * 1.2, 0, 0, len, rh); }
        else g.drawImage(GRAIN, sx, sy, gs * 0.75, rh * 1.2, X, Y, len, rh);
        g.restore();
        multiplyColor(g, X, Y, len, rh, col);
        g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(X, Y + gap, len, 1);
        h.save(); h.globalAlpha = 0.35; h.drawImage(GRAIN, sx, sy, gs * 0.75, rh * 1.2, X, Y, len, rh); h.restore();
        h.fillStyle = '#2a2a2a'; h.fillRect(X, Y, gap, rh);
        r.fillStyle = `rgb(${rv},${rv},${rv})`; r.fillRect(X + gap, Y + gap, len - gap, rh - gap);
        g.fillStyle = 'rgba(35,22,10,.55)'; g.fillRect(X, Y, gap, rh);
      }
      x += len;
    }
    g.fillStyle = 'rgba(35,22,10,.55)'; g.fillRect(0, row * rh, n, gap);
    h.fillStyle = '#2a2a2a'; h.fillRect(0, row * rh, n, gap);
  }
}
// mermer: türbülanslı damarlar
function marbleCanvas(n, base, vein, scale = 1) {
  const t = field(n, n, 3, 3, 6), t2 = field(n, n, 5, 5, 4);
  return fieldCanvas(n, n, t, (v, i) => {
    const x = (i % n) / n, y = Math.floor(i / n) / n;
    const m = Math.abs(Math.sin((x * 2 * scale + y * scale + v * 3.2) * Math.PI));
    const m2 = Math.abs(Math.sin((x * -1 + y * 3 + t2[i] * 4) * Math.PI));
    const k = Math.pow(1 - m, 14) * 0.85 + Math.pow(1 - m2, 30) * 0.45 + (v - 0.5) * 0.12;
    return [base[0] - k * (base[0] - vein[0]), base[1] - k * (base[1] - vein[1]), base[2] - k * (base[2] - vein[2])];
  });
}
function tiling(g, h, r, n, cols, rows, src, grout, gw, tileRough = 40, tint = null) {
  g.fillStyle = grout; g.fillRect(0, 0, n, n);
  h.fillStyle = '#404040'; h.fillRect(0, 0, n, n);
  r.fillStyle = '#e0e0e0'; r.fillRect(0, 0, n, n);
  const tw = n / cols, th = n / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = i * tw + gw / 2, y = j * th + gw / 2, w = tw - gw, hh = th - gw;
    // her karo kaynak dokunun farklı bir yerinden kesilir
    const sx = rnd(0, src.width - w * src.width / n), sy = rnd(0, src.height - hh * src.height / n);

  let { x: dx, y: dy } = localDelta(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  const l = Math.hypot(dx, dy); if (l > max) { dx *= max / l; dy *= max / l; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / max; joy.y = -dy / max;
}
joyEl.addEventListener('pointerdown', e => { joy.id = e.pointerId; try { joyEl.setPointerCapture(e.pointerId); } catch (_) {} joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (joy.id === e.pointerId) joyMove(e); });
const joyEnd = e => { if (joy.id !== e.pointerId) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
const tDoor = document.getElementById('tDoor'), tJump = document.getElementById('tJump'), tCrouch = document.getElementById('tCrouch');
tJump.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
tCrouch.addEventListener('click', () => { crouchToggle = !crouchToggle; tCrouch.setAttribute('aria-pressed', crouchToggle); });
tDoor.addEventListener('click', () => { if (targetDoor) toggleDoor(targetDoor); });

// kapı hedefleme ve animasyon
const promptEl = document.getElementById('prompt'), promptText = document.getElementById('promptText');
function findTargetDoor() {
  raycaster.setFromCamera(ndc.set(0, 0), camera); raycaster.far = 2.4;
  const hit = raycaster.intersectObjects(doorMeshes, false)[0];
  if (hit) return hit.object.userData.door;
  // bakış kapıdan kaçınca: önünüzdeki en yakın kapı
  let best = null, bd = 1.7;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  for (const d of doors) {
    const dx = d.center[0] - player.x, dz = d.center[1] - player.z, dist = Math.hypot(dx, dz);
    if (dist < bd && (dx * fx + dz * fz) / (dist || 1) > 0.35) { best = d; bd = dist; }
  }
  return best;
}
function updateDoors(dt) {
  for (const d of doors) {
    const step = dt * (d.slide ? 0.55 : 1.4);
    if (d.t < d.target) d.t = Math.min(d.target, d.t + step); else if (d.t > d.target) d.t = Math.max(d.target, d.t - step);
    const k = d.t * d.t * (3 - 2 * d.t);
    if (d.slide) d.pivot.position.x = d.slide * k; else d.pivot.rotation.y = d.angle * k;
    d.closedCol.off = d.t > 0.25;
    if (d.openCol) d.openCol.off = d.t < 0.9;
  }
}

const marker = new THREE.Group();
const mk = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 20), M('#e0533d', { emissive: '#a02a18', emissiveIntensity: 0.6 }));
mk.rotation.x = Math.PI; mk.position.y = 2.2; marker.add(mk);
const mkr = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.36, 32), M('#e0533d', { side: THREE.DoubleSide, emissive: '#a02a18' }));
mkr.rotation.x = -Math.PI / 2; mkr.position.y = 0.07; marker.add(mkr);
marker.visible = false; scene.add(marker);

const labelsEl = document.getElementById('labels');
const labelItems = ZONES.filter(z => !z.hide).map(zn => {
  const r = zn.r[0], el = document.createElement('div');
  el.className = 'label' + (zn.out ? ' out' : '');
  el.innerHTML = zn.n + (zn.a ? `<span>${zn.a} m²</span>` : '');
  labelsEl.appendChild(el);
  return { el, p: new THREE.Vector3(...(zn.lp ? [zn.lp[0], 0.1, zn.lp[1]] : [(r[0] + r[2]) / 2, 0.1, (r[1] + r[3]) / 2])) };
});

const btnWalk = document.getElementById('btnWalk'), btnTop = document.getElementById('btnTop'), btnQuality = document.getElementById('btnQuality');
const cross = document.getElementById('cross');
function setMode(m) {
  mode = m;
  btnWalk.setAttribute('aria-pressed', m === 'walk'); btnTop.setAttribute('aria-pressed', m === 'top');
  roof.visible = m === 'walk';
  marker.visible = m === 'top';
  labelsEl.hidden = m === 'walk';
  cross.hidden = m !== 'walk';
  if (m === 'top' && locked()) document.exitPointerLock();
  hud.last = null;
}
btnWalk.addEventListener('click', () => setMode('walk'));
btnTop.addEventListener('click', () => setMode('top'));

// ---------- HUD ----------
const hud = { name: document.getElementById('roomName'), area: document.getElementById('roomArea'), eyebrow: document.getElementById('roomEyebrow'), last: null };
const PLOT = `Arsa ${(MX(20)).toFixed(0)} × ${(MZ(15)).toFixed(0)} m`;
function updateHud() {
  const zn = zoneAt(player.x, player.z);
  const key = (zn ? zn.n : '') + mode;
  if (key === hud.last) return;
  hud.last = key;
  hud.eyebrow.textContent = mode === 'walk' ? 'Bulunduğunuz yer' : 'Kuş bakışı · kırmızı işaret sizsiniz';
  hud.name.textContent = zn ? zn.n : 'Arsa';
  hud.area.textContent = zn && zn.a ? `≈ ${zn.a} m²` : PLOT;
}

// ---------- mini harita: sizin renkli planınız ----------
// Plan görüntüsündeki piksel ↔ plan metresi eşlemesi (duvar hizalarından ölçüldü)
const AX = [[0, 97], [2.5, 245], [7.0, 520], [10.1, 722], [12.6, 850], [15.6, 1058], [17.4, 1200], [20, 1378]];
const AZ = [[0, 62], [3.2, 262], [4.3, 310], [8.4, 555], [14.55, 888], [15.2, 950]];
const CROP = { x: 30, y: 25, w: 1390, h: 935 };
function lerpMap(v, A, inv = false) {
  const a = inv ? A.map(([m, p]) => [p, m]) : A;
  for (let i = 0; i < a.length - 1; i++) if (v <= a[i + 1][0] || i === a.length - 2) return a[i][1] + (v - a[i][0]) / (a[i + 1][0] - a[i][0]) * (a[i + 1][1] - a[i][1]);
}
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const planImg = new Image(); let planReady = false;
planImg.onload = () => { planReady = true; };
planImg.src = 'plan.jpg';
function sizeMap() {
  const cssW = mini.clientWidth || 260, cssH = cssW * CROP.h / CROP.w, dpr = Math.min(window.devicePixelRatio || 1, 2);
  mini.style.height = cssH + 'px'; mini.width = cssW * dpr; mini.height = cssH * dpr;
}
function drawMap() {
  const Wd = mini.width, Hh = mini.height;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  if (planReady) mctx.drawImage(planImg, 0, 0, Wd, Hh); else { mctx.fillStyle = '#d9dcd6'; mctx.fillRect(0, 0, Wd, Hh); }
  const px = (lerpMap(player.x / SX, AX) - CROP.x) / CROP.w * Wd, pz = (lerpMap(Math.min(player.z / SZ, 15.2), AZ) - CROP.y) / CROP.h * Hh;
  const s = Wd / (mini.clientWidth || 260), a = -yaw - Math.PI / 2;
  mctx.fillStyle = 'rgba(224,83,61,.32)';
  mctx.beginPath(); mctx.moveTo(px, pz); mctx.arc(px, pz, 26 * s, a - 0.55, a + 0.55); mctx.closePath(); mctx.fill();
  mctx.fillStyle = '#e0533d'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2 * s;
  mctx.beginPath(); mctx.arc(px, pz, 5 * s, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
}
mini.addEventListener('click', e => {
  const l = localInRect(e, mini);
  const ix = CROP.x + l.x / l.w * CROP.w, iy = CROP.y + l.y / l.h * CROP.h;
  const x = MX(lerpMap(ix, AX, true)), z = MZ(lerpMap(iy, AZ, true));
  if (x < 0 || x > MX(20) || z < 0 || z > ZF) return;
  for (let rad = 0; rad < 1.2; rad += 0.1) for (let k = 0; k < 12; k++) {
    const tx = x + Math.cos(k / 12 * Math.PI * 2) * rad, tz = z + Math.sin(k / 12 * Math.PI * 2) * rad;
    if (!blocked(tx, tz)) { player.x = tx; player.z = tz; player.vx = player.vz = 0; if (mode !== 'walk') setMode('walk'); return; }
  }
});

// ---------- işleme: yüksek kalitede köşe gölgeleri (GTAO) ----------
let composer = null;
function buildComposer() {
  const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
  const rt = new THREE.WebGLRenderTarget(w * pr, h * pr, { type: THREE.HalfFloatType, samples: 4 });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const gtao = new GTAOPass(scene, camera, w, h);
  gtao.updateGtaoMaterial({ radius: 0.45, distanceExponent: 1.5, thickness: 1.2, scale: 1.2, samples: 16 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6 });
  gtao.blendIntensity = 0.9;
  // cam, perde, yaprak ve gökyüzü AO hesabına girmesin
  gtao.overrideVisibility = function () {
    const cache = this._visibilityCache;
    this.scene.traverse(o => {
      cache.set(o, o.visible);
      if (o.isPoints || o.isLine || o.userData.noAO || (o.material && (o.material.transparent || o.material.alphaTest > 0))) o.visible = false;
    });
  };
  composer.addPass(gtao);
  composer.addPass(new OutputPass());
}
function setQuality(hq) {
  HQ = hq;
  btnQuality.setAttribute('aria-pressed', hq); btnQuality.textContent = hq ? 'Yüksek kalite' : 'Hızlı mod';
  if (hq && !composer) buildComposer();
  resize();
}
btnQuality.addEventListener('click', () => setQuality(!HQ));

// ---------- başlat ----------
const intro = document.getElementById('intro'), startBtn = document.getElementById('startBtn'), startSub = document.getElementById('startSub');
startBtn.disabled = false; startBtn.textContent = 'Başlat';
startSub.textContent = COARSE ? 'Sol daire: yürü · kaydır: bak · düğmeler: zıpla, eğil, kapı' : 'W A S D yürü · fare ile bak · E kapı · Boşluk zıpla · C eğil';
startBtn.addEventListener('click', () => {
  intro.hidden = true; setMode('walk');
  player.x = START.x; player.z = START.z; yaw = START.yaw; pitch = -0.06;
  if (!COARSE) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
  else {
    // telefonda tam ekran + yatay kilit dene; olmazsa sahne CSS ile yatay döndürülür
    const el = document.documentElement;
    try {
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
      if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
    } catch (_) {}
  }
  canvas.focus();
});

// ---------- yerleşim ve döngü ----------
const portraitMQ = matchMedia('(orientation: portrait)');
function layout() {
  ROT = COARSE && portraitMQ.matches;
  app.classList.toggle('rot', ROT);
  if (ROT) { app.style.width = innerHeight + 'px'; app.style.height = innerWidth + 'px'; app.style.left = innerWidth + 'px'; }
  else { app.style.width = app.style.height = app.style.left = ''; }
  resize();
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  sizeMap();
}
addEventListener('resize', layout);
portraitMQ.addEventListener?.('change', layout);
setQuality(HQ);
layout();

const clock = new THREE.Clock(), v = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  updateDoors(dt);
  if (mode === 'walk') {
    let f = 0, s = 0;
    if (intro.hidden) {
      f = joy.y; s = joy.x;
      if (keys.KeyW || keys.ArrowUp) f += 1; if (keys.KeyS || keys.ArrowDown) f -= 1;
      if (keys.KeyA || keys.ArrowLeft) s -= 1; if (keys.KeyD || keys.ArrowRight) s += 1;
      const l = Math.hypot(f, s); if (l > 1) { f /= l; s /= l; }
    }
    const speed = crouching() ? 1.1 : (keys.ShiftLeft || keys.ShiftRight ? 4.0 : 1.9);
    const tx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * speed, tz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * speed;
    const acc = player.y > 0.001 ? 2 : 10;
    player.vx += (tx - player.vx) * Math.min(1, acc * dt); player.vz += (tz - player.vz) * Math.min(1, acc * dt);
    tryMove(player.vx * dt, player.vz * dt);
    // zıplama ve yerçekimi
    player.vy -= 11 * dt; player.y = Math.max(0, player.y + player.vy * dt); if (player.y === 0) player.vy = 0;
    player.eye += ((crouching() ? EYE_CROUCH : EYE) - player.eye) * Math.min(1, 10 * dt);
    const sp = Math.hypot(player.vx, player.vz);
    if (player.y === 0 && sp > 0.2) player.bob += dt * sp * 4.2;
    const bobY = player.y === 0 ? Math.sin(player.bob * 2) * 0.022 * Math.min(1, sp / 2) : 0;
    camera.position.set(player.x, player.y + player.eye + bobY, player.z);
    camera.rotation.set(pitch, yaw, Math.sin(player.bob) * 0.003 * Math.min(1, sp / 2));
    targetDoor = intro.hidden ? findTargetDoor() : null;
  } else {
    applyTop(); targetDoor = null;
    marker.position.set(player.x, 0, player.z);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    for (const it of labelItems) {
      v.copy(it.p).project(camera);
      const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
      it.el.hidden = !vis;
      if (vis) it.el.style.transform = `translate(${(v.x + 1) / 2 * w}px, ${(1 - v.y) / 2 * h}px) translate(-50%, -50%)`;
    }
  }
  promptEl.hidden = tDoor.hidden = !targetDoor;
  if (targetDoor) { const txt = targetDoor.target ? 'Kapıyı kapat' : 'Kapıyı aç'; if (promptText.textContent !== txt) { promptText.textContent = txt; tDoor.textContent = txt; } }
  updateHud(); drawMap();
  if (HQ && composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
setMode('walk');
requestAnimationFrame(frame);
window.__tour = { player, doors, state: () => ({ yaw, pitch, mode, HQ, ROT }), setYaw: y => { yaw = y; pitch = -0.08; } };
</script>
</body>
