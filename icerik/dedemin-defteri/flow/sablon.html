<style>
/* Layout: tüccar defteri. Üstte sekmeli sicil, altta gün gün hesap satırları ve sahne kartları; kasa göstergesi mühür kırmızısı. */
:root{
  --paper:#f5f6f1;
  --sheet:#ffffff;
  --ink:#1d2433;
  --ink-soft:#5b6372;
  --rule:#d9dccf;
  --ledger:#2f6f62;
  --ledger-soft:#e1efe9;
  --warn:#8a5a00;
  --screen:#000000;
  --screen-ink:#ffffff;
  --screen-label:#a0a0a0;
  --screen-up:#00e676;
  --screen-down:#ff1744;
  --seal:#a8322d;
  --seal-soft:#f6e3e1;
  --code-bg:#eef0e8;
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141922; --sheet:#1b212c; --ink:#e7e9e2; --ink-soft:#a3a9b4; --rule:#2e3644;
    --ledger:#6fbfad; --ledger-soft:#1b2f2a; --warn:#e3b04b; --seal:#e0706a; --seal-soft:#3a2022; --code-bg:#11161e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141922; --sheet:#1b212c; --ink:#e7e9e2; --ink-soft:#a3a9b4; --rule:#2e3644;
  --ledger:#6fbfad; --ledger-soft:#1b2f2a; --warn:#e3b04b; --seal:#e0706a; --seal-soft:#3a2022; --code-bg:#11161e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--sheet);border-bottom:1px solid var(--rule)}
header.top .wrap{padding-block:28px 18px;display:grid;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ledger)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,52px);line-height:1.02;margin:0;text-wrap:balance}
.lede{color:var(--ink-soft);max-width:64ch;margin:0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink-soft);font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);border-color:var(--rule)}
nav.tabs a[aria-current="page"]{color:var(--sheet);background:var(--ink)}
nav.tabs a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ledger);outline-offset:2px}
main .wrap{padding-block:28px 64px;display:grid;gap:28px}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
p{margin:0}
.muted{color:var(--ink-soft)}
.recipe{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px}
.recipe ol,.recipe ul{margin:0;padding-left:22px;display:grid;gap:6px}
.rules{list-style:none;padding:0!important;display:grid;gap:10px!important}
.rules li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border-top:1px solid var(--rule);padding-top:10px}
.rules li:first-child{border-top:0;padding-top:0}
.rules .num{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--seal);line-height:1}
.rules b{display:block}
.rules .how{color:var(--ink-soft);font-size:15px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px}
.char{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.char .name{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.char .age{font-family:var(--f-mono);font-size:13px;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:1px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--ink-soft);font-weight:600}
.kv dd{margin:0;min-width:0}
pre.prompt{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;padding:12px;max-height:440px;overflow:auto}
.copyrow{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
button.copy{font:600 13px var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button.copy:hover{background:var(--ink);color:var(--sheet)}
button.copy.alt{border-color:var(--ink-soft);color:var(--ink-soft)}

.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{font:600 13px var(--f-mono);color:var(--ink-soft);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:5px 9px;cursor:pointer;min-width:44px}
.jump button:hover{color:var(--ink);border-color:var(--ink)}
.jump button.full{color:var(--ledger);border-color:var(--ledger)}
.cal{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.cal table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px;font-variant-numeric:tabular-nums}
.cal th{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:10px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet)}
.cal td{padding:7px 10px;border-bottom:1px solid var(--rule)}
.cal td.num,.cal th.num{text-align:right;font-family:var(--f-mono)}

.cal a:hover{color:var(--ledger)}
.cal tr.sec td{background:var(--code-bg);font-weight:700;font-family:var(--f-display);font-size:16px}
section.ep{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden;scroll-margin-top:72px}
.ep-head{padding:20px 20px 16px;display:grid;gap:10px;border-bottom:1px solid var(--rule)}
.ep-head .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ep-no{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--ledger);text-transform:uppercase}
.ep-prog{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.prev{font-size:14.5px;border-left:3px solid var(--seal);padding-left:12px;color:var(--ink-soft)}
.prev b{color:var(--seal);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;display:block}
.plan{font-size:14.5px;color:var(--ink-soft)}
.plan b{color:var(--ink)}
.ledger{overflow-x:auto}
.ledger table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.ledger th{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule)}
.ledger td{text-align:right;padding:8px 10px}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td.minus{color:var(--ink-soft)}
.ledger td.close{color:var(--seal);font-weight:600}
.trade{font-size:15px}
.trade b{font-weight:600}
details.guests{border-top:1px dashed var(--rule);padding-top:10px}
details.guests summary{cursor:pointer;font-weight:600;color:var(--ink-soft)}
.guest{display:grid;gap:4px;margin-top:10px}
.scenes{display:grid}
article.scene{padding:18px 20px;border-bottom:1px solid var(--rule);display:grid;gap:10px;min-width:0}
article.scene.done{background:color-mix(in srgb,var(--ledger) 6%,var(--sheet))}
.sc-top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.sc-n{font-family:var(--f-display);font-weight:800;font-size:20px}
.when{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ledger);border:1px solid var(--ledger);border-radius:4px;padding:2px 8px;white-space:nowrap}
.sc-place{color:var(--ink-soft);font-weight:600}
.kasa{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--seal);background:var(--seal-soft);border:1px solid var(--seal);border-radius:4px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.made{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.made input{width:16px;height:16px;accent-color:var(--ledger)}
.olay{font-size:16px}
.dlg{display:grid;gap:3px;border-left:3px solid var(--ledger);padding-left:12px}
.dlg p{font-size:15.5px}
.dlg b{font-weight:700;font-size:12.5px;letter-spacing:.04em;margin-right:6px}
.dlg i{color:var(--ink-soft);font-size:13px}
.note{font-size:14px;color:var(--ink-soft)}
.note b{color:var(--ink)}
details.pr summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-soft);list-style:none}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary::before{content:"▸ ";font-family:var(--f-mono)}
details.pr[open] summary::before{content:"▾ "}
.pr-wrap{display:grid;gap:8px}
.cover{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start;border-top:1px dashed var(--rule);padding-top:14px}
.cover .frame{aspect-ratio:9/16;max-width:100%;border:1.5px solid var(--seal);border-radius:8px;background:var(--seal-soft);display:grid;align-content:start;justify-items:center;gap:2px;padding:10px 6px;text-align:center}
.cover .frame .t1{font:600 9px var(--f-mono);letter-spacing:.06em;color:var(--seal)}
.cover .frame .t2{font:800 12px/1.1 var(--f-display);color:var(--ink)}
.cover .frame .t3{font:600 8.5px var(--f-mono);color:var(--seal);margin-top:auto}
.cover .body{display:grid;gap:8px;min-width:0}
.cover .lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal)}
.cover .yazi{font-size:14px;color:var(--ink-soft)}
.cover .yazi b{color:var(--ink)}
.cap{display:grid;gap:8px;border-top:1px dashed var(--rule);padding-top:14px}
.cap .lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ledger)}
.cap pre.txt{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:15.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;padding:12px}
.cap .tags{font-family:var(--f-mono);font-size:14px;color:var(--ledger);word-break:break-word}
.kvb{display:grid;gap:8px;border:1px solid var(--rule);border-left:4px solid var(--seal);border-radius:8px;background:var(--code-bg);padding:12px 14px}
.kvb .top{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.kvb .lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal)}
.kvb .where{font-weight:700;font-size:15px}
.kvb .val{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.kvb .val.up{color:var(--ledger)}
.kvb .val.down{color:var(--seal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ka-entry{display:grid;gap:12px}
.ka-lbl{font-weight:700;font-size:17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.ka-lbl small{font-weight:400;font-size:14px;color:var(--ink-soft)}
.ka-entry textarea{width:100%;display:block;font-family:var(--f-mono);font-size:16px;line-height:1.7;background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;resize:vertical;min-height:7.2rem}
.ka-entry textarea:focus-visible{outline:2px solid var(--ledger);outline-offset:2px;border-color:var(--ledger)}
.ka-ornek{font-weight:600;color:var(--warn)}
.ka-chips{display:flex;flex-wrap:wrap;gap:8px}
.ka-h{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ka-h .note{font-family:var(--f-mono);font-weight:400;font-size:13px}
.ka-clips{display:grid;gap:14px}
.ka-clip{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.ka-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.ka-head h3{font-size:20px}
.ka-meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.ka-main{display:flex;gap:16px;align-items:flex-start;min-width:0}
.ka-shot{display:grid;gap:6px;justify-items:center;flex:none;max-width:100%}
.ka-cap{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.ka-frame{--fw:170px;--fh:calc(var(--fw)*16/9);width:var(--fw);aspect-ratio:9/16;background:var(--screen);border:1px solid var(--rule);border-radius:10px;position:relative;overflow:hidden;max-width:100%}
.ka-counter{position:absolute;top:6%;right:5%;display:grid;justify-items:end;gap:calc(var(--fh)*.004);font-family:var(--f-mono);color:var(--screen-ink);text-align:right}
.ka-counter .k{font-size:calc(var(--fh)*.02);letter-spacing:.14em;font-weight:600;line-height:1.1;color:var(--screen-label)}
.ka-counter .b{font-size:calc(var(--fh)*.044);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ka-counter .c{font-size:calc(var(--fh)*.029);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.ka-counter .c.up{color:var(--screen-up)}
.ka-counter .c.down{color:var(--screen-down)}
.ka-facts{margin:0;display:grid;gap:10px;align-content:start;min-width:0;flex:1}
.ka-facts dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}

.ka-facts .dir{font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--ink-soft)}

.ka-chip.up{background:var(--ledger-soft);color:var(--ledger)}

.ka-actions{display:flex;flex-wrap:wrap;gap:8px}

@media (min-width:720px){.ka-frame{--fw:200px}}
@media (max-width:359px){.ka-main{flex-wrap:wrap}}
.kayar{border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}

.kayar>summary::before{content:"▸";color:var(--ink-soft)}
.kayar[open]>summary::before{content:"▾"}
.kayar .sum{font-family:var(--f-mono);font-size:12.5px;font-weight:400;color:var(--ink-soft)}
.kayar-body{display:grid;gap:14px;padding:4px 12px 14px}
.kseg{display:grid;gap:6px;justify-items:start}
.kseg-lbl{font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.kseg-help{font-size:13.5px;color:var(--ink-soft)}
.kopts{position:relative;display:inline-flex;max-width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}

  .cover{grid-template-columns:72px 1fr;gap:12px}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PROMPTS = new Map();

try { const c = JSON.parse(localStorage.getItem(KC_KEY) || "null"); if (c) { if (c.birim === "TL") KC.birim = "TL"; if (c.gecis === "anlik") KC.gecis = "anlik"; if (c.etiket === "yok") KC.etiket = "yok"; } } catch (e) {}

const DAT = {1:"e", 2:"ye", 3:"e", 4:"e", 5:"e", 6:"ya"}, LOK = {1:"deki", 2:"deki", 3:"teki", 4:"teki", 5:"teki", 6:"daki"};

  ["Sahneyi net tanımla", "Mekânı, zamanı ve ana eylemi açık yaz.", "Her prompt'ta LOCATION, TIME AND LIGHT ve ACTION ayrı satırlar. Sahne kartında saat ve yer en üstte."],
  ["Kamera hareketini belirt", "Pan, tilt, dolly veya close-up gibi detay ver.", "Her sahnede tek bir kamera hareketi yazılı."],
  ["Işığı sabit tut", "Gün batımı, stüdyo ya da doğal ışığı netleştir.", "Her sahnede saat ve evre var (örn. 07:10 şafak). Aynı evre aynı ışık cümlesini alır, hava bölüm başında sabittir."],
  ["Karakteri tutarlı anlat", "Kıyafet, yaş, saç ve yüz detaylarını koru.", "Sabit karakter tarifleri her prompt'a aynen girer, kıyafet hiç değişmez."],
  ["Fizik kurallarını unutma", "Hareketler doğal ve ağırlık hissi taşısın.", "Eylemler tek ve gerçekçi (taşımak, uzatmak, oturmak). Prompt'ta sabit PHYSICS satırı var."],

  ["Kısa planlarla başla", "5–8 saniyelik net sahneler daha iyi sonuç verir.", "8 saniye, tek çekim, tek eylem. Bir bölüm 6 sahne."],
  ["Yüz ve el detaylarını kontrol et", "Bozulmaları fark edip yeniden üret.", "Eller tek nesne tutar. AVOID satırı bozulmaları yasaklar. Üretince aşağıdaki kontrol listesine bak."],
  ["Ses ve dudak uyumunu düşün", "Konuşma varsa lip sync ve ton önemli.", "Sahne başına en çok 2 replik, yaklaşık 18 kelime. Ton köşeli parantezde. Telefondaki ses görünmez, dinleyenin dudağı kapalı."],
  ["İlk çıktıyla yetinme", "İyileştir, yeniden dene, en iyi versiyonu seç.", "Her sahnede \"Yeniden dene\" için sadeleştirilmiş bir prompt var: tek karakter, sabit kamera, tek eylem."],
];

function copyBtn(id, label, alt){ return `<button class="copy ${alt?"alt":""}" type="button" data-copy="${id}">${label || "Kopyala"}</button>`; }
function seasonOf(no){ const s = DATA.sezonlar.find(x => no >= x.ilk && no <= x.son); return s ? s.id : DATA.sezonlar[0].id; }

function renderTabs(cur){
  document.getElementById("tabs").innerHTML = ROUTES.map(r =>
    `<a href="#${r.id}" ${r.id===cur?'aria-current="page"':""}>${esc(r.ad)}</a>`).join("");
}

function renderChars(){
  PROMPTS.clear();
  PROMPTS.set("stil", DATA.stil);
  const ana = DATA.karakterler.filter(k => k.ana), gec = DATA.karakterler.filter(k => !k.ana);
  const card = k => {
    PROMPTS.set("k-"+k.id, k.en + ". Voice: " + k.ses + ".");
    return `<article class="char">
      <div class="name"><h3>${esc(k.ad)}</h3><span class="age">${k.yas} yaşında</span></div>
      <dl class="kv">
        <dt>İlk görünüş</dt><dd>${esc(k.ilk)}</dd>
        <dt>Rolü</dt><dd>${esc(k.rol)}</dd>
        <dt>Görünüm</dt><dd>${esc(k.tr)}</dd>
      </dl>
      <pre class="prompt">${esc(k.en)}.\nVoice: ${esc(k.ses)}.</pre>
      <div class="copyrow">${copyBtn("k-"+k.id, "Sabit tarifi kopyala")}</div>
    </article>`;
  };
  return `
    <div class="season-head">
      <span class="eyebrow">Sahne yazım kuralları</span>
      <h2>Flow için 10 madde</h2>
      <p class="muted">Bütün sahneler bu listeye göre yazıldı. Sağda her maddenin bu sayfadaki karşılığı var.</p>
    </div>
    <div class="recipe">
      <ol class="rules">${RULES.map((r,i) => `<li><span class="num">${i+1}</span><div><b>${esc(r[0])}</b><span class="muted">${esc(r[1])}</span><span class="how">${esc(r[2])}</span></div></li>`).join("")}</ol>
    </div>
    <div class="recipe">
      <h3>Üretince kontrol listesi</h3>
      <ul>
        <li>Yüz önceki sahnelerdeki gibi mi? Saç, kıyafet, yaş aynı mı?</li>
        <li>Eller beş parmaklı ve doğal mı? Nesne elde duruyor mu?</li>
        <li>Işık sahne boyunca aynı mı? Saat ve hava prompt'taki gibi mi?</li>
        <li>Dudaklar sözlerle uyuyor mu? Replik net duyuluyor mu?</li>
        <li>Arka plan sade mi? Kalabalık ya da tekrar eden yüzler yok mu?</li>
        <li>Hareket doğal mı? Ağırlık hissi, ayaklar yerde mi?</li>
      </ul>
      <p class="muted">Biri tutmuyorsa sahneyi 2-3 kez daha üret, olmazsa "Yeniden dene" prompt'unu kullan. Flow'da referans görsel ya da kareden video seçeneği varsa, aynı mekândaki ardışık sahnelerde önceki klibin son karesini başlangıç yaparsan yüz, mekân ve ışık sürekliliği korunur.</p>
    </div>
    <div class="recipe">
      <h3>Bir sahne prompt'u nasıl kurulur?</h3>
      <ol>
        <li><b>Stil:</b> dikey 9:16, 8 saniye, tek çekim, semi-realistic stylized 3D.</li>
        <li><b>Karakterler:</b> görünen herkesin sabit tarifi ve sesi. Telefondaki kişi "görünmez" diye işaretlenir.</li>
        <li><b>Mekân, zaman ve ışık:</b> yer, saat, günün evresi ve hava.</li>
        <li><b>Arka plan:</b> sade, en çok 2-3 uzak figür.</li>
        <li><b>Eylem:</b> tek çekimde tek eylem.</li>
        <li><b>Kamera:</b> tek hareket.</li>
        <li><b>Diyalog:</b> Türkçe, kısa, tonlu.</li>
        <li><b>Fizik, ses, kaçınılacaklar:</b> sabit satırlar.</li>

      <p class="muted">Ekrandaki "KASA: … ₺" ve yer-zaman yazısı (örn. NEVŞEHİR · GÜN 6 · 07:10) prompt'a konmaz, yapay zekâ yazıyı bozduğu için kurguda eklenir. Her sahnenin altındaki "Kurgu notu" neyin ne zaman yazılacağını söyler.</p>

    <div class="recipe">
      <h3>Kapak fotoğrafı prompt'u</h3>

      <pre class="prompt">${esc(DATA.kapak_stil)}</pre>
    </div>
    <div class="recipe">
      <h3>Kasa videosu</h3>
      <p class="muted">Bölüm 4'ten itibaren her sahnenin altında o sahneye eklenecek bir kasa videosu prompt'u var. Prompt sabittir, yalnızca sayılar değişir: arka plan siyah, kasa sağ üst köşede. Para girince altında yeşil "+" fark, çıkınca kırmızı "−" fark yazar ve bakiye yeni değere gider. Para efekti yoktur. Kasası değişmeyen sahnelerde "sabit kasa" prompt'u var: bakiye 8 saniye boyunca aynı kalır, altında yazı çıkmaz. Aynı bakiyeyi taşıyan sabit sahneler tek klibi paylaşır. Videoyu indirip sahnenin üstüne koy, karıştırma modunu "Ekran" (Screen) ya da "Aydınlat" (Lighten) yap. Para birimi, rakam geçişi ve KASA yazısı ayarları her bölüm listesinin en üstünde. Kendi rakamını yazmak istersen "Kasa aracı" sekmesi var. Yapay zekâ rakamları bazen bozar; sayıyı kontrol et, bozuksa "Anında değişir"i dene ya da yeniden üret.</p>
    </div>
    <div class="chars">${ana.map(card).join("")}</div>
    <div class="season-head"><span class="eyebrow">Geçmiş sahneleri</span><h2>1979 hâlleri</h2>
      <p class="muted">Sadece geri dönüş sahnelerinde kullanılır.</p></div>
    <div class="chars">${gec.map(card).join("")}</div>`;
}

function renderCal(){
  const rows = DATA.bolumler.map(b => {
    const sa = b.sahneler.filter(s => s.saat);
    const aralik = sa.length ? sa[0].saat + " – " + sa[sa.length-1].saat : "";
    return `<tr><td class="num"><a href="#${seasonOf(b.no)}" data-go="${b.no}">${b.no}</a></td><td>${esc(b.il)}</td><td>${esc(b.mevsim)}, ${esc(b.hava)}</td><td>${esc(b.baslik)}</td><td class="num">${esc(aralik)}</td><td class="num">${b.kasa ? fmt(b.kasa.kapanis) : "—"}</td></tr>`;
  }).join("");
  return `<div class="season-head">
      <span class="eyebrow">Zaman çizelgesi</span>
      <h2>100 bölüm, 100 gün</h2>
      <p class="muted">Gün numarası bölüm numarasıdır. Bölüm 4'ten itibaren her bölüm o günün sabahında başlar, gece biter. Kış Gün 60'a kadar, kış sonu 61-80, ilkbahar 81'den sonra. Mahkeme Gün 36'da "60 gün sonra" diye duyurulur, Gün 82'de öne alınır ("8 gün kaldı") ve Gün 90'da Ankara'da görülür.</p>
    </div>
    <div class="cal"><table>
      <thead><tr><th class="num">Gün</th><th>İl</th><th>Mevsim, hava</th><th>Başlık</th><th class="num">Saatler</th><th class="num">Kasa</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

function kasaAyarHtml(){
  const opt = (ad, val, etiket, id) => `<input type="radio" name="kc-${ad}" id="kc-${id}" value="${val}" data-kc="${ad}" ${KC[ad] === val ? "checked" : ""}><label for="kc-${id}">${etiket}</label>`;
  const grup = (no, baslik, secenekler, yardim) => `<div class="kseg" role="radiogroup" aria-labelledby="kc-l${no}"><span class="kseg-lbl" id="kc-l${no}">${baslik}</span><div class="kopts">${secenekler}</div><span class="kseg-help">${yardim}</span></div>`;
  return `<details class="kayar" id="kc-ayar" ${kcAcik ? "open" : ""}>
    <summary>Kasa prompt ayarları <span class="sum">${esc(kcOzet())}</span></summary>
    <div class="kayar-body">
      ${grup(1, "Para birimi", opt("birim", "₺", "₺", "try") + opt("birim", "TL", "TL", "tl"), "₺ işareti videoda bozuk çıkarsa TL seç.")}
      ${grup(2, "Rakamlar", opt("gecis", "akici", "Akıcı sayar", "akici") + opt("gecis", "anlik", "Anında değişir", "anlik"), "Sayarken rakamlar bozuluyorsa anında değişen sürümü dene.")}
      ${grup(3, "KASA yazısı", opt("etiket", "var", "Var", "var") + opt("etiket", "yok", "Yok", "yok"), "Sayacın üstündeki küçük gri KASA yazısı.")}
      <p class="note">Ayar değişince bu sayfadaki bütün kasa prompt'ları buna göre güncellenir. Sahne prompt'larına dokunmaz.</p>
    </div>
  </details>`;
}

function sahneListe(a){ return a.length < 2 ? String(a[0]) : a.slice(0, -1).join(", ") + " ve " + a[a.length - 1]; }

function kvBox(b, sc){
  const k = sc.kv, id = b.no + "-" + sc.n + "-k";
  const sabit = k.tip === "sabit";
  const o = sabit ? { sabit: true, old: k.simdi, neu: k.simdi } : { sabit: false, old: k.onceki, neu: k.simdi, abs: Math.abs(k.fark), up: k.fark > 0 };
  PROMPTS.set(id, KasaMotor.buildPrompt(o, KC));
  let where = `Sahne ${sc.n}'${DAT[sc.n]} ekle`, same = "";
  if (sabit) {
    const g = b.sahneler.filter(x => x.kv && x.kv.tip === "sabit" && x.kv.simdi === k.simdi).map(x => x.n);
    if (g.length > 1) {
      if (g[0] === sc.n) where = `Sahne ${sahneListe(g)}'${DAT[g[g.length - 1]]} ekle (aynı klip)`;
      else { where = `Sahne ${g[0]}'${LOK[g[0]]} klibi kullan`; same = `<p class="note">Bakiye Sahne ${g[0]} ile aynı: o sahne için ürettiğin sabit kasa klibini buraya da koy, yeniden üretme.</p>`; }
    }
  }
  const val = sabit
    ? `<p class="val">Sabit: ${fmt(k.simdi)} · altta fark yazısı yok</p>`
    : `<p class="val ${k.fark>0?"up":"down"}">${fmt(k.onceki)} → ${fmt(k.simdi)} (${k.fark>0?"+":"−"}${fmt(Math.abs(k.fark))})</p>`;
  const why = k.neden.length ? `<p class="note">${esc(k.neden.join(" · "))}</p>` : "";
  return `<div class="kvb">
    <div class="top"><span class="lbl">${sabit ? "Sabit kasa" : "Kasa videosu"} · sağ üst · siyah arka plan</span><span class="where">${esc(where)}</span></div>
    ${val}${why}${same}
    <div class="copyrow">${copyBtn(id, sabit ? "Sabit kasa prompt'unu kopyala" : "Kasa prompt'unu kopyala")}
      <label class="made"><input type="checkbox" id="m-${id}" data-made="${id}" ${made.has(id)?"checked":""}> Kasa üretildi</label></div>
    <details class="pr" data-pid="${id}"><summary>Prompt'u göster</summary><pre class="prompt"></pre></details>
  </div>`;
}

function cover(b){
  const c = b.kapak, pid = b.no + "-k";
  PROMPTS.set(pid, c.prompt);
  return `<div class="cover">
    <div class="frame" aria-hidden="true"><span class="t1">${esc(c.yazi[0])}</span><span class="t2">${esc(c.yazi[1])}</span><span class="t3">${esc(c.yazi[3] || "")}</span></div>
    <div class="body">
      <span class="lbl">Kapak fotoğrafı · ${esc(c.yer)}</span>
      <p>${esc(c.tr)}</p>
      <p class="yazi"><b>Kapağa yazılacak:</b> ${c.yazi.map(esc).join(" · ")}</p>
      <div class="copyrow">${copyBtn(pid, "Kapak prompt'unu kopyala")}
        <label class="made"><input type="checkbox" id="m-${pid}" data-made="${pid}" ${made.has(pid)?"checked":""}> Kapak üretildi</label></div>
      <details class="pr" data-pid="${pid}"><summary>Prompt'u göster</summary><pre class="prompt"></pre></details>
    </div>
  </div>`;
}

function caption(b){
  const a = b.aciklama;
  if (!a) return "";
  const id = b.no + "-a";
  PROMPTS.set(id, a.tam);
  return `<div class="cap">
    <span class="lbl">Instagram açıklaması · 4 hashtag</span>
    <pre class="txt">${esc(a.metin)}</pre>
    <p class="tags">${a.etiketler.map(esc).join(" ")}</p>
    <div class="copyrow">${copyBtn(id, "Açıklamayı kopyala")}</div>
  </div>`;
}

function epProgress(b){ return b.sahneler.filter(s => made.has(b.no+"-"+s.n)).length; }

function sceneCard(b, sc){
  const pid = b.no + "-" + sc.n;
  PROMPTS.set(pid, sc.prompt);
  PROMPTS.set(pid + "-b", sc.basit);
  const done = made.has(pid);
  const when = sc.fb ? "anı" : (sc.saat + " · " + sc.faz);
  return `<article class="scene ${done?"done":""}" data-scene="${pid}">
    <div class="sc-top">
      <span class="sc-n">Sahne ${sc.n}</span>
      <span class="when">${esc(when)}</span>
      <span class="sc-place">${esc(sc.yer)}</span>
      ${sc.kasa != null ? `<span class="kasa">KASA: ${fmt(sc.kasa)}</span>` : ""}
      <label class="made"><input type="checkbox" id="m-${pid}" data-made="${pid}" ${done?"checked":""}> Üretildi</label>
    </div>
    <p class="olay">${esc(sc.tr)}</p>
    ${sc.dlg.length ? `<div class="dlg">${sc.dlg.map(d => `<p><b>${esc(d[0])}:</b>“${esc(d[1])}” ${d[2] ? `<i>(${esc(d[2])})</i>` : ""}</p>`).join("")}</div>` : `<p class="note">Konuşma yok.</p>`}
    ${sc.kurgu.map(k => `<p class="note"><b>Kurgu notu:</b> ${esc(k)}</p>`).join("")}
    <div class="pr-wrap">
      <div class="copyrow">${copyBtn(pid, "Flow prompt'unu kopyala")}${copyBtn(pid + "-b", "Yeniden dene (sade) kopyala", true)}</div>
      <details class="pr" data-pid="${pid}"><summary>Prompt'u göster</summary><pre class="prompt"></pre></details>
      <details class="pr" data-pid="${pid}-b"><summary>Yeniden dene: sadeleştirilmiş prompt</summary><pre class="prompt"></pre></details>
      <p class="note">Üretince kontrol et: yüz, eller, ışık, dudak uyumu.</p>
    </div>
    ${sc.kv ? kvBox(b, sc) : ""}
  </article>`;
}

function renderSeason(id){
  PROMPTS.clear();
  const s = DATA.sezonlar.find(x => x.id === id);
  const eps = DATA.bolumler.filter(b => b.no >= s.ilk && b.no <= s.son);
  const jump = eps.map(b => `<button type="button" data-jump="${b.no}" class="${epProgress(b)===6?"full":""}" title="${esc(b.il)} · ${esc(b.baslik)}">${b.no}</button>`).join("");
  const ep = b => {
    const k = b.kasa;
    const guests = b.konuk.length ? `<details class="guests"><summary>Bu bölümün konuk karakterleri (${b.konuk.length})</summary>
      ${b.konuk.map(g => `<div class="guest"><b>${esc(g.ad)}</b><pre class="prompt">${esc(g.en)}.\nVoice: ${esc(g.ses)}.</pre></div>`).join("")}</details>` : "";
    return `<section class="ep" id="ep-${b.no}">
      <div class="ep-head">
        <div class="row"><span class="ep-no">Bölüm ${b.no} · Gün ${b.gun} · ${esc(b.il)}</span><span class="ep-prog" data-prog="${b.no}">${epProgress(b)}/6 sahne üretildi</span></div>
        <div class="chips"><span class="chip">${esc(b.mevsim)}</span><span class="chip">${esc(b.hava)}</span></div>
        <h2>${esc(b.baslik)}</h2>
        <p class="muted">${esc(b.ozet)}</p>
        ${b.onceki_son ? `<p class="prev"><b>Önceki bölümün sonu</b>${esc(b.onceki_son)}</p>` : ""}
        <p class="plan"><b>Günün planı:</b> ${b.plan.map(esc).join(" → ")}</p>
        <p class="trade"><b>Satılan:</b> ${esc(b.satilan)} &nbsp;·&nbsp; <b>Alınan:</b> ${esc(b.alinan)}</p>
        ${k ? `<div class="ledger"><table>
          <thead><tr><th>Açılış</th><th>Yol</th><th>Masraf</th><th>Satış</th><th>Alış</th><th>Kapanış</th></tr></thead>
          <tbody><tr><td>${fmt(k.acilis)}</td><td class="minus">−${fmt(k.yol)}</td><td class="minus">−${fmt(k.masraf)}</td><td>+${fmt(k.satis)}</td><td class="minus">−${fmt(k.alis)}</td><td class="close">${fmt(k.kapanis)}</td></tr></tbody>
        </table></div>` : `<p class="note">Kasa göstergesi Bölüm 4'te başlar.</p>`}
        ${guests}
        ${cover(b)}
        ${caption(b)}
      </div>
      <div class="scenes">${b.sahneler.map(sc => sceneCard(b, sc)).join("")}</div>
      <div class="cliff"><span class="lbl">Bölüm sonu</span><p>${esc(b.son)}</p></div>
    </section>`;
  };
  return `<div class="season-head">
      <span class="eyebrow">${esc(s.alt)}</span>
      <h2>${esc(s.ad)}</h2>
      <p class="muted">${eps.length} bölüm, ${eps.length*6} sahne. Bölüme gitmek için numaraya dokun. Yeşil numaralar 6 sahnesi de üretilmiş bölümlerdir.</p>
      <div class="jump">${jump}</div>
      ${kasaAyarHtml()}
    </div>
    ${eps.map(ep).join("")}`;
}

/* ---------- Kasa aracı sekmesi: serbest giriş ---------- */
const KA_KEY = "kasa-prompt-giris";
const KA_ORNEK = "7.000 ₺ → 6.700 ₺ (−300 ₺)\n15.300 ₺ → 16.500 ₺ (+1.200 ₺)\nSabit: 16.500 ₺";
const KA_EKLE = { down: "7.000 ₺ → 6.700 ₺ (−300 ₺)", up: "15.300 ₺ → 16.500 ₺ (+1.200 ₺)", hold: "Sabit: 16.500 ₺" };
const KA = { metin: null, clips: [], sigs: [], prev: [], durum: "", timer: 0 };
function kaYukle(){
  if (KA.metin === null) { KA.metin = KA_ORNEK; try { const t = localStorage.getItem(KA_KEY); if (t !== null) KA.metin = t; } catch (e) {} }
  return KA.metin;
}
function kaKaydet(t){ KA.metin = t; try { localStorage.setItem(KA_KEY, t); } catch (e) {} }
const kaPara = n => KasaMotor.fmt(n) + " " + KC.birim;

function kaKart(no, i, o){
  const sabit = !!o.sabit, cls = o.up ? "up" : "down";
  const chg = sabit ? "" : (o.up ? "+" : "−") + kaPara(o.abs);
  const aria = "Önizleme: sağ üstte " + (KC.etiket !== "yok" ? "KASA " : "") + kaPara(o.neu) + (sabit ? ", altında yazı yok" : ", altında " + (o.up ? "yeşil " : "kırmızı ") + chg);
  const facts = sabit
    ? `<div><dt>Bakiye</dt><dd>${esc(kaPara(o.neu))}</dd></div><div><dt>Altta yazacak</dt><dd><span class="ka-chip hold">Hiçbir şey</span><span class="dir">sabit kasa</span></dd></div>`
    : `<div><dt>Başlangıç</dt><dd>${esc(kaPara(o.old))}</dd></div><div><dt>Bitiş</dt><dd>${esc(kaPara(o.neu))}</dd></div><div><dt>Altta yazacak</dt><dd><span class="ka-chip ${cls}">${esc(chg)}</span><span class="dir">${o.up ? "artış" : "azalış"}</span></dd></div>`;
  return `<article class="ka-clip" data-ka="${i}">
    <header class="ka-head"><h3>Klip ${no}</h3><span class="ka-meta">${sabit ? "sabit kasa · " : ""}8 sn · 9:16 · siyah zemin</span></header>
    <div class="ka-main">
      <div class="ka-shot"><div class="ka-frame" role="img" aria-label="${esc(aria)}"><div class="ka-counter">${KC.etiket !== "yok" ? '<span class="k">KASA</span>' : ""}<span class="b">${esc(kaPara(o.neu))}</span>${sabit ? "" : `<span class="c ${cls}">${esc(chg)}</span>`}</div></div><span class="ka-cap">Önizleme</span></div>
      <dl class="ka-facts">${facts}</dl>
    </div>
    <div class="ka-actions">${copyBtn("ka-" + i, "Prompt'u kopyala")}${sabit ? "" : `<button class="copy alt" type="button" data-kaplay="${i}">Yeniden oynat</button>`}</div>
    <details class="pr" data-pid="ka-${i}"><summary>Prompt metnini göster</summary><pre class="prompt"></pre></details>
  </article>`;
}

function kaHata(it){
  const fx = (it.r.fixes || []).map(f => `<button class="copy alt" type="button" data-kafix="${it.idx}" data-text="${esc(f.text)}">${esc(f.label)}</button>`).join("");
  return `<article class="ka-clip ka-err" role="group" aria-label="Satır ${it.idx + 1} düzeltilmeli">
    <header class="ka-head"><h3>Satır ${it.idx + 1} düzeltilmeli</h3></header>
    <p class="ka-raw">${esc(it.raw.trim())}</p><p class="ka-msg">${esc(it.r.msg)}</p>${fx ? `<div class="ka-actions">${fx}</div>` : ""}
  </article>`;
}

function kaSonucHtml(){
  const items = [];
  kaYukle().split(/\r?\n/).forEach((raw, idx) => { if (raw.trim()) items.push({ raw: raw, idx: idx, r: KasaMotor.parseLine(raw) }); });
  KA.clips.length = 0; KA.sigs = [];
  let html = "", no = 0, errs = 0;
  items.forEach(it => {
    if (it.r && it.r.ok) {
      const i = KA.clips.length;
      KA.clips.push(it.r); KA.sigs.push(it.raw.trim() + "|" + KC.birim + KC.gecis + KC.etiket);
      PROMPTS.set("ka-" + i, KasaMotor.buildPrompt(it.r, KC));
      html += kaKart(++no, i, it.r);
    } else { errs++; html += kaHata(it); }
  });
  KA.durum = (no ? no + " klip hazır" : "") + (no && errs ? ", " : "") + (errs ? errs + " satır düzeltilmeli" : "");
  return html || '<p class="note">Henüz satır yok. Yukarıya bir bakiye değişimi yaz ya da örnek ekle.</p>';
}

function renderKasa(){
  PROMPTS.clear(); KA.prev = [];
  const sonuc = kaSonucHtml();
  return `<div class="season-head">
      <span class="eyebrow">Serbest giriş</span>
      <h2>Kasa aracı</h2>
      <p class="muted">Bakiye değişimini yaz, sahne kutularındaki aynı sabit kasa prompt'u hazır olsun. Her satır bir klip. Kasa değişmiyorsa tek sayı yaz.</p>
    </div>
    <div class="ka-entry">
      <label class="ka-lbl" for="ka-giris">Bakiye değişimi <small>her satır bir klip</small></label>
      <textarea id="ka-giris" rows="${Math.max(3, Math.min(8, kaYukle().split(/\r?\n/).length + 1))}" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="7.000 ₺ → 6.700 ₺ (−300 ₺)">${esc(kaYukle())}</textarea>
      <p class="note">Eski bakiye → yeni bakiye (fark) şeklinde yaz. Farkı yazmasan da olur, sayfa hesaplar. Kasa değişmiyorsa tek sayı yaz, örnek: Sabit: 16.500 ₺.</p>
      <p class="note ka-ornek" id="ka-ornek" ${kaYukle().trim() === KA_ORNEK.trim() ? "" : "hidden"}>Örnek satırlar yüklü. Silip kendi bakiye değişimini yaz.</p>
      <div class="ka-chips">
        <button class="copy alt" type="button" data-kaadd="down">Düşüş örneği ekle</button>
        <button class="copy alt" type="button" data-kaadd="up">Artış örneği ekle</button>
        <button class="copy alt" type="button" data-kaadd="hold">Sabit kasa örneği ekle</button>
        <button class="copy alt" type="button" id="ka-temizle">Temizle</button>
      </div>
      ${kasaAyarHtml()}
    </div>
    <h3 class="ka-h">Promptlar <span class="note" id="ka-adet">${esc(KA.durum)}</span></h3>
    <div class="ka-clips" id="ka-sonuc">${sonuc}</div>
    <p class="sr" id="ka-durum" aria-live="polite">${esc(KA.durum)}</p>`;
}

function kaOynat(frame, o){
  if (!frame || !o || o.sabit) return;
  const bal = frame.querySelector(".b"), chg = frame.querySelector(".c");
  const set = v => { bal.textContent = kaPara(v); };
  cancelAnimationFrame(frame._raf || 0);
  const bitir = () => { set(o.neu); chg.style.opacity = "1"; };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { bitir(); return; }
  set(o.old); chg.style.opacity = "0";
  const t0 = performance.now();
  const adim = now => {
    const t = (now - t0) / 1000;
    chg.style.opacity = String(Math.max(0, Math.min(1, (t - 1.0) / 0.4)));
    if (t < 1.4) set(o.old);
    else if (KC.gecis === "anlik" || t >= 3.4) set(o.neu);
    else { const p = (t - 1.4) / 2, e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; set(Math.round(o.old + (o.neu - o.old) * e)); }
    if (t < 3.5) frame._raf = requestAnimationFrame(adim); else bitir();
  };
  frame._raf = requestAnimationFrame(adim);
}

function kaBaslat(){
  document.querySelectorAll(".ka-clip[data-ka]").forEach(card => {
    const i = +card.dataset.ka;
    if (KA.prev[i] !== KA.sigs[i]) kaOynat(card.querySelector(".ka-frame"), KA.clips[i]);
  });
  KA.prev = KA.sigs.slice();
}

function kaYenile(){
  const alan = document.getElementById("ka-sonuc");
  if (!alan) return;
  [...PROMPTS.keys()].forEach(k => { if (k.startsWith("ka-")) PROMPTS.delete(k); });
  const ta = document.getElementById("ka-giris");
  ta.rows = Math.max(3, Math.min(8, KA.metin.split(/\r?\n/).length + 1));
  alan.innerHTML = kaSonucHtml();
  document.getElementById("ka-adet").textContent = KA.durum;
  document.getElementById("ka-durum").textContent = KA.durum;
  document.getElementById("ka-ornek").hidden = KA.metin.trim() !== KA_ORNEK.trim();
  kaBaslat();
}

document.addEventListener("input", e => {
  if (e.target.id !== "ka-giris") return;
  kaKaydet(e.target.value);
  document.getElementById("ka-ornek").hidden = KA.metin.trim() !== KA_ORNEK.trim();
  clearTimeout(KA.timer); KA.timer = setTimeout(kaYenile, 280);
});
document.addEventListener("click", e => {
  const ta = document.getElementById("ka-giris");
  const ekle = e.target.closest("[data-kaadd]");
  if (ekle && ta) { const v = ta.value.replace(/\s+$/, ""); ta.value = (v ? v + "\n" : "") + KA_EKLE[ekle.dataset.kaadd]; kaKaydet(ta.value); kaYenile(); return; }
  if (e.target.closest("#ka-temizle") && ta) { ta.value = ""; kaKaydet(""); kaYenile(); ta.focus(); return; }
  const fx = e.target.closest("[data-kafix]");
  if (fx && ta) { const l = ta.value.split(/\r?\n/); l[+fx.dataset.kafix] = fx.dataset.text; ta.value = l.join("\n"); kaKaydet(ta.value); kaYenile(); return; }
  const pl = e.target.closest("[data-kaplay]");
  if (pl) kaOynat(pl.closest(".ka-clip").querySelector(".ka-frame"), KA.clips[+pl.dataset.kaplay]);
});

function route(){
  const id = (location.hash || "").slice(1);
  const cur = ROUTES.some(r => r.id === id) ? id : "karakterler";
  renderTabs(cur);
  const v = document.getElementById("view");
  v.innerHTML = cur === "karakterler" ? renderChars() : cur === "takvim" ? renderCal() : cur === "kasa" ? renderKasa() : renderSeason(cur);
  if (cur === "kasa") kaBaslat();
  if (pending) { document.getElementById("ep-" + pending)?.scrollIntoView(); pending = null; }
  else window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) {
    e.preventDefault();
    const sid = seasonOf(+g.dataset.go);
    pending = +g.dataset.go;
    if (location.hash === "#" + sid) route(); else location.hash = sid;
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const key = c.dataset.copy, text = PROMPTS.get(key) || "";
    const ok = () => { const t = c.textContent; c.textContent = "Kopyalandı"; c.classList.add("done"); setTimeout(() => { c.textContent = t; c.classList.remove("done"); }, 1500); };
    const fallback = () => {
      const d = document.querySelector(`details[data-pid="${key}"]`);
      if (d) { d.open = true; const p0 = d.querySelector("pre"); if (p0 && !p0.textContent) p0.textContent = text; }
      const pre = (d && d.querySelector("pre")) || c.closest(".char, .recipe, .cap")?.querySelector("pre");
      if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      c.textContent = "Seçildi, kopyalayın";
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
    return;
  }
  const j = e.target.closest("[data-jump]");
  if (j) document.getElementById("ep-" + j.dataset.jump)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d && d.id === "kc-ayar") { kcAcik = d.open; return; }
  if (!d || d.tagName !== "DETAILS" || !d.open || !d.dataset.pid) return;
  const pre = d.querySelector("pre");
  if (pre && !pre.textContent) pre.textContent = PROMPTS.get(d.dataset.pid) || "";
}, true);
document.addEventListener("change", e => {
  const kc = e.target.closest("[data-kc]");
  if (kc) {
    KC[kc.dataset.kc] = kc.value; saveKC(); kcAcik = true;
    const y = window.scrollY, fid = kc.id;
    route(); window.scrollTo(0, y);
    document.getElementById(fid)?.focus({ preventScroll: true });
    return;
  }
  const m = e.target.closest("[data-made]");
  if (!m) return;
  const id = m.dataset.made;
  m.checked ? made.add(id) : made.delete(id);
  save();
  m.closest("article.scene")?.classList.toggle("done", m.checked);
  const no = +id.split("-")[0];
  const b = DATA.bolumler.find(x => x.no === no);
  const n = epProgress(b);
  const p = document.querySelector(`[data-prog="${no}"]`); if (p) p.textContent = n + "/6 sahne üretildi";
  const jb = document.querySelector(`[data-jump="${no}"]`); if (jb) jb.classList.toggle("full", n === 6);
});
window.addEventListener("hashchange", route);
route();
</script>
